<style>
:root {
  --bg: #000000;
  --panel: #0a120a;
  --line: #00ff41;
  --txt: #00ff41;
  --accent: #00ff41;
  --danger: #ff003c;
  --gold: #ffcc00;
  --bar-bg: #001a00;
  --enemy-bar: #ff003c;
  --player-bar: #00ff41;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: monospace;
}
button {
  font: inherit;
  color: var(--txt);
  background: #001a00;
  border: 1px solid var(--line);
  padding: 10px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:active { background: #003300; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.app { max-width: 1200px; margin: auto; padding: 12px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 12px;
}
h1 { margin: 0; color: var(--accent); font-size: 20px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.stats span { background: #001a00; border: 1px solid #00aa2a; padding: 4px 6px; }

.layout { display: grid; grid-template-columns: 1fr 280px; gap: 12px; }
.panel { background: var(--panel); border: 1px solid #00aa2a; border-radius: 4px; padding: 12px; margin-bottom: 12px; }

.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
.log-title { font-weight: bold; color: var(--accent); }
.quick-status { display: flex; gap: 6px; font-size: 11px; }
.quick-status span { background: #000800; border: 1px solid #00aa2a; padding: 2px 5px; }

.log { height: 110px; overflow-y: auto; background: #000800; border: 1px solid #00aa2a; padding: 8px; font-size: 12px; }
.log-item { margin-bottom: 4px; border-bottom: 1px dotted #003300; padding-bottom: 2px; }

.tabs, .subtabs { display: grid; gap: 6px; }
.tabs { grid-template-columns: repeat(6, 1fr); margin-bottom: 12px; }
.subtabs { grid-template-columns: repeat(6, 1fr); margin-bottom: 12px; }
.tabs button.active, .subtabs button.active { color: #000; background: var(--accent); font-weight: bold; }

.map-box {
  min-height: 120px;
  background: linear-gradient(#001a00 1px, transparent 1px), linear-gradient(90deg, #001a00 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid #00aa2a;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
}
.world-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  max-width: 280px;
  margin: 10px auto;
  background: #000800;
  padding: 6px;
  border: 1px solid #00aa2a;
}
.world-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  border: 1px solid #003300;
  background: #001000;
  color: #4a7a4a;
  position: relative;
  min-height: 32px;
}
.world-cell.player {
  border-color: var(--accent);
  background: #003300;
  box-shadow: 0 0 8px #00ff4166;
  color: var(--accent);
  font-weight: bold;
}
.world-cell.river { background: #001a22; color: #00aacc; }
.world-cell.city { background: #1a1000; color: #ccaa00; }
.world-cell.ruin { background: #120800; color: #aa7744; }
.world-cell.poi { background: #001a10; color: var(--gold); }
.world-cell.camp { background: #101000; color: #aacc66; }
.world-cell.empty { background: #000a00; color: #335533; }
.world-cell.road { background: #0a0a00; color: #888866; }
.world-cell.enterable { outline: 1px dashed var(--accent); }
.zone-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  border: 1px solid var(--line);
  margin: 2px;
}
.interior-room {
  border: 1px solid var(--accent);
  background: #001400;
  padding: 12px;
  margin: 8px 0;
  text-align: center;
}
.map-controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 420px;
  margin: 12px auto 0 auto;
  align-items: center;
}
.map-arrows {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  width: 160px;
}
.map-arrows button { font-size: 18px; font-weight: bold; padding: 10px; }
.quick-meds, .quick-radio {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quick-meds button, .quick-radio button {
  font-size: 11px;
  padding: 8px 6px;
  white-space: nowrap;
}
.radio-panel {
  border: 1px solid var(--accent);
  background: #001400;
  padding: 14px;
  margin-top: 8px;
}
.radio-panel h3 { color: var(--accent); margin-top: 0; }
.radio-status {
  font-size: 12px;
  color: var(--gold);
  margin: 8px 0;
  min-height: 18px;
}

.item { padding: 10px; border: 1px solid #00aa2a; background: #000a00; margin-bottom: 8px; }
.item-head { display: flex; justify-content: space-between; align-items: center; }
.equipped-tag { color: var(--accent); border: 1px solid var(--line); font-size: 10px; padding: 2px 4px; }
.row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #003300; font-size: 13px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
.modal.show { display: flex; }
.modal-content { background: var(--panel); border: 2px solid var(--accent); padding: 16px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; }

.progress-bar { background: var(--bar-bg); border: 1px solid #00aa2a; height: 14px; border-radius: 2px; overflow: hidden; margin: 4px 0 10px 0; }
.progress-fill { height: 100%; width: 0%; transition: width 0.3s; }

.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.spec-box { background: #000a00; border: 1px solid #00aa2a; padding: 8px; display: flex; justify-content: space-between; align-items: center; }

.vault-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.lunchbox-card { background: #000a00; border: 1px solid #00aa2a; padding: 12px; text-align: center; }

/* ===== COMBATE ESTILO PIP-BOY ===== */
.combat-title {
  color: var(--danger);
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 0 0 16px 0;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255,0,60,0.6);
}
.combat-entity {
  margin-bottom: 14px;
}
.combat-entity-name {
  font-size: 14px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.combat-entity-name.enemy { color: var(--danger); }
.combat-entity-name.player { color: var(--accent); }
.combat-hp-bar {
  background: #001100;
  border: 1px solid #00aa2a;
  height: 18px;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.combat-hp-fill {
  height: 100%;
  transition: width 0.35s ease;
}
.combat-hp-fill.enemy { background: var(--enemy-bar); box-shadow: 0 0 10px rgba(255,0,60,0.5); }
.combat-hp-fill.player { background: var(--player-bar); box-shadow: 0 0 10px rgba(0,255,65,0.4); }
.combat-log {
  background: #000800;
  border: 1px solid #00aa2a;
  height: 90px;
  overflow-y: auto;
  padding: 8px;
  font-size: 12px;
  margin: 12px 0;
}
.combat-log div { margin-bottom: 3px; border-bottom: 1px dotted #002200; padding-bottom: 2px; }
.combat-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}
.combat-btn-attack {
  background: #330000;
  border: 2px solid var(--danger);
  color: var(--danger);
  font-weight: bold;
  padding: 14px 8px;
  font-size: 14px;
}
.combat-btn-attack:active { background: #550000; }
.combat-btn-flee {
  background: #001a00;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-weight: bold;
  padding: 14px 8px;
  font-size: 14px;
}
.combat-btn-flee:active { background: #003300; }

@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .tabs { grid-template-columns: repeat(3, 1fr); }
  .subtabs { grid-template-columns: repeat(3, 1fr); }
  .spec-grid { grid-template-columns: 1fr; }
  .vault-container { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="app">

    <div class="stats">

      <span>Peso <b id="st-weight">0</b>/<b id="st-maxweight">35</b></span>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="panel">
        <div class="log-header">
          <span class="log-title">REGISTRO DE EVENTOS</span>
          <div class="quick-status">
            <span>HP: <b id="qs-hp" style="color:var(--accent);">100/100</b></span>
            <span>RAD: <b id="qs-rad" style="color:#ff6600;">0</b></span>
            <span>DMG: <b id="qs-dmg">8</b></span>
            <span>DEF: <b id="qs-def">2</b></span>
            <span>BALAS: <b id="qs-ammo">--</b></span>
          </div>
        </div>
        <div id="log" class="log"></div>
      </div>

      <div class="panel">
        <div class="tabs">
          <button id="btn-tab-map" class="active" onclick="switchTab('map', this)">MAPA</button>
          <button onclick="switchTab('char', this)">PERSONAJE</button>
          <button onclick="switchTab('inv', this)">INVENTARIO</button>
          <button onclick="switchTab('vault', this)">REFUGIO</button>
          <button onclick="switchTab('quests', this)">MISIONES</button>
          <button onclick="switchTab('shop', this)">COMERCIO</button>
        </div>
        <div id="main-view"></div>
      </div>
    </main>

    <aside class="panel">
      <h3 style="margin-top:0; color:var(--accent);" id="aside-name">SUPERVIVIENTE</h3>
      <div class="row"><span>Vida</span><span id="aside-hp">100/100</span></div>
      <div class="row"><span>Radiación</span><span id="aside-rad" style="color:#ff6600;">0 / 1000</span></div>
      <div class="row"><span>Res. RAD</span><span id="aside-radres">0%</span></div>
      <div class="row"><span>Daño</span><span id="aside-dmg">8</span></div>
      <div class="row"><span>Defensa</span><span id="aside-def">2</span></div>
      <div class="row"><span>Munición</span><span id="aside-ammo">--</span></div>
      <div class="row"><span>Arma</span><span id="aside-wpn">Pistola oxidada</span></div>
      <div class="row"><span>Armadura</span><span id="aside-arm">Ropa de superviviente</span></div>
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-top:12px;">
        <button onclick="pipClick(); renameSurvivor()">Renombrar</button>
        <button onclick="pipClick(); saveGame()">Guardar</button>
        <button onclick="pipClick(); loadGame()">Cargar</button>
        <button onclick="pipClick(); resetGame()">Reiniciar</button>
      </div>
    </aside>
    <audio id="radio-audio" loop preload="none" crossorigin="anonymous"
      src="https://archive.org/download/IDontWantToSetTheWorldOnFireTheInkSpots/I%20Don%27t%20Want%20To%20Set%20The%20World%20On%20Fire-The%20Ink%20Spots.mp3"></audio>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modal-body"></div>
</div>

// Genera un objeto legendario (arma o armadura) con habilidad aleatoria
function generateLegendaryItem(preferType = null) {
  let candidates = DB_ITEMS.filter(i => 
    (i.type === 'weapon' || i.type === 'armor') && 
    i.shopTier >= 2 && i.shopTier <= 8
  );
  if (preferType) candidates = candidates.filter(i => i.type === preferType);
  if (candidates.length === 0) candidates = DB_ITEMS.filter(i => i.type === 'weapon' || i.type === 'armor');

  let base = candidates[Math.floor(Math.random() * candidates.length)];
  let abilityPool = base.type === 'weapon' ? LEG_WEAPON_ABILITIES : LEG_ARMOR_ABILITIES;
  let ability = abilityPool[Math.floor(Math.random() * abilityPool.length)];

  let newUid = Date.now() + Math.floor(Math.random() * 100000);
  let inst = {
    uid: newUid,
    id: base.id,
    qty: 1,
    mods: [],
    legendary: true,
    abilityId: ability.id,
    abilityName: ability.name,
    abilityDesc: ability.desc
  };
  return inst;
}

function addLegendaryToInv(preferType = null) {
  let inst = generateLegendaryItem(preferType);
  let base = getItemBase(inst.id);

  let currentWeight = P.inv.reduce((acc, i) => {
    let b = getItemBase(i.id);
    return acc + ((b?.weight || 0) * (i.qty || 1));
  }, 0);

  if (currentWeight + (base.weight || 1) > getMaxWeight()) {
    logMsg("¡Mochila llena! No puedes cargar el objeto legendario.");
    return null;
  }

  P.inv.push(inst);
  return inst;
}

function getWeaponAbility() {
  let inst = P.inv.find(i => i.uid === P.equippedWeaponUid);
  if (inst && inst.legendary && inst.abilityId) {
    return LEG_WEAPON_ABILITIES.find(a => a.id === inst.abilityId) || null;
  }
  return null;
}

function getArmorAbility() {
  let inst = P.inv.find(i => i.uid === P.equippedArmorUid);
  if (inst && inst.legendary && inst.abilityId) {
    return LEG_ARMOR_ABILITIES.find(a => a.id === inst.abilityId) || null;
  }
  return null;
}

function getItemBase(id) { return DB_ITEMS.find(i => i.id === id); }
function getRequiredXP() { return P.lvl * 100; }

function getCumulativeBonus(n) {
  if (n <= 0) return 0;
  return (n * (n + 1)) / 2;
}

function getMaxWeight() {
  let strBonus = (P.special ? P.special.S : 1) * 10;
  let bagCapacity = Math.min(500, P.baseMaxWeight);
  let perkBonus = ((P.perks && P.perks.p_mule) || 0) * 10;
  let legBonus = 0;
  let armAb = getArmorAbility();
  if (armAb && armAb.id === 'a_weight') legBonus = 25;
  return bagCapacity + strBonus + perkBonus + legBonus;
}

function getBaseMaxHp() {
  let perkBonus = ((P.perks && P.perks.p_tough) || 0) * 20;
  let levelHpBonus = 0;
  if (P.lvl >= 2) {
    levelHpBonus = 20 + ((P.lvl - 2) * 10);
  }
  let legBonus = 0;
  let armAb = getArmorAbility();
  if (armAb) {
    if (armAb.id === 'a_hp') legBonus = 40;
    if (armAb.id === 'a_tank') legBonus = 20;
  }
  return P.baseMaxHp + levelHpBonus + perkBonus + legBonus;
}

// La radiación reduce el máximo de vida efectivo
function getRadHpMult() {
  let r = P.rads || 0;
  if (r >= 1000) return 0.20;
  if (r >= 800) return 0.35;
  if (r >= 600) return 0.55;
  if (r >= 400) return 0.75;
  if (r >= 200) return 0.90;
  return 1.0;
}

function getMaxHp() {
  return Math.max(1, Math.floor(getBaseMaxHp() * getRadHpMult()));
}

// Resistencia a radiación de la armadura (0-80%)
function getRadResistance() {
  let a = getEquippedArmor();
  let res = 0;
  // Defensa aporta resistencia (aprox)
  if (a && a.def) res += Math.min(50, a.def * 0.8);
  // Servoarmaduras y hazmat
  if (a && a.name) {
    let n = a.name.toLowerCase();
    if (n.includes('hazmat') || n.includes('antirradi')) res += 40;
    if (n.includes('servoarmadura') || n.includes('t-45') || n.includes('t-51') || n.includes('t-60') || n.includes('x-01')) res += 25;
  }
  let armAb = getArmorAbility();
  if (armAb && armAb.id === 'a_radres') res += 50;
  // Rad-X efecto activo
  res += getEffectBonus('radRes') || 0;
  return Math.min(85, Math.floor(res));
}

function addRads(amount) {
  if (amount <= 0) return;
  let res = getRadResistance();
  let actual = Math.max(1, Math.floor(amount * (1 - res / 100)));
  P.rads = Math.min(1000, (P.rads || 0) + actual);
  logMsg("Radiación +" + actual + " (total: " + P.rads + "/1000)" + (res > 0 ? " [Res " + res + "%]" : ""));
  // Ajustar HP si supera el nuevo máximo
  let maxhp = getMaxHp();
  if (P.hp > maxhp) P.hp = maxhp;
}

function removeRads(amount) {
  let before = P.rads || 0;
  P.rads = Math.max(0, before - amount);
  let removed = before - P.rads;
  if (removed > 0) logMsg("Radiación -" + removed + " (total: " + P.rads + "/1000)");
  return removed;
}

function getRadStatusText() {
  let r = P.rads || 0;
  if (r >= 800) return "CRÍTICA";
  if (r >= 600) return "Grave";
  if (r >= 400) return "Alta";
  if (r >= 200) return "Moderada";
  if (r > 0) return "Baja";
  return "Limpia";
}

function getDefenseBonusFromEndurance() {
  let endPts = P.special ? P.special.E : 1;
  return getCumulativeBonus(endPts);
}

function formatItemGainName(item, count = 1) {
  if (!item) return "";
  if (item.type === 'ammo') {
    let totalBalas = (item.qty || 1) * count;
    return `${totalBalas} balas de ${item.name}`;
  }
  return count > 1 ? `${count}x ${item.name}` : `1x ${item.name}`;
}

function addItemToInv(baseId, count = 1) {
  let it = getItemBase(baseId);
  if (!it) return false;

  if (it.type === 'ammo') {
    let addQty = (it.qty || 1) * count;
    P.ammoBox[it.ammoKey] = (P.ammoBox[it.ammoKey] || 0) + addQty;
    return true;
  }
  
  let currentWeight = P.inv.reduce((acc, inst) => {
    let base = getItemBase(inst.id);
    return acc + ((base?.weight || 0) * (inst.qty || 1));
  }, 0);

  let addedWeight = it.weight * count;

  if (currentWeight + addedWeight > getMaxWeight()) {
    logMsg("¡Mochila llena! No puedes cargar " + formatItemGainName(it, count) + ".");
    return false;
  }

  if (it.stackable) {
    let existing = P.inv.find(i => i.id === baseId);
    if (existing) {
      existing.qty = (existing.qty || 1) + count;
      return existing.uid;
    }
  }

  let newUid = Date.now() + Math.floor(Math.random() * 100000);
  P.inv.push({ uid: newUid, id: baseId, qty: count, mods: [] });
  return newUid;
}

function removeOneItemByBaseId(baseId) {
  let idx = P.inv.findIndex(i => i.id === baseId);
  if (idx !== -1) {
    let inst = P.inv[idx];
    if (inst.qty && inst.qty > 1) {
      inst.qty--;
    } else {
      P.inv.splice(idx, 1);
    }
    return true;
  }
  return false;
}

function countItemsByBaseId(baseId) {
  let it = getItemBase(baseId);
  if (it && it.type === 'ammo') {
    return P.ammoBox[it.ammoKey] || 0;
  }
  return P.inv.filter(i => i.id === baseId).reduce((acc, i) => acc + (i.qty || 1), 0);
}

function getEquippedWeapon() {
  let inst = P.inv.find(i => i.uid === P.equippedWeaponUid);
  if (!inst) return { name: "Desarmado", damage: 2, ammoType: "Ninguna (Cuerpo a cuerpo)", mods: [], legendary: false };
  let base = getItemBase(inst.id);
  let modDmg = (inst.mods || []).reduce((acc, mId) => {
    let m = MODS_DB.find(x => x.id === mId);
    return acc + (m ? m.bonusDmg || 0 : 0);
  }, 0);
  return { 
    ...base, 
    damage: base.damage + modDmg, 
    mods: inst.mods || [],
    legendary: !!inst.legendary,
    abilityId: inst.abilityId || null,
    abilityName: inst.abilityName || null
  };
}

function getEquippedArmor() {
  let inst = P.inv.find(i => i.uid === P.equippedArmorUid);
  if (!inst) return { name: "Sin armadura", def: 0, mods: [], legendary: false };
  let base = getItemBase(inst.id);
  let modDef = (inst.mods || []).reduce((acc, mId) => {
    let m = MODS_DB.find(x => x.id === mId);
    return acc + (m ? m.bonusDef || 0 : 0);
  }, 0);
  return { 
    ...base, 
    def: base.def + modDef, 
    mods: inst.mods || [],
    legendary: !!inst.legendary,
    abilityId: inst.abilityId || null,
    abilityName: inst.abilityName || null
  };
}

function logMsg(msg) {
  const box = document.getElementById('log');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'log-item';
  el.textContent = "> " + msg;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function updateStats() {
  let wCap = P.inv.reduce((acc, inst) => {
    let base = getItemBase(inst.id);
    return acc + ((base?.weight || 0) * (inst.qty || 1));
  }, 0);
  let maxhp = getMaxHp();
  let maxw = getMaxWeight();
  let reqXp = getRequiredXP();

  if (P.hp > maxhp) P.hp = maxhp;

  document.getElementById('st-lvl').textContent = P.lvl;
  document.getElementById('st-xp').textContent = P.xp;
  document.getElementById('st-maxxp').textContent = reqXp;
  document.getElementById('st-caps').textContent = P.caps;
  document.getElementById('st-weight').textContent = wCap.toFixed(1);
  document.getElementById('st-maxweight').textContent = maxw;

  const w = getEquippedWeapon();
  const a = getEquippedArmor();
  let totalDmg = w.damage + (((P.perks && P.perks.p_iron) || 0) * 3) + getEffectBonus('dmg');
  let totalDef = a.def + (((P.perks && P.perks.p_skin) || 0) * 2) + getDefenseBonusFromEndurance() + getEffectBonus('def');

  let ammoDisplay = w.ammoType.includes("Ninguna") ? "Inf." : (P.ammoBox[w.ammoType] || 0);

  // Penalización de daño por radiación alta
  if ((P.rads || 0) >= 600) totalDmg = Math.max(1, totalDmg - 3);
  if ((P.rads || 0) >= 800) totalDmg = Math.max(1, totalDmg - 2);

  let rads = P.rads || 0;
  let radRes = getRadResistance();
  let radColor = rads >= 600 ? '#ff003c' : (rads >= 200 ? '#ff6600' : 'var(--accent)');

  let nameEl = document.getElementById('aside-name');
  if (nameEl) nameEl.textContent = (P.playerName || "SUPERVIVIENTE").toUpperCase();
  document.getElementById('aside-hp').textContent = P.hp + "/" + maxhp;
  let asideRad = document.getElementById('aside-rad');
  if (asideRad) {
    asideRad.textContent = rads + " / 1000 (" + getRadStatusText() + ")";
    asideRad.style.color = radColor;
  }
  let asideRadRes = document.getElementById('aside-radres');
  if (asideRadRes) asideRadRes.textContent = radRes + "%";
  document.getElementById('aside-wpn').textContent = w.name;
  document.getElementById('aside-arm').textContent = a.name;
  document.getElementById('aside-dmg').textContent = totalDmg;
  document.getElementById('aside-def').textContent = totalDef;
  document.getElementById('aside-ammo').textContent = ammoDisplay;

  document.getElementById('qs-hp').textContent = P.hp + "/" + maxhp;
  let qsRad = document.getElementById('qs-rad');
  if (qsRad) {
    qsRad.textContent = rads;
    qsRad.style.color = radColor;
  }
  document.getElementById('qs-dmg').textContent = totalDmg;
  document.getElementById('qs-def').textContent = totalDef;
  document.getElementById('qs-ammo').textContent = ammoDisplay;
}

function addXP(amount) {
  let bonusXP = Math.floor(amount * (1 + (P.special.I * 0.05) + getEffectBonus('xpMult')));
  if (P.perks && P.perks.p_runner) bonusXP = Math.floor(bonusXP * (1 + (P.perks.p_runner * 0.1)));
  
  P.xp += bonusXP;

  while (P.xp >= getRequiredXP()) {
    P.xp -= getRequiredXP();
    P.lvl++;
    P.specialPts++;
    
    if (P.lvl % 2 === 0) {
      P.perkPts++;
      logMsg("¡Subes al nivel " + P.lvl + "! Ganaste 1 Punto S.P.E.C.I.A.L. y 1 Punto de Perk.");
    } else {
      logMsg("¡Subes al nivel " + P.lvl + "! Ganaste 1 Punto S.P.E.C.I.A.L.");
    }
    
    P.hp = getMaxHp();
  }
}

function openPerkSelection() {
  if (P.perkPts <= 0) return;

  let availablePerks = PERKS_DB.filter(p => ((P.perks && P.perks[p.id]) || 0) < p.maxRank);
  if (availablePerks.length === 0) {
    logMsg("¡Ya has alcanzado el rango máximo en todas las Perks!");
    return;
  }

  let shuffled = [...availablePerks].sort(() => 0.5 - Math.random());
  let options = shuffled.slice(0, 3);

  let m = document.getElementById('modal');
  let html = `
    <h2 style="color:var(--accent);">⚡ ELIGE UNA PERK</h2>
    <p style="font-size:12px; color:#8d9880;">Puntos disponibles: ${P.perkPts}. Selecciona 1 entre estas 3 opciones:</p>
  `;

  options.forEach(pk => {
    let curRank = (P.perks && P.perks[pk.id]) || 0;
    html += `
      <div class="item" style="border-color:var(--accent);">
        <b style="color:var(--accent);">${pk.name}</b>
        <span style="font-size:11px; color:var(--gold);"> (Rango actual: ${curRank}/${pk.maxRank})</span><br>
        <span style="font-size:12px;">${pk.desc}</span><br>
        <button style="margin-top:8px; width:100%; background:var(--accent); color:#111; font-weight:bold;" onclick="selectPerk('${pk.id}')">Elegir Perk</button>
      </div>
    `;
  });

  html += `<button style="margin-top:10px; width:100%;" onclick="closeModal()">Cancelar</button>`;
  document.getElementById('modal-body').innerHTML = html;
  m.classList.add('show');
}

function selectPerk(perkId) {
  let pk = PERKS_DB.find(p => p.id === perkId);
  if (!P.perks) P.perks = {};
  if (!P.perks[perkId]) P.perks[perkId] = 0;

  P.perks[perkId]++;
  P.perkPts--;

  logMsg("¡Has adquirido/subido de rango la Perk: " + pk.name + "!");
  closeModal();
  renderCharacter();
  updateStats();
}

function addSpecialPoint(stat) {
  if (P.specialPts > 0 && P.special[stat] < 10) {
    P.special[stat]++;
    P.specialPts--;
    logMsg("Aumentaste tu atributo S.P.E.C.I.A.L: " + stat);
    renderCharacter();
    updateStats();
  }
}

/* SISTEMA DE REFUGIO CON SUBSECCIONES */

function ensureVaultDefaults() {
  if (!P.craftLevel) P.craftLevel = 1;
  if (!P.modLevel) P.modLevel = 1;
  if (!P.lunchboxLevel) P.lunchboxLevel = 1;
  if (!P.scrapLevel) P.scrapLevel = 1;
  if (!P.alchemyLevel) P.alchemyLevel = 1;
  if (!P.cookLevel) P.cookLevel = 1;
  if (!P.storage) P.storage = [];
  if (P.storageMaxWeight === undefined) P.storageMaxWeight = 100;
  if (P.storageUpgradeRank === undefined) P.storageUpgradeRank = 0;
  if (!P.activeEffects) P.activeEffects = [];
  if (!P.fabricSubtab) P.fabricSubtab = 'crafting';
  if (P.craftPage === undefined) P.craftPage = 0;
  if (P.storagePage === undefined) P.storagePage = 0;
}

function getStorageWeight() {
  return (P.storage || []).reduce((acc, inst) => {
    let b = getItemBase(inst.id);
    return acc + ((b?.weight || 0) * (inst.qty || 1));
  }, 0);
}

function canPayReqs(reqs) {
  return reqs.every(r => countItemsByBaseId(r.id) >= r.qty);
}

function payReqs(reqs) {
  reqs.forEach(r => {
    for (let i = 0; i < r.qty; i++) removeOneItemByBaseId(r.id);
  });
}

function formatReqs(reqs) {
  return reqs.map(r => {
    let it = getItemBase(r.id);
    let owned = countItemsByBaseId(r.id);
    let color = owned >= r.qty ? 'var(--accent)' : 'var(--danger)';
    return `<span style="color:${color}">${it ? it.name : '?'}: ${owned}/${r.qty}</span>`;
  }).join(" | ");
}

function tickEffects() {
  if (!P.activeEffects || P.activeEffects.length === 0) return;
  P.activeEffects.forEach(e => e.remaining--);
  let expired = P.activeEffects.filter(e => e.remaining <= 0);
  expired.forEach(e => logMsg("Efecto terminado: " + e.name));
  P.activeEffects = P.activeEffects.filter(e => e.remaining > 0);
}

function applyConsumableEffect(item) {
  if (!item.effectId) return;
  if (!P.activeEffects) P.activeEffects = [];
  // Reemplazar mismo efecto si ya existe
  P.activeEffects = P.activeEffects.filter(e => e.id !== item.effectId);
  P.activeEffects.push({
    id: item.effectId,
    name: item.effectName || item.name,
    desc: item.effectDesc || "",
    remaining: item.effectActions || 3,
    bonus: item.effectBonus || {}
  });
  logMsg("Efecto activo: " + (item.effectName || item.name) + " (" + (item.effectActions || 3) + " acciones)");
}

function getEffectBonus(key) {
  if (!P.activeEffects) return 0;
  return P.activeEffects.reduce((acc, e) => acc + ((e.bonus && e.bonus[key]) || 0), 0);
}

  let fab = P.fabricSubtab || 'crafting';
  let html = `
    <div class="subtabs" style="grid-template-columns: repeat(4, 1fr);">
      <button class="${fab === 'crafting' ? 'active' : ''}" onclick="P.fabricSubtab='crafting'; P.craftPage=0; renderVault('fabric')">Taller</button>
      <button class="${fab === 'mods' ? 'active' : ''}" onclick="P.fabricSubtab='mods'; renderVault('fabric')">Armería</button>
      <button class="${fab === 'alchemy' ? 'active' : ''}" onclick="P.fabricSubtab='alchemy'; P.craftPage=0; renderVault('fabric')">Alquimia</button>
      <button class="${fab === 'cook' ? 'active' : ''}" onclick="P.fabricSubtab='cook'; P.craftPage=0; renderVault('fabric')">Cocina</button>
    </div>
  `;

  if (fab === 'crafting') {
    html += renderRecipeList(CRAFT_RECIPES, P.craftLevel, 'craftLvl', 'craftItem', 'Taller', P.craftLevel);
  } else if (fab === 'mods') {
    html += renderArmoryUI();
  } else if (fab === 'alchemy') {
    html += renderRecipeList(ALCHEMY_RECIPES, P.alchemyLevel, 'alchemyLvl', 'craftAlchemy', 'Alquimia', P.alchemyLevel);
  } else if (fab === 'cook') {
    html += renderRecipeList(COOK_RECIPES, P.cookLevel, 'cookLvl', 'craftCook', 'Cocina', P.cookLevel);
  }
  return html;
}

function renderRecipeList(recipes, level, lvlKey, fnName, title, showLvl) {
  const PER_PAGE = 5;
  let page = P.craftPage || 0;
  let available = recipes.filter(r => (r[lvlKey] || 1) <= level);
  let locked = recipes.filter(r => (r[lvlKey] || 1) > level);
  let totalPages = Math.max(1, Math.ceil(available.length / PER_PAGE));
  if (page >= totalPages) page = totalPages - 1;
  P.craftPage = page;
  let slice = available.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);

  let html = `<p style="font-size:12px; color:#8d9880;">Nivel ${title}: <b style="color:var(--accent);">${showLvl}/5</b></p>`;
  if (available.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">No hay recetas desbloqueadas. Mejora esta estación en Mejoras.</p>`;
  } else {
    html += `<p style="font-size:11px; color:#8d9880;">Página ${page + 1}/${totalPages}</p>`;
    slice.forEach(rec => {
      let itemObj = getItemBase(rec.id);
      if (!itemObj) return;
      let can = canPayReqs(rec.reqs);
      let stats = '';
      if (itemObj.damage) stats = 'Daño: ' + itemObj.damage;
      else if (itemObj.def) stats = 'Defensa: ' + itemObj.def;
      else if (itemObj.heal) stats = 'Cura: ' + itemObj.heal;
      else if (itemObj.effectDesc) stats = itemObj.effectDesc;
      html += `
        <div class="item">
          <b style="color:var(--accent);">${itemObj.name}</b> ${stats ? '(' + stats + ')' : ''}<br>
          <span style="font-size:11px;">Requisitos: ${formatReqs(rec.reqs)}</span><br>
          <button style="margin-top:6px;" ${!can ? 'disabled' : ''} onclick="${fnName}(${rec.id})">Fabricar</button>
        </div>
      `;
    });
    if (totalPages > 1) {
      html += `<div style="display:flex; justify-content:center; gap:10px; margin-top:10px; align-items:center;">
        <button ${page <= 0 ? 'disabled' : ''} onclick="P.craftPage=${page - 1}; renderVault('fabric')">◀ Anterior</button>
        <span style="font-size:12px; color:var(--accent);">${page + 1}/${totalPages}</span>
        <button ${page >= totalPages - 1 ? 'disabled' : ''} onclick="P.craftPage=${page + 1}; renderVault('fabric')">Siguiente ▶</button>
      </div>`;
    }
  }
  if (locked.length > 0) {
    html += `<p style="font-size:11px; color:#8d9880; margin-top:10px;">${locked.length} recetas bloqueadas (mejora el nivel).</p>`;
  }
  return html;
}

function renderArmoryUI() {
  let html = `<p style="font-size:12px; color:#8d9880;">Nivel Armería: <b style="color:var(--accent);">${P.modLevel}/5</b>. Mira/cañón solo a distancia; empuñadura/filo solo melee.</p>`;
  let eqWpn = P.inv.find(i => i.uid === P.equippedWeaponUid);
  let eqArm = P.inv.find(i => i.uid === P.equippedArmorUid);
  [eqWpn, eqArm].forEach(inst => {
    if (!inst) return;
    let base = getItemBase(inst.id);
    let installedMods = inst.mods || [];
    let isMelee = base.type === 'weapon' && (base.ammoType || '').includes('Ninguna');
    html += `
      <div class="item" style="border-color:var(--gold);">
        <b>${base.name}</b> <span class="equipped-tag">EQUIPADO</span>${isMelee ? ' <span style="font-size:10px;">(Melee)</span>' : ''}<br>
        <span style="font-size:11px; color:#8d9880;">Mejoras: ${installedMods.length > 0 ? installedMods.map(m => MODS_DB.find(x => x.id === m)?.name).join(", ") : "Ninguna"}</span><hr style="border-color:#222;">
    `;
    MODS_DB.filter(m => {
      if (m.target !== base.type) return false;
      if ((m.modLvl || 1) > P.modLevel) return false;
      if (base.type === 'weapon') {
        if (m.rangedOnly && isMelee) return false;
        if (m.meleeOnly && !isMelee) return false;
      }
      return true;
    }).forEach(mod => {
      let hasMod = installedMods.includes(mod.id);
      let canApply = !hasMod && canPayReqs(mod.reqs);
      html += `
        <div style="margin-top:4px; font-size:12px;">
          <span><b>${mod.name}</b> (${mod.bonusDmg ? '+' + mod.bonusDmg + ' Daño' : '+' + mod.bonusDef + ' Def'}) [Nv.${mod.modLvl||1}] — ${formatReqs(mod.reqs)}</span><br>
          <button style="margin-top:2px; font-size:10px; padding:3px 6px;" ${hasMod || !canApply ? 'disabled' : ''} onclick="applyMod(${inst.uid}, '${mod.id}')">${hasMod ? 'Instalada' : 'Instalar'}</button>
        </div>
      `;
    });
    html += `</div>`;
  });
  return html;
}

function renderScrapUI() {
  let html = `<p style="font-size:12px; color:#8d9880;">Nivel Desguace: <b style="color:var(--accent);">${P.scrapLevel}/5</b>. Desguaza armas y armaduras no equipadas para obtener chatarra. Mejor nivel = más materiales.</p>`;
  let list = P.inv.filter(inst => {
    let it = getItemBase(inst.id);
    if (!it) return false;
    if (inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid) return false;
    return it.type === 'weapon' || it.type === 'armor';
  });
  if (list.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">No tienes armas/armaduras desequipadas para desguazar.</p>`;
  } else {
    list.forEach(inst => {
      let it = getItemBase(inst.id);
      let name = (inst.legendary ? '★ ' : '') + it.name;
      html += `<div class="item"><b>${name}</b>
        <button style="margin-left:8px; font-size:11px;" onclick="scrapItem(${inst.uid})">Desguazar</button>
      </div>`;
    });
  }
  return html;
}

function scrapItem(uid) {
  let idx = P.inv.findIndex(i => i.uid === uid);
  if (idx === -1) return;
  let inst = P.inv[idx];
  if (inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid) {
    logMsg("No puedes desguazar un objeto equipado.");
    return;
  }
  let it = getItemBase(inst.id);
  let lvl = P.scrapLevel || 1;
  // Yield escala con nivel y valor del objeto
  let baseJunk = [
    { id: 20, min: 1, max: 2 + lvl },
    { id: 21, min: 1, max: 1 + lvl },
    { id: 22, min: 0, max: lvl },
    { id: 23, min: 0, max: Math.floor(lvl / 2) + 1 }
  ];
  if (it.type === 'weapon' && !(it.ammoType || '').includes('Ninguna')) {
    baseJunk.push({ id: 13, min: 0, max: lvl });
    baseJunk.push({ id: 27, min: 0, max: 1 + Math.floor(lvl / 2) });
  }
  if (it.type === 'armor') {
    baseJunk.push({ id: 24, min: 1, max: 1 + lvl });
    baseJunk.push({ id: 25, min: 0, max: Math.floor(lvl / 2) + 1 });
  }
  if (inst.legendary) {
    baseJunk.push({ id: 28, min: 1, max: 1 + Math.floor(lvl / 2) });
    baseJunk.push({ id: 36, min: 0, max: lvl });
  }

  let gained = [];
  baseJunk.forEach(j => {
    let qty = j.min + Math.floor(Math.random() * (j.max - j.min + 1));
    if (qty > 0) {
      addItemToInv(j.id, qty);
      let jb = getItemBase(j.id);
      gained.push(qty + "x " + jb.name);
    }
  });

  P.inv.splice(idx, 1);

function upgradeVaultFacility(type) {
  ensureVaultDefaults();
  let levelKey = { craft: 'craftLevel', mod: 'modLevel', lunchbox: 'lunchboxLevel', scrap: 'scrapLevel', alchemy: 'alchemyLevel', cook: 'cookLevel' }[type];
  if (!levelKey) return;
  if (P[levelKey] >= 5) return;
  let costs = (UPGRADE_COSTS[type] || [])[P[levelKey] - 1];
  if (!costs || !canPayReqs(costs)) {
    logMsg("No tienes la chatarra necesaria.");
    return;
  }
  payReqs(costs);
  P[levelKey]++;
  logMsg("¡Mejora completada! Nivel " + P[levelKey] + ".");
  renderVault('upgrades');
  updateStats();
}

function upgradeStorageCapacity() {
  ensureVaultDefaults();
  let costs = getStorageUpgradeCost();
  if (!canPayReqs(costs)) {
    logMsg("No tienes la chatarra necesaria.");
    return;
  }
  payReqs(costs);
  P.storageMaxWeight += 100;
  P.storageUpgradeRank = (P.storageUpgradeRank || 0) + 1;
  logMsg("Almacén ampliado a " + P.storageMaxWeight + " kg.");
  renderVault('upgrades');
  updateStats();
}

function renderStorageUI() {
  ensureVaultDefaults();
  let sub = P.storageSubtab || 'weapon';
  let page = P.storagePage || 0;
  const PER_PAGE = 10;
  let sw = getStorageWeight();

  let html = `
    <p style="font-size:12px; color:#8d9880;">Almacén: <b style="color:var(--accent);">${sw.toFixed(1)} / ${P.storageMaxWeight} kg</b>. Mueve objetos entre inventario y almacén.</p>
    <div class="subtabs">
      <button class="${sub === 'weapon' ? 'active' : ''}" onclick="P.storageSubtab='weapon'; P.storagePage=0; renderVault('storage')">Armas</button>
      <button class="${sub === 'armor' ? 'active' : ''}" onclick="P.storageSubtab='armor'; P.storagePage=0; renderVault('storage')">Armaduras</button>
      <button class="${sub === 'med' ? 'active' : ''}" onclick="P.storageSubtab='med'; P.storagePage=0; renderVault('storage')">Ayuda</button>
      <button class="${sub === 'junk' ? 'active' : ''}" onclick="P.storageSubtab='junk'; P.storagePage=0; renderVault('storage')">Chatarra</button>
      <button class="${sub === 'ingredient' ? 'active' : ''}" onclick="P.storageSubtab='ingredient'; P.storagePage=0; renderVault('storage')">Ingredientes</button>
      <button class="${sub === 'other' ? 'active' : ''}" onclick="P.storageSubtab='other'; P.storagePage=0; renderVault('storage')">Otros</button>
    </div>
    <h3 style="color:var(--accent); font-size:14px;">EN INVENTARIO</h3>
  `;

  function typeMatch(it, s) {
    if (s === 'weapon') return it.type === 'weapon';
    if (s === 'armor') return it.type === 'armor';
    if (s === 'med') return it.type === 'med' || it.type === 'chem' || it.type === 'drink' || it.type === 'food';
    if (s === 'junk') return it.type === 'junk';
    if (s === 'ingredient') return it.type === 'ingredient';
    if (s === 'other') return it.type === 'other';
    return false;
  }

  let invList = P.inv.filter(inst => {
    let it = getItemBase(inst.id);
    return it && typeMatch(it, sub);
  });
  if (invList.length === 0) html += `<p style="font-size:11px; color:#8d9880;">Nada en inventario.</p>`;
  invList.forEach(inst => {
    let it = getItemBase(inst.id);
    let isEq = inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid;
    let name = (inst.legendary ? '★ ' : '') + it.name + (inst.qty > 1 ? ' x' + inst.qty : '');
    html += `<div class="item"><b>${name}</b> ${isEq ? '<span class="equipped-tag">EQUIPADO</span>' : ''}
      ${!isEq ? `<button style="margin-left:8px; font-size:11px; padding:3px 8px;" onclick="moveToStorage(${inst.uid})">→ Almacén</button>` : '<span style="font-size:11px; color:#8d9880;"> (desequipa primero)</span>'}
    </div>`;
  });

  let storList = (P.storage || []).filter(inst => {
    let it = getItemBase(inst.id);
    return it && typeMatch(it, sub);
  });
  let totalPages = Math.max(1, Math.ceil(storList.length / PER_PAGE));
  if (page >= totalPages) page = totalPages - 1;
  P.storagePage = page;
  let slice = storList.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);

  html += `<h3 style="color:var(--gold); font-size:14px; margin-top:14px;">EN ALMACÉN (${storList.length} · pág ${page + 1}/${totalPages})</h3>`;
  if (slice.length === 0) html += `<p style="font-size:11px; color:#8d9880;">Vacío en esta categoría.</p>`;
  slice.forEach(inst => {
    let it = getItemBase(inst.id);
    let name = (inst.legendary ? '★ ' : '') + it.name + (inst.qty > 1 ? ' x' + inst.qty : '');
    html += `<div class="item"><b>${name}</b>
      <button style="margin-left:8px; font-size:11px; padding:3px 8px;" onclick="moveFromStorage(${inst.uid})">← Inventario</button>
    </div>`;
  });
  if (totalPages > 1) {
    html += `<div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
      <button ${page <= 0 ? 'disabled' : ''} onclick="P.storagePage=${page - 1}; renderVault('storage')">◀</button>
      <span style="color:var(--accent);">${page + 1}/${totalPages}</span>
      <button ${page >= totalPages - 1 ? 'disabled' : ''} onclick="P.storagePage=${page + 1}; renderVault('storage')">▶</button>
    </div>`;
  }
  return html;
}

function moveToStorage(uid) {
  ensureVaultDefaults();
  let idx = P.inv.findIndex(i => i.uid === uid);
  if (idx === -1) return;
  let inst = P.inv[idx];
  if (inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid) {
    logMsg("No puedes guardar un objeto equipado.");
    return;
  }
  let base = getItemBase(inst.id);
  let addW = (base?.weight || 0) * (inst.qty || 1);
  if (getStorageWeight() + addW > P.storageMaxWeight) {
    logMsg("Almacén lleno (" + P.storageMaxWeight + " kg). Mejora la capacidad en Mejoras.");
    return;
  }
  P.inv.splice(idx, 1);
  P.storage.push(inst);
  logMsg("Guardado en almacén: " + base.name);
  renderVault('storage');
  updateStats();
}

function moveFromStorage(uid) {
  ensureVaultDefaults();
  let idx = P.storage.findIndex(i => i.uid === uid);
  if (idx === -1) return;
  let inst = P.storage[idx];
  let base = getItemBase(inst.id);
  // Usar addItemToInv logic de peso
  let currentWeight = P.inv.reduce((acc, i) => {
    let b = getItemBase(i.id);
    return acc + ((b?.weight || 0) * (i.qty || 1));
  }, 0);
  if (currentWeight + (base?.weight || 0) * (inst.qty || 1) > getMaxWeight()) {
    logMsg("Inventario lleno. No puedes sacar el objeto.");
    return;
  }
  P.storage.splice(idx, 1);
  P.inv.push(inst);
  logMsg("Sacado del almacén: " + base.name);
  renderVault('storage');
  updateStats();
}

function openLunchbox(boxBaseId) {
  if (!removeOneItemByBaseId(boxBaseId)) return;

  let rewards = [];
  let isNuka = (boxBaseId === 15);
  let isLegendaryBox = (boxBaseId === 29);

  if (isLegendaryBox) {
    let legInst = addLegendaryToInv();
    if (legInst) {
      let legBase = getItemBase(legInst.id);
      rewards.push("★ " + legBase.name + " LEGENDARIA (" + legInst.abilityName + ")");
    } else {
      rewards.push("Chapas de compensación (+200)");
      P.caps += 200;
    }
  } else if (isNuka) {
    let gearIds = DB_ITEMS.filter(i => (i.type === 'weapon' || i.type === 'armor') && i.shopTier <= (P.shopLevel || 1)).map(i => i.id);
    let pickedId = gearIds[Math.floor(Math.random() * gearIds.length)] || 1;
    let itemObj = getItemBase(pickedId);
    if (addItemToInv(pickedId, 1)) {
      rewards.push(formatItemGainName(itemObj, 1));
    } else {
      rewards.push("Chapas de compensación (+50)");
      P.caps += 50;
    }
  } else {
    let lvl = P.lunchboxLevel || 1;
    let gotCaps = (20 + lvl * 15) + Math.floor(Math.random() * (40 + lvl * 20));
    P.caps += gotCaps;
    rewards.push(gotCaps + " Chapas");

    let maxTier = Math.min(10, (P.shopLevel || 1) + Math.floor(lvl / 2));
    let allPossibleIds = DB_ITEMS.filter(i => i.shopTier <= maxTier && i.type !== 'other').map(i => i.id);
    let numRewards = 1 + (lvl >= 3 ? 1 : 0) + (lvl >= 5 ? 1 : 0);
    for (let n = 0; n < numRewards; n++) {
      let pickedId = allPossibleIds[Math.floor(Math.random() * allPossibleIds.length)];
      let itemObj = getItemBase(pickedId);
      let cantidadCaida = (itemObj.type === 'junk' || itemObj.type === 'med' || itemObj.type === 'ingredient') ? (1 + Math.floor(Math.random() * (2 + lvl))) : 1;
      if (addItemToInv(pickedId, cantidadCaida)) {
        rewards.push(formatItemGainName(itemObj, cantidadCaida));
      }
    }
  }

  logMsg("¡Abriste una " + getItemBase(boxBaseId).name + "! Conseguiste: " + rewards.join(", "));
  
  let m = document.getElementById('modal');
  let titleColor = isLegendaryBox ? "#ff66cc" : (isNuka ? "var(--gold)" : "var(--accent)");
  document.getElementById('modal-body').innerHTML = `
    <h2 style="color:${titleColor}; text-align:center;">🎉 ¡TARTERA ABIERTA!</h2>
    <p style="text-align:center; font-size:13px;">Has obtenido:</p>
    <div style="background:#10130e; border:1px solid #30362c; padding:12px; margin:12px 0; text-align:center;">
      ${rewards.map(r => `<div style="font-size:14px; font-weight:bold; color:var(--txt); margin:4px 0;">• ${r}</div>`).join('')}
    </div>
    <button style="width:100%;" onclick="closeModal(); renderVault();">ACEPTAR</button>
  `;
  m.classList.add('show');
  updateStats();
}

function updateQuestProgress(type, amount = 1) {
  P.activeQuests.forEach(q => {
    if (q.type === type && !q.completed) {
      q.current = Math.min(q.target, q.current + amount);
      if (q.current >= q.target) {
        q.completed = true;
        logMsg("¡Misión completada: '" + q.title + "'! Reclama tu recompensa en la pestaña Misiones.");
      }
    }
  });
}

function offerQuestEvent() {
  let available = QUEST_POOL.filter(qp => !P.activeQuests.some(aq => aq.id === qp.id));
  if (available.length === 0) {
    findLoot();
    return;
  }

  let quest = available[Math.floor(Math.random() * available.length)];
  let itemObj = quest.reward.item ? getItemBase(quest.reward.item) : null;
  let itemRew = itemObj ? formatItemGainName(itemObj, quest.reward.qty || 1) : "Ninguno";

  let m = document.getElementById('modal');
  document.getElementById('modal-body').innerHTML = `
    <h2 style="color:var(--accent);">📜 NUEVA MISIÓN ENCONTRADA</h2>
    <h3>${quest.title}</h3>
    <p>${quest.desc}</p>
    <div style="font-size:12px; background:#10130e; padding:8px; border:1px solid #30362c; margin-bottom:12px;">
      <b>Recompensas:</b><br>
      • Chapas: ${quest.reward.caps}<br>
      • Experiencia: ${quest.reward.xp}<br>
      • Objeto: ${itemRew}
    </div>
    <button onclick="acceptQuest('${quest.id}')">ACEPTAR MISIÓN</button>
    <button onclick="closeModal()">RECHAZAR</button>
  `;
  m.classList.add('show');
}

function acceptQuest(questId) {
  let baseQ = QUEST_POOL.find(q => q.id === questId);
  if (baseQ) {
    P.activeQuests.push({ ...baseQ, current: 0, completed: false, claimed: false });
    logMsg("Has aceptado la misión: " + baseQ.title);
  }
  closeModal();
  updateStats();
}

function claimReward(questId) {
  let idx = P.activeQuests.findIndex(q => q.id === questId);
  if (idx === -1) return;

  let q = P.activeQuests[idx];
  P.caps += q.reward.caps;
  addXP(q.reward.xp);
  
  let itemText = "";
  if (q.reward.item) {
    let itemObj = getItemBase(q.reward.item);
    let qty = q.reward.qty || 1;
    addItemToInv(q.reward.item, qty);
    itemText = " y " + formatItemGainName(itemObj, qty);
  }

  logMsg("Recompensa reclamada por '" + q.title + "': +" + q.reward.caps + " chapas, EXP" + itemText + ".");
  P.activeQuests.splice(idx, 1);
  renderQuests();
  updateStats();
}

function renderQuests() {
  let html = `<h2>REGISTRO DE MISIONES</h2>`;
  if (P.activeQuests.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">No tienes ninguna misión activa en este momento. Explora el mapa para encontrar supervivientes y encargos.</p>`;
  } else {
    P.activeQuests.forEach(q => {
      let pct = Math.floor((q.current / q.target) * 100);
      let itemObj = q.reward.item ? getItemBase(q.reward.item) : null;
      let itemRew = itemObj ? formatItemGainName(itemObj, q.reward.qty || 1) : null;

      html += `
        <div class="item">
          <div class="item-head">
            <b>${q.title}</b>
            <span style="font-size:11px; color:${q.completed ? 'var(--accent)' : 'var(--gold)'};">
              ${q.completed ? 'COMPLETADA' : 'EN PROGRESO'}
            </span>
          </div>
          <p style="font-size:12px; margin: 4px 0;">${q.desc}</p>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${pct}%; background:var(--accent);"></div>
          </div>
          <div style="font-size:11px; color:#8d9880; display:flex; justify-content:space-between;">
            <span>Progreso: ${q.current} / ${q.target}</span>
            <span>Recompensa: ${q.reward.caps} chapas, ${q.reward.xp} EXP ${itemRew ? '+ ' + itemRew : ''}</span>
          </div>
      `;
      if (q.completed) {
        html += `<button style="margin-top:8px; width:100%; background:var(--accent); color:#111; font-weight:bold;" onclick="claimReward('${q.id}')">RECLAMAR RECOMPENSA</button>`;
      }
      html += `</div>`;
    });
  }
  document.getElementById('main-view').innerHTML = html;
}

function hashCoord(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return Math.abs(h | 0);
}

  poi: ["Búnker Vault-Tec", "Clínica abandonada", "Estación de metro", "Torre de radio", "Laboratorio secreto"],
  camp: ["Campamento de saqueadores", "Puesto de caza", "Caravana varada", "Refugio improvisado"]
};

function getZoneAt(x, y) {
  let h = hashCoord(x, y);
  // Ríos: bandas horizontales/verticales
  if (Math.abs((y * 3 + x) % 11) === 0 || Math.abs((x * 5 - y) % 13) === 0) {
    return { type: 'river', ...ZONE_DEFS.river, name: 'Río contaminado' };
  }
  // Carreteras
  if (x % 7 === 0 || y % 9 === 0) {
    return { type: 'road', ...ZONE_DEFS.road, name: 'Carretera rota' };
  }
  let roll = h % 100;
  let type;
  if (roll < 35) type = 'empty';
  else if (roll < 50) type = 'ruin';
  else if (roll < 62) type = 'camp';
  else if (roll < 74) type = 'poi';
  else if (roll < 86) type = 'city';
  else type = 'empty';

  let def = ZONE_DEFS[type];
  let name = def.label;
  if (POI_NAMES[type]) {
    let names = POI_NAMES[type];
    name = names[h % names.length];
  }
  return { type, ...def, name };
}

function getZoneName() {
  if (P.location) {
    let room = getCurrentRoom();
    return (P.location.name || 'Interior') + (room ? ' — ' + room.name : '');
  }
  return getZoneAt(P.x, P.y).name;
}

function getCurrentRoom() {
  if (!P.location || !P.location.rooms) return null;
  return P.location.rooms.find(r => r.id === P.location.roomId) || P.location.rooms[0];
}

function countMedsById(baseId) {
  return countItemsByBaseId(baseId);
}

function fmtCoord(n) {
  return n > 0 ? '+' + n : '' + n;
}

function renderWorldGrid() {
  let cells = '';
  for (let dy = 3; dy >= -3; dy--) {
    for (let dx = -3; dx <= 3; dx++) {
      let zx = P.x + dx, zy = P.y + dy;
      let z = getZoneAt(zx, zy);
      let isPlayer = (dx === 0 && dy === 0);
      let cls = 'world-cell ' + z.cls + (isPlayer ? ' player' : '') + (z.enterable ? ' enterable' : '');
      let icon = isPlayer ? '☺' : z.icon;
      cells += `<div class="${cls}" title="${z.name}">${icon}</div>`;
    }
  }
  return `<div class="world-grid">${cells}</div>
    <p style="font-size:10px; color:#8d9880; text-align:center;">· vacío  ═ carretera  ≈ río  ⌂ ruinas  ▣ ciudad  ★ interés  ⛺ campamento</p>`;
}

function renderMap() {
  if (P.location) {
    renderInteriorMap();
    return;
  }

  const zone = getZoneAt(P.x, P.y);
  const fmtX = fmtCoord(P.x);
  const fmtY = fmtCoord(P.y);
  let stims = countMedsById(7);
  let radaways = countMedsById(74);
  let signalHint = "";
  if (P.radioSignal) {
    let sx = fmtCoord(P.radioSignal.x);
    let sy = fmtCoord(P.radioSignal.y);
    let here = (P.x === P.radioSignal.x && P.y === P.radioSignal.y);
    signalHint = `<p style="font-size:11px; color:${here ? 'var(--gold)' : '#8d9880'};">📡 Señal en [${sx}, ${sy}]${here ? ' — ¡AQUÍ! Usa la Radio.' : ''}</p>`;

  if (zone.enterable) {
    actions += ` <button style="background:var(--accent); color:#111; font-weight:bold;" onclick="pipClick(); enterLocation()">ENTRAR →</button>`;
  }
  if (zone.type === 'river') {
    actions += `<p style="font-size:11px; color:#00aacc; margin-top:6px;">⚠ Zona altamente irradiada</p>`;
  }

  document.getElementById('main-view').innerHTML = `
    <div><b>SECTOR [${fmtX}, ${fmtY}]</b> <span class="zone-badge">${zone.icon} ${zone.name}</span></div>
    <p style="font-size:12px; color:#8d9880;">Muévete por el Yermo. Las casillas con borde se pueden <b>entrar</b>.</p>
    ${signalHint}

    <div class="map-box">

        <span style="font-size:11px; color:#8d9880;">${zone.enterable ? 'Puedes entrar a explorar el interior.' : 'Zona exterior abierta.'}</span><br><br>
        ${actions}
      </div>
    </div>
    <div class="map-controls">
      <div class="quick-meds">
        <button onclick="pipClick(); quickUseStim()" ${stims === 0 ? 'disabled' : ''}>💉 Stim (${stims})</button>
        <button onclick="pipClick(); quickUseRadAway()" ${radaways === 0 ? 'disabled' : ''}>☢ RadAway (${radaways})</button>
      </div>
      <div class="map-arrows">
        <div></div><button onclick="pipClick(); move(0, 1)">▲</button><div></div>
        <button onclick="pipClick(); move(-1, 0)">◀</button><button onclick="pipClick(); move(0, -1)">▼</button><button onclick="pipClick(); move(1, 0)">▶</button>

function renderInteriorMap() {

  let radaways = countMedsById(74);
  let exits = room ? room.exits : {};

  ['n', 'w', 'e', 's'].forEach(d => {
    if (exits[d]) {
      let target = loc.rooms.find(r => r.id === exits[d]);
      exitBtns += `<button onclick="pipClick(); interiorMove('${d}')">${dirLabels[d]} → ${target ? target.name : exits[d]}</button>`;
    }
  });

  document.getElementById('main-view').innerHTML = `
    <div><b style="color:var(--gold);">📍 INTERIOR:</b> ${loc.name}</div>

    <div class="map-controls" style="margin-top:12px;">
      <div class="quick-meds">
        <button onclick="pipClick(); quickUseStim()" ${stims === 0 ? 'disabled' : ''}>💉 Stim (${stims})</button>
        <button onclick="pipClick(); quickUseRadAway()" ${radaways === 0 ? 'disabled' : ''}>☢ RadAway (${radaways})</button>

function enterLocation() {
  let zone = getZoneAt(P.x, P.y);
  if (!zone.enterable) {
    logMsg("No hay nada a lo que entrar aquí.");
    return;
  }
  let templateKey = zone.type;
  if (!INTERIOR_TEMPLATES[templateKey]) templateKey = 'ruin';
  let rooms = INTERIOR_TEMPLATES[templateKey].map(r => ({ ...r, exits: { ...r.exits } }));
  P.location = {
    type: zone.type,
    name: zone.name,
    worldX: P.x,
    worldY: P.y,
    roomId: rooms[0].id,
    rooms: rooms,
    searched: {}
  };
  logMsg("Entras en: " + zone.name + ".");
  renderMap();
  updateStats();
}

function exitLocation() {
  if (!P.location) return;
  logMsg("Sales de " + P.location.name + " al Yermo.");
  P.location = null;
  renderMap();
  updateStats();
}

function interiorMove(dir) {
  let room = getCurrentRoom();
  if (!room || !room.exits[dir]) {
    logMsg("No puedes ir en esa dirección.");
    return;
  }
  P.location.roomId = room.exits[dir];
  let next = getCurrentRoom();
  logMsg("Te mueves a: " + (next ? next.name : '...') + ".");
  tickEffects();
  // Pequeña chance de encuentro al moverse dentro
  if (Math.random() < 0.18) {
    startCombat(false);
    return;
  }
  renderMap();
  updateStats();
}

function quickUseStim() {
  let inst = P.inv.find(x => x.id === 7) || P.inv.find(x => {
    let b = getItemBase(x.id);
    return b && b.type === 'med' && b.heal;
  });
  if (!inst) {
    logMsg("No tienes estimulantes.");
    renderMap();
    return;
  }
  useMedItem(inst.uid);
  renderMap();
}

function quickUseRadAway() {
  let inst = P.inv.find(x => x.id === 74);
  if (!inst) {
    logMsg("No tienes RadAway.");
    renderMap();
    return;
  }
  useMedItem(inst.uid);
  renderMap();
}

    let here = (P.x === P.radioSignal.x && P.y === P.radioSignal.y);
    signalInfo = here
      ? `¡Estás en la ubicación de la señal! [${sx}, ${sy}] — pulsa CAPTAR SEÑAL.`
      : `Señal pendiente en coordenadas [${sx}, ${sy}]. Desplázate hasta allí.`;
