<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wasteland">
<meta name="description" content="Wasteland — supervivencia en el Yermo. Offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Wasteland</title>
<style>
:root {
  --bg: #000000;
  --panel: #0a120a;
  --line: #00ff41;
  --txt: #00ff41;
  --accent: #00ff41;
  --danger: #ff003c;
  --gold: #ffcc00;
  --bar-bg: #001a00;
  --enemy-bar: #ff003c;
  --player-bar: #00ff41;
}
*, *::before, *::after { box-sizing: border-box; }
html {
  width: 100%;
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow: hidden;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: monospace;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
button {
  font: inherit;
  color: var(--txt);
  background: #001a00;
  border: 1px solid var(--line);
  padding: 8px 6px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-size: 12px;
}
button:active { background: #003300; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  padding: 6px;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  overflow: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 4px 2px 6px;
  flex-shrink: 0;
  gap: 6px;
}
h1 { margin: 0; color: var(--accent); font-size: 16px; white-space: nowrap; }
.stats { display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px; justify-content: flex-end; }
.stats span { background: #001a00; border: 1px solid #00aa2a; padding: 2px 5px; }

.panel {
  background: var(--panel);
  border: 1px solid #00aa2a;
  border-radius: 4px;
  padding: 8px;
}
.panel-log { flex-shrink: 0; margin-bottom: 6px; }
.panel-main {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}
.bottom-bar {
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 6px;
}
.bottom-bar .tabs {
  flex: 1;
  margin: 0;
}
.btn-settings {
  width: 44px;
  min-width: 44px;
  font-size: 20px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #001a00;
  border: 1px solid var(--line);
}
.cap-icon {
  width: 14px;
  height: 14px;
  vertical-align: middle;
  display: inline-block;
  margin-right: 2px;
}
.time-weather {
  font-size: 10px;
  color: var(--gold);
  white-space: nowrap;
}
.map-compact .world-grid {
  max-width: 280px;
  gap: 2px;
  padding: 4px;
  margin: 6px auto;
}
.map-compact .world-cell {
  font-size: 13px;
  min-height: 26px;
}
.map-compact .map-box {
  min-height: 0;
  padding: 6px;
}
.map-compact .map-top {
  flex-shrink: 0;
  min-height: 18px;
  text-align: center;
  font-size: 11px;
}
.map-compact .map-signal-hint {
  height: 18px;
  min-height: 18px;
  max-height: 18px;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
}
.map-compact {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100%;
  box-sizing: border-box;
}
.map-compact .map-actions {
  height: 62px;
  min-height: 62px;
  max-height: 62px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 2px 0 0 0;
  overflow: hidden;
  box-sizing: border-box;
}
.map-compact .map-actions .map-act-row {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: center;
  gap: 6px;
  height: 36px;
  min-height: 36px;
  max-height: 36px;
  overflow: hidden;
}
.map-compact .map-actions .map-act-hint {
  font-size: 11px;
  height: 18px;
  min-height: 18px;
  max-height: 18px;
  line-height: 18px;
  margin: 2px 0 0 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
  text-align: center;
  padding: 0 4px;
  box-sizing: border-box;
}
.map-compact .map-actions button {
  font-size: 12px;
  padding: 6px 12px;
  height: 34px;
  min-height: 34px;
  max-height: 34px;
  font-weight: bold;
  box-sizing: border-box;
}
.map-compact .map-controls {
  margin-top: auto; /* siempre abajo, no se mueve con el texto */
  max-width: 100%;
  width: 100%;
  gap: 6px;
  padding: 4px 2px 2px 2px;
  align-items: center;
  height: 110px;
  min-height: 110px;
  max-height: 110px;
  flex-shrink: 0;
  box-sizing: border-box;
}
.map-compact .map-arrows {
  gap: 5px;
  justify-items: center;
  max-width: 150px;
  margin: 0 auto;
}
.map-compact .map-arrows button {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  max-width: 44px;
  max-height: 44px;
  padding: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  box-sizing: border-box;
}
.map-compact .map-arrows > div {
  width: 44px;
  height: 44px;
}
.map-compact .quick-meds,
.map-compact .quick-radio {
  gap: 5px;
  justify-content: center;
}
.map-compact .quick-meds button,
.map-compact .quick-radio button {
  font-size: 11px;
  padding: 6px 4px;
  min-height: 32px;
  font-weight: normal;
  line-height: 1.15;
}
.map-compact .quick-travel button {
  font-size: 11px;
  padding: 6px 4px;
  width: 100%;
  min-height: 32px;
  font-weight: normal;
}
.world-cell.settlement {
  background: #1a0030;
  color: #cc88ff;
  border-color: #aa55ff;
}
.world-cell.player-settlement,
.world-cell.settlement.player-settlement {
  background: #003322 !important;
  color: #44ddaa !important;
  border-color: #44ddaa !important;
}

.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
.log-title { font-weight: bold; color: var(--accent); font-size: 12px; }
.quick-status { display: flex; gap: 4px; font-size: 10px; flex-wrap: wrap; }
.quick-status span { background: #000800; border: 1px solid #00aa2a; padding: 1px 4px; }

.log { height: 72px; overflow-y: auto; background: #000800; border: 1px solid #00aa2a; padding: 6px; font-size: 11px; }
.log-item { margin-bottom: 3px; border-bottom: 1px dotted #003300; padding-bottom: 2px; }

.tabs, .subtabs { display: grid; gap: 4px; }
.tabs { grid-template-columns: repeat(3, 1fr); }
.subtabs { grid-template-columns: repeat(3, 1fr); margin-bottom: 8px; }
.tabs button { font-size: 11px; padding: 8px 4px; }
.tabs button.active, .subtabs button.active { color: #000; background: var(--accent); font-weight: bold; }
#main-view { width: 100%; overflow-x: hidden; word-break: break-word; }
#main-view img, #main-view table { max-width: 100%; }

.map-box {
  min-height: 120px;
  background: linear-gradient(#001a00 1px, transparent 1px), linear-gradient(90deg, #001a00 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid #00aa2a;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
}
.world-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  width: 100%;
  max-width: 300px;
  margin: 8px auto;
  background: #000800;
  padding: 4px;
  border: 1px solid #00aa2a;
}
.world-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  border: 1px solid #003300;
  background: #001000;
  color: #4a7a4a;
  position: relative;
  min-height: 0;
}
.world-cell.player {
  border-color: var(--accent);
  background: #003300;
  box-shadow: 0 0 8px #00ff4166;
  color: var(--accent);
  font-weight: bold;
}
.world-cell.river { background: #001a22; color: #00aacc; }
.world-cell.city { background: #1a1000; color: #ccaa00; }
.world-cell.ruin { background: #120800; color: #aa7744; }
.world-cell.poi { background: #001a10; color: var(--gold); }
.world-cell.camp { background: #101000; color: #aacc66; }
.world-cell.empty { background: #000a00; color: #335533; }
.world-cell.road { background: #0a0a00; color: #888866; }
.world-cell.enterable { outline: 1px dashed var(--accent); }
.zone-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  border: 1px solid var(--line);
  margin: 2px;
}
.interior-room {
  border: 1px solid var(--accent);
  background: #001400;
  padding: 12px;
  margin: 8px 0;
  text-align: center;
}
.map-controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 6px;
  width: 100%;
  max-width: 400px;
  margin: 8px auto 0 auto;
  align-items: center;
  min-height: 112px;
}
.map-arrows {
  display: grid;
  grid-template-columns: repeat(3, 44px);
  grid-template-rows: repeat(2, 44px);
  gap: 5px;
  width: max-content;
  margin: 0 auto;
  justify-items: center;
}
.map-arrows button {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  font-size: 18px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
.map-arrows > div { width: 44px; height: 44px; }
.quick-meds, .quick-radio {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.quick-meds button, .quick-radio button {
  font-size: 11px;
  padding: 6px 4px;
  white-space: normal;
  line-height: 1.15;
  min-height: 32px;
  font-weight: normal;
}
.radio-panel {
  border: 1px solid var(--accent);
  background: #001400;
  padding: 14px;
  margin-top: 8px;
}
.radio-panel h3 { color: var(--accent); margin-top: 0; }
.radio-status {
  font-size: 12px;
  color: var(--gold);
  margin: 8px 0;
  min-height: 18px;
}

.item { padding: 10px; border: 1px solid #00aa2a; background: #000a00; margin-bottom: 8px; }
.item.fcol { border-width: 1px; border-style: solid; }
.item.medic-box { border: 1px solid #66b3ff !important; background: #0a1520 !important; }
.item.medic-box b { color: #66b3ff !important; }
.item-head { display: flex; justify-content: space-between; align-items: center; }
.equipped-tag { color: var(--accent); border: 1px solid var(--line); font-size: 10px; padding: 2px 4px; }
.row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #003300; font-size: 13px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
.modal.show { display: flex; }
.modal-content { background: var(--panel); border: 2px solid var(--accent); padding: 16px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; }

.progress-bar { background: var(--bar-bg); border: 1px solid #00aa2a; height: 14px; border-radius: 2px; overflow: hidden; margin: 4px 0 10px 0; }
.progress-fill { height: 100%; width: 0%; transition: width 0.3s; }

.spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.spec-box { background: #000a00; border: 1px solid #00aa2a; padding: 8px; display: flex; justify-content: space-between; align-items: center; }

.vault-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.lunchbox-card { background: #000a00; border: 1px solid #00aa2a; padding: 12px; text-align: center; }

/* ===== COMBATE ESTILO PIP-BOY ===== */
.combat-title {
  color: var(--danger);
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 0 0 16px 0;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255,0,60,0.6);
}
.combat-entity {
  margin-bottom: 14px;
}
.combat-entity-name {
  font-size: 14px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.combat-entity-name.enemy { color: var(--danger); }
.combat-entity-name.player { color: var(--accent); }
.combat-hp-bar {
  background: #001100;
  border: 1px solid #00aa2a;
  height: 18px;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.combat-hp-fill {
  height: 100%;
  transition: width 0.35s ease;
}
.combat-hp-fill.enemy { background: var(--enemy-bar); box-shadow: 0 0 10px rgba(255,0,60,0.5); }
.combat-hp-fill.player { background: var(--player-bar); box-shadow: 0 0 10px rgba(0,255,65,0.4); }
.combat-log {
  background: #000800;
  border: 1px solid #00aa2a;
  height: 90px;
  overflow-y: auto;
  padding: 8px;
  font-size: 12px;
  margin: 12px 0;
}
.combat-log div { margin-bottom: 3px; border-bottom: 1px dotted #002200; padding-bottom: 2px; }
.combat-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}
.combat-btn-attack {
  background: #330000;
  border: 2px solid var(--danger);
  color: var(--danger);
  font-weight: bold;
  padding: 14px 8px;
  font-size: 14px;
}
.combat-btn-attack:active { background: #550000; }
.combat-btn-flee {
  background: #001a00;
  border: 2px solid var(--accent);
  color: var(--accent);
  font-weight: bold;
  padding: 14px 8px;
  font-size: 14px;
}
.combat-btn-flee:active { background: #003300; }

.vault-container { grid-template-columns: 1fr; }
.spec-grid { grid-template-columns: 1fr 1fr; }
.row { font-size: 12px; padding: 4px 0; }
.name-btn {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-weight: bold;
  padding: 4px 10px;
  font-size: 14px;
}

@media (min-width: 700px) {
  .app { max-width: 720px; }
  .tabs { grid-template-columns: repeat(6, 1fr); }
  .log { height: 90px; }
}
</style>
</head>

function enemyWeaponType(name) {
  let n = (name || '').toLowerCase();
  if (n.includes('synth') || n.includes('courser') || n.includes('sintético')) return 'synth';
  if (n.includes('robot') || n.includes('protectron') || n.includes('sentry') || n.includes('assaultron') || n.includes('handy') || n.includes('sintético') || n.includes('centinela')) {
    return 'robot';
  }
  if (n.includes('supermutante') || n.includes('behemoth')) return 'supermutant';
  if (n.includes('sanguinario') || n.includes('devorador') || n.includes('bestia') || n.includes('topo') || n.includes('rata') || n.includes('perro') || n.includes('mosca')) return 'creature';
  if (n.includes('necrófago')) return 'ghoul';
  if (n.includes('saqueador') || n.includes('mercenario') || n.includes('cazador') || n.includes('asesino') || n.includes('enclave')) return 'human';
  return 'other';
}

function rollCompanionSpecial() {
  const r = () => 1 + Math.floor(Math.random() * 10);
  return { S: r(), P: r(), E: r(), C: r(), I: r(), A: r(), L: r() };
}

function getCompanionWeaponName(type, isLeg) {
  if (type === 'synth') return isLeg ? 'Rifle de pulsos experimental' : 'Pistola de energía sintética';
  if (type === 'robot') return isLeg ? 'Cañón de plasma robótico' : 'Láser integrado';
  if (type === 'supermutant') return isLeg ? 'Tabla de clavos legendaria' : 'Tabla de clavos';
  if (type === 'human') return isLeg ? 'Rifle de asalto modificado' : 'Arma improvisada';
  return null; // creature/ghoul/other: sin arma
}

function createCompanionFromEnemy(enemyName, enemyLevel, baseHp, baseDmg, isLegendary) {
  let type = enemyWeaponType(enemyName);
  let special = rollCompanionSpecial();
  let ability = null;
  if (isLegendary) {
    ability = COMPANION_LEGENDARY_ABILITIES[Math.floor(Math.random() * COMPANION_LEGENDARY_ABILITIES.length)];
  }
  let maxHp = baseHp;
  if (ability && ability.id === 'c_tank') maxHp = Math.floor(maxHp * 1.35);
  if (ability && ability.id === 'c_legend') maxHp = Math.floor(maxHp * 1.15);
  return {
    id: 'comp_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    name: enemyName.replace(/\s*\(Nv\.\d+\)/, '').replace(/^★\s*/, ''),
    level: enemyLevel || 1,
    xp: 0,
    type: type,
    special: special,
    maxHp: maxHp,
    hp: maxHp,
    baseDmg: baseDmg,
    baseDef: Math.max(1, Math.floor(baseDmg * 0.35) + Math.floor(special.E / 2)),
    weapon: getCompanionWeaponName(type, !!isLegendary),
    isLegendary: !!isLegendary,
    ability: ability,
    resting: false,
    hardSkinUsed: false
  };
}

function getPrisonCapacity() {
  return 10 + ((P.prisonLevel || 1) - 1) * 10;
}

function getEquippedCompanion() {
  if (!P.equippedCompanionId || !P.prison) return null;
  return P.prison.find(c => c.id === P.equippedCompanionId) || null;
}

function companionRequiredXP(lvl) {
  return 40 + (lvl * 25);
}

function addCompanionXP(comp, amount) {
  if (!comp) return;
  comp.xp = (comp.xp || 0) + amount;
  let req = companionRequiredXP(comp.level);
  while (comp.xp >= req) {
    comp.xp -= req;
    comp.level++;
    // subir stats de combate, no SPECIAL
    comp.maxHp = Math.floor(comp.maxHp * 1.08) + 3;
    comp.baseDmg = Math.floor(comp.baseDmg * 1.06) + 1;
    comp.baseDef = Math.floor(comp.baseDef * 1.05) + 1;
    if (comp.hp > 0 && !comp.resting) {
      comp.hp = Math.min(comp.maxHp, comp.hp + Math.floor(comp.maxHp * 0.15));
    }
    logMsg(comp.name + " sube a nivel " + comp.level + "!");
    req = companionRequiredXP(comp.level);
  }
}

function getCompanionCombatStats(comp) {
  if (!comp) return null;
  let dmg = comp.baseDmg + Math.floor((comp.special.S || 1) * 0.5);
  let def = comp.baseDef;
  let maxHp = comp.maxHp;
  let ab = comp.ability;
  if (ab) {
    if (ab.id === 'c_iron') def = Math.floor(def * 1.20);
    if (ab.id === 'c_overcharge') dmg += 18;
    if (ab.id === 'c_berserk') { dmg = Math.floor(dmg * 1.40); def = Math.floor(def * 0.90); }
    if (ab.id === 'c_legend') { dmg = Math.floor(dmg * 1.15); def = Math.floor(def * 1.15); }
    if (ab.id === 'c_pack') {
      let n = Math.min(4, (P.prison || []).length);
      dmg = Math.floor(dmg * (1 + n * 0.10));
    }
    if (ab.id === 'c_fury' && comp.hp / comp.maxHp < 0.4) dmg = Math.floor(dmg * 1.25);
  }
  // escala suave por nivel
  let lvlBonus = Math.max(0, (comp.level || 1) - 1);
  dmg += Math.floor(lvlBonus * 0.8);
  def += Math.floor(lvlBonus * 0.4);
  return { dmg, def, maxHp };
}

// Genera un objeto legendario (arma o armadura) con habilidad aleatoria
function generateLegendaryItem(preferType = null) {
  let candidates = DB_ITEMS.filter(i => 
    (i.type === 'weapon' || i.type === 'armor') && 
    i.shopTier >= 2 && i.shopTier <= 8
  );
  if (preferType) candidates = candidates.filter(i => i.type === preferType);
  if (candidates.length === 0) candidates = DB_ITEMS.filter(i => i.type === 'weapon' || i.type === 'armor');

  let base = candidates[Math.floor(Math.random() * candidates.length)];
  let abilityPool = base.type === 'weapon' ? LEG_WEAPON_ABILITIES : LEG_ARMOR_ABILITIES;
  let ability = abilityPool[Math.floor(Math.random() * abilityPool.length)];

  let newUid = Date.now() + Math.floor(Math.random() * 100000);
  let inst = {
    uid: newUid,
    id: base.id,
    qty: 1,
    mods: [],
    legendary: true,
    abilityId: ability.id,
    abilityName: ability.name,
    abilityDesc: ability.desc
  };
  return inst;
}

function addLegendaryToInv(preferType = null) {

function getItemBase(id) { return DB_ITEMS.find(i => i.id === id); }
function getRequiredXP() { return P.lvl * 100; }

function getCumulativeBonus(n) {
  if (n <= 0) return 0;
  return (n * (n + 1)) / 2;
}

function getMaxWeight() {
  let strBonus = (P.special ? P.special.S : 1) * 10;
  let bagCapacity = Math.min(500, P.baseMaxWeight);
  let perkBonus = ((P.perks && P.perks.p_mule) || 0) * 10;
  let legBonus = 0;
  let armAb = getArmorAbility();
  if (armAb && armAb.id === 'a_weight') legBonus = 25;
  return bagCapacity + strBonus + perkBonus + legBonus;
}

function getBaseMaxHp() {
  let perkBonus = ((P.perks && P.perks.p_tough) || 0) * 20;
  let levelHpBonus = 0;
  if (P.lvl >= 2) {
    levelHpBonus = 20 + ((P.lvl - 2) * 10);
  }
  let legBonus = 0;
  let armAb = getArmorAbility();
  if (armAb) {
    if (armAb.id === 'a_hp') legBonus = 40;
    if (armAb.id === 'a_tank') legBonus = 20;
  }
  return P.baseMaxHp + levelHpBonus + perkBonus + legBonus;
}

// La radiación reduce el máximo de vida efectivo
function getRadHpMult() {
  let r = P.rads || 0;
  if (r >= 1000) return 0.20;
  if (r >= 800) return 0.35;
  if (r >= 600) return 0.55;
  if (r >= 400) return 0.75;
  if (r >= 200) return 0.90;
  return 1.0;
}

function getMaxHp() {
  return Math.max(1, Math.floor(getBaseMaxHp() * getRadHpMult()));
}

// Resistencia a radiación de la armadura (0-80%)
function getRadResistance() {
  let a = getEquippedArmor();
  let res = 0;
  // Defensa aporta resistencia (aprox)
  if (a && a.def) res += Math.min(50, a.def * 0.8);
  // Servoarmaduras y hazmat
  if (a && a.name) {
    let n = a.name.toLowerCase();
    if (n.includes('hazmat') || n.includes('antirradi')) res += 40;
    if (n.includes('servoarmadura') || n.includes('t-45') || n.includes('t-51') || n.includes('t-60') || n.includes('x-01')) res += 25;
  }
  let armAb = getArmorAbility();
  if (armAb && armAb.id === 'a_radres') res += 50;
  // Rad-X efecto activo
  res += getEffectBonus('radRes') || 0;
  return Math.min(85, Math.floor(res));
}

function addRads(amount) {
  if (amount <= 0) return;
  let res = getRadResistance();
  let actual = Math.max(1, Math.floor(amount * (1 - res / 100)));
  P.rads = Math.min(1000, (P.rads || 0) + actual);
  logMsg("Radiación +" + actual + " (total: " + P.rads + "/1000)" + (res > 0 ? " [Res " + res + "%]" : ""));
  // Ajustar HP si supera el nuevo máximo
  let maxhp = getMaxHp();
  if (P.hp > maxhp) P.hp = maxhp;
}

function removeRads(amount) {
  let before = P.rads || 0;
  P.rads = Math.max(0, before - amount);
  let removed = before - P.rads;
  if (removed > 0) logMsg("Radiación -" + removed + " (total: " + P.rads + "/1000)");
  return removed;
}

function getRadStatusText() {
  let r = P.rads || 0;
  if (r >= 800) return "CRÍTICA";
  if (r >= 600) return "Grave";
  if (r >= 400) return "Alta";
  if (r >= 200) return "Moderada";
  if (r > 0) return "Baja";
  return "Limpia";
}

function getDefenseBonusFromEndurance() {
  let endPts = P.special ? P.special.E : 1;
  return getCumulativeBonus(endPts);
}

function formatItemGainName(item, count = 1) {
  if (!item) return "";
  if (item.type === 'ammo') {
    let totalBalas = (item.qty || 1) * count;
    return `${totalBalas} balas de ${item.name}`;
  }
  return count > 1 ? `${count}x ${item.name}` : `1x ${item.name}`;
}

function addItemToInv(baseId, count = 1) {
  let it = getItemBase(baseId);
  if (!it) return false;

  if (it.type === 'ammo') {
    let addQty = (it.qty || 1) * count;
    P.ammoBox[it.ammoKey] = (P.ammoBox[it.ammoKey] || 0) + addQty;
    return true;
  }
  
  let currentWeight = P.inv.reduce((acc, inst) => {
    let base = getItemBase(inst.id);
    return acc + ((base?.weight || 0) * (inst.qty || 1));
  }, 0);

  let addedWeight = it.weight * count;

  if (currentWeight + addedWeight > getMaxWeight()) {
    logMsg("¡Mochila llena! No puedes cargar " + formatItemGainName(it, count) + ".");
    return false;
  }

  if (it.stackable) {
    let existing = P.inv.find(i => i.id === baseId);
    if (existing) {
      existing.qty = (existing.qty || 1) + count;
      return existing.uid;
    }
  }

  let newUid = Date.now() + Math.floor(Math.random() * 100000);
  P.inv.push({ uid: newUid, id: baseId, qty: count, mods: [] });
  return newUid;
}

function removeOneItemByBaseId(baseId) {
  let idx = P.inv.findIndex(i => i.id === baseId);
  if (idx !== -1) {
    let inst = P.inv[idx];
    if (inst.qty && inst.qty > 1) {
      inst.qty--;
    } else {
      P.inv.splice(idx, 1);
    }
    return true;
  }
  return false;
}

function countItemsByBaseId(baseId) {
  let it = getItemBase(baseId);
  if (it && it.type === 'ammo') {
    return P.ammoBox[it.ammoKey] || 0;
  }
  return P.inv.filter(i => i.id === baseId).reduce((acc, i) => acc + (i.qty || 1), 0);
}

function removeItemsByBaseId(baseId, qty) {
  let left = qty;
  for (let i = P.inv.length - 1; i >= 0 && left > 0; i--) {
    if (P.inv[i].id !== baseId) continue;
    let q = P.inv[i].qty || 1;
    if (q <= left) {
      left -= q;
      P.inv.splice(i, 1);
    } else {
      P.inv[i].qty = q - left;
      left = 0;
    }
  }
  return qty - left;
}
function removeAllItemsByBaseId(baseId) {
  P.inv = (P.inv || []).filter(x => x.id !== baseId);
  if (P.storage) P.storage = P.storage.filter(x => x.id !== baseId);
}


function getItemLevelBonus(itemLevel) {
  let lvl = Math.max(1, itemLevel || 1);
  // +8% stats por nivel por encima de 1, suave
  return 1 + (lvl - 1) * 0.08;
}

function getModLevelScale(itemLevel) {
  // módulos escalan con el nivel del objeto sin romper el flat bonus
  return 1 + Math.max(0, (itemLevel || 1) - 1) * 0.05;
}

function getEquippedWeapon() {
  let inst = P.inv.find(i => i.uid === P.equippedWeaponUid);
  if (!inst) return { name: "Desarmado", damage: 2, ammoType: "Ninguna (Cuerpo a cuerpo)", mods: [], legendary: false, itemLevel: 1 };
  let base = getItemBase(inst.id);
  let ilvl = inst.itemLevel || 1;
  let scale = getItemLevelBonus(ilvl);
  let modScale = getModLevelScale(ilvl);
  let modDmg = (inst.mods || []).reduce((acc, mId) => {
    let m = MODS_DB.find(x => x.id === mId);
    return acc + (m ? Math.floor((m.bonusDmg || 0) * modScale) : 0);
  }, 0);
  let dmg = Math.max(1, Math.floor(base.damage * scale) + modDmg);
  return { 
    ...base, 
    damage: dmg,
    itemLevel: ilvl,
    mods: inst.mods || [],
    legendary: !!inst.legendary,
    abilityId: inst.abilityId || null,
    abilityName: inst.abilityName || null
  };
}

function getEquippedArmor() {
  let inst = P.inv.find(i => i.uid === P.equippedArmorUid);
  if (!inst) return { name: "Sin armadura", def: 0, mods: [], legendary: false, itemLevel: 1 };
  let base = getItemBase(inst.id);
  let ilvl = inst.itemLevel || 1;
  let scale = getItemLevelBonus(ilvl);
  let modScale = getModLevelScale(ilvl);
  let modDef = (inst.mods || []).reduce((acc, mId) => {
    let m = MODS_DB.find(x => x.id === mId);
    return acc + (m ? Math.floor((m.bonusDef || 0) * modScale) : 0);
  }, 0);
  let def = Math.max(0, Math.floor(base.def * scale) + modDef);
  return { 
    ...base, 
    def: def,
    itemLevel: ilvl,
    mods: inst.mods || [],
    legendary: !!inst.legendary,
    abilityId: inst.abilityId || null,
    abilityName: inst.abilityName || null
  };
}

function updateStats() {
  let wCap = P.inv.reduce((acc, inst) => {
    let base = getItemBase(inst.id);
    return acc + ((base?.weight || 0) * (inst.qty || 1));
  }, 0);
  let maxhp = getMaxHp();
  let maxw = getMaxWeight();
  let reqXp = getRequiredXP();

  if (P.hp > maxhp) P.hp = maxhp;

  document.getElementById('st-lvl').textContent = P.lvl;
  document.getElementById('st-xp').textContent = P.xp;
  document.getElementById('st-maxxp').textContent = reqXp;
  document.getElementById('st-caps').textContent = P.caps;
  document.getElementById('st-caps').style.color = '#e05050';
  let chipsEl = document.getElementById('st-chips');
  if (chipsEl) { chipsEl.textContent = P.chips || 0; chipsEl.style.color = '#ffffff'; }
  document.getElementById('st-weight').textContent = wCap.toFixed(1);
  document.getElementById('st-maxweight').textContent = maxw;

  const w = getEquippedWeapon();
  const a = getEquippedArmor();
  let totalDmg = w.damage + (((P.perks && P.perks.p_iron) || 0) * 3) + getEffectBonus('dmg');
  let totalDef = a.def + (((P.perks && P.perks.p_skin) || 0) * 2) + getDefenseBonusFromEndurance() + getEffectBonus('def');

  let ammoDisplay = w.ammoType.includes("Ninguna") ? "Inf." : (P.ammoBox[w.ammoType] || 0);

  // Penalización de daño por radiación alta
  if ((P.rads || 0) >= 600) totalDmg = Math.max(1, totalDmg - 3);
  if ((P.rads || 0) >= 800) totalDmg = Math.max(1, totalDmg - 2);

  let rads = P.rads || 0;
  let radColor = rads >= 600 ? '#ff003c' : (rads >= 200 ? '#ff6600' : 'var(--accent)');

  // Bonos/penalizaciones de clima
  let wInfo = getWeatherInfo();
  if (wInfo.dmgMod) totalDmg = Math.max(1, totalDmg + wInfo.dmgMod);
  if (wInfo.defMod) totalDef = Math.max(0, totalDef + wInfo.defMod);

  let dtEl = document.getElementById('st-datetime');
  if (dtEl) dtEl.textContent = formatGameDateTime();
  let weEl = document.getElementById('st-weather');
  if (weEl) {
    weEl.textContent = wInfo.label;
    weEl.style.color = wInfo.color || 'var(--gold)';
  }

  document.getElementById('qs-hp').textContent = P.hp + "/" + maxhp;
  let qsRad = document.getElementById('qs-rad');
  if (qsRad) {
    qsRad.textContent = rads;
    qsRad.style.color = radColor;
  }
  document.getElementById('qs-dmg').textContent = totalDmg;
  document.getElementById('qs-def').textContent = totalDef;
  document.getElementById('qs-ammo').textContent = ammoDisplay;
}

function addXP(amount) {
  let bonusXP = Math.floor(amount * (1 + (P.special.I * 0.05) + getEffectBonus('xpMult')));
  if (P.perks && P.perks.p_runner) bonusXP = Math.floor(bonusXP * (1 + (P.perks.p_runner * 0.1)));
  
  P.xp += bonusXP;

  while (P.xp >= getRequiredXP()) {
    P.xp -= getRequiredXP();
    P.lvl++;
    P.specialPts++;
    
    if (P.lvl % 2 === 0) {
      P.perkPts++;
      logMsg("¡Subes al nivel " + P.lvl + "! Ganaste 1 Punto S.P.E.C.I.A.L. y 1 Punto de Perk.");
    } else {
      logMsg("¡Subes al nivel " + P.lvl + "! Ganaste 1 Punto S.P.E.C.I.A.L.");
    }
    
    P.hp = getMaxHp();
  }
}

function openPerkSelection() {
  if (P.perkPts <= 0) return;

  let availablePerks = PERKS_DB.filter(p => ((P.perks && P.perks[p.id]) || 0) < p.maxRank);
  if (availablePerks.length === 0) {
    logMsg("¡Ya has alcanzado el rango máximo en todas las Perks!");
    return;
  }

  let shuffled = [...availablePerks].sort(() => 0.5 - Math.random());
  let options = shuffled.slice(0, 3);

  let m = document.getElementById('modal');
  let html = `
    <h2 style="color:var(--accent);">⚡ ELIGE UNA PERK</h2>
    <p style="font-size:12px; color:#8d9880;">Puntos disponibles: ${P.perkPts}. Selecciona 1 entre estas 3 opciones:</p>
  `;

  options.forEach(pk => {
    let curRank = (P.perks && P.perks[pk.id]) || 0;
    html += `
      <div class="item" style="border-color:var(--accent);">
        <b style="color:var(--accent);">${pk.name}</b>
        <span style="font-size:11px; color:var(--gold);"> (Rango actual: ${curRank}/${pk.maxRank})</span><br>
        <span style="font-size:12px;">${pk.desc}</span><br>
        <button style="margin-top:8px; width:100%; background:var(--accent); color:#111; font-weight:bold;" onclick="selectPerk('${pk.id}')">Elegir Perk</button>
      </div>
    `;
  });

  html += `<button style="margin-top:10px; width:100%;" onclick="closeModal()">Cancelar</button>`;
  document.getElementById('modal-body').innerHTML = html;
  m.classList.add('show');
}

function selectPerk(perkId) {
  let pk = PERKS_DB.find(p => p.id === perkId);
  if (!P.perks) P.perks = {};
  if (!P.perks[perkId]) P.perks[perkId] = 0;

  P.perks[perkId]++;
  P.perkPts--;

  logMsg("¡Has adquirido/subido de rango la Perk: " + pk.name + "!");
  closeModal();
  renderCharacter();
  updateStats();
}

function addSpecialPoint(stat) {
  if (P.specialPts > 0 && P.special[stat] < 10) {
    P.special[stat]++;
    P.specialPts--;
    logMsg("Aumentaste tu atributo S.P.E.C.I.A.L: " + stat);
    renderCharacter();
    updateStats();
  }
}

/* SISTEMA DE REFUGIO CON SUBSECCIONES */

function ensureVaultDefaults() {
  if (!P.craftLevel) P.craftLevel = 1;
  if (!P.modLevel) P.modLevel = 1;
  if (!P.lunchboxLevel) P.lunchboxLevel = 1;
  if (!P.scrapLevel) P.scrapLevel = 1;
  if (!P.alchemyLevel) P.alchemyLevel = 1;
  if (!P.cookLevel) P.cookLevel = 1;
  if (!P.storage) P.storage = [];
  if (P.storageMaxWeight === undefined) P.storageMaxWeight = 100;
  if (P.prisonLevel === undefined) P.prisonLevel = 1;
  if (!P.prison) P.prison = [];
  if (!P.fastTravelUnlocked) P.fastTravelUnlocked = [];
  if (P.storageUpgradeRank === undefined) P.storageUpgradeRank = 0;
  if (!P.activeEffects) P.activeEffects = [];
  if (!P.fabricSubtab) P.fabricSubtab = 'crafting';
  if (P.craftPage === undefined) P.craftPage = 0;
  if (P.storagePage === undefined) P.storagePage = 0;
}

function getStorageWeight() {
  return (P.storage || []).reduce((acc, inst) => {
    let b = getItemBase(inst.id);
    return acc + ((b?.weight || 0) * (inst.qty || 1));
  }, 0);
}

function canPayReqs(reqs) {
  return reqs.every(r => countItemsByBaseId(r.id) >= r.qty);
}

function payReqs(reqs) {
  reqs.forEach(r => {
    for (let i = 0; i < r.qty; i++) removeOneItemByBaseId(r.id);
  });
}

function formatReqs(reqs) {
  return reqs.map(r => {
    let it = getItemBase(r.id);
    let owned = countItemsByBaseId(r.id);
    let color = owned >= r.qty ? 'var(--accent)' : 'var(--danger)';
    return `<span style="color:${color}">${it ? it.name : '?'}: ${owned}/${r.qty}</span>`;
  }).join(" | ");
}

function tickEffects() {
  if (!P.activeEffects || P.activeEffects.length === 0) return;
  P.activeEffects.forEach(e => e.remaining--);
  let expired = P.activeEffects.filter(e => e.remaining <= 0);
  expired.forEach(e => logMsg("Efecto terminado: " + e.name));
  P.activeEffects = P.activeEffects.filter(e => e.remaining > 0);
}

function applyConsumableEffect(item) {
  if (!item.effectId) return;
  if (!P.activeEffects) P.activeEffects = [];
  // Reemplazar mismo efecto si ya existe
  P.activeEffects = P.activeEffects.filter(e => e.id !== item.effectId);
  P.activeEffects.push({
    id: item.effectId,
    name: item.effectName || item.name,
    desc: item.effectDesc || "",
    remaining: item.effectActions || 3,
    bonus: item.effectBonus || {}
  });
  logMsg("Efecto activo: " + (item.effectName || item.name) + " (" + (item.effectActions || 3) + " acciones)");
}

function getEffectBonus(key) {
  if (!P.activeEffects) return 0;
  return P.activeEffects.reduce((acc, e) => acc + ((e.bonus && e.bonus[key]) || 0), 0);
}

  let fab = P.fabricSubtab || 'crafting';
  let html = `
    <div class="subtabs" >
      <button class="${fab === 'crafting' ? 'active' : ''}" onclick="P.fabricSubtab='crafting'; P.craftPage=0; renderVault('fabric')">Taller</button>

      <button class="${fab === 'cook' ? 'active' : ''}" onclick="P.fabricSubtab='cook'; P.craftPage=0; renderVault('fabric')">Cocina</button>
    </div>
  `;

  if (fab === 'crafting') {
    html += renderRecipeList(CRAFT_RECIPES, P.craftLevel, 'craftLvl', 'craftItem', 'Taller', P.craftLevel);

    html += renderArmoryUI();

    html += renderRecipeList(COOK_RECIPES, P.cookLevel, 'cookLvl', 'craftCook', 'Cocina', P.cookLevel);
  }
  return html;
}

function renderRecipeList(recipes, level, lvlKey, fnName, title, showLvl) {
  const PER_PAGE = 5;
  let page = P.craftPage || 0;
  let available = recipes.filter(r => (r[lvlKey] || 1) <= level);
  let locked = recipes.filter(r => (r[lvlKey] || 1) > level);
  let totalPages = Math.max(1, Math.ceil(available.length / PER_PAGE));
  if (page >= totalPages) page = totalPages - 1;
  P.craftPage = page;
  let slice = available.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);

  let html = `<p style="font-size:12px; color:#8d9880;">Nivel ${title}: <b style="color:var(--accent);">${showLvl}/5</b></p>`;
  if (available.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">No hay recetas desbloqueadas. Mejora esta estación en Mejoras.</p>`;
  } else {
    html += `<p style="font-size:11px; color:#8d9880;">Página ${page + 1}/${totalPages}</p>`;
    slice.forEach(rec => {
      let itemObj = getItemBase(rec.id);
      if (!itemObj) return;
      let can = canPayReqs(rec.reqs);
      let stats = '';
      if (itemObj.damage) stats = 'Daño: ' + itemObj.damage;
      else if (itemObj.def) stats = 'Defensa: ' + itemObj.def;
      else if (itemObj.heal) stats = 'Cura: ' + itemObj.heal;
      else if (itemObj.effectDesc) stats = itemObj.effectDesc;
      html += `
        <div class="item">
          <b style="color:var(--accent);">${itemObj.name}</b> ${stats ? '(' + stats + ')' : ''}<br>
          <span style="font-size:11px;">Requisitos: ${formatReqs(rec.reqs)}</span><br>
          <button style="margin-top:6px;" ${!can ? 'disabled' : ''} onclick="${fnName}(${rec.id})">Fabricar</button>
        </div>
      `;
    });
    if (totalPages > 1) {
      html += `<div style="display:flex; justify-content:center; gap:10px; margin-top:10px; align-items:center;">
        <button ${page <= 0 ? 'disabled' : ''} onclick="P.craftPage=${page - 1}; renderVault('fabric')">◀ Anterior</button>
        <span style="font-size:12px; color:var(--accent);">${page + 1}/${totalPages}</span>
        <button ${page >= totalPages - 1 ? 'disabled' : ''} onclick="P.craftPage=${page + 1}; renderVault('fabric')">Siguiente ▶</button>
      </div>`;
    }
  }
  if (locked.length > 0) {
    html += `<p style="font-size:11px; color:#8d9880; margin-top:10px;">${locked.length} recetas bloqueadas (mejora el nivel).</p>`;
  }
  return html;
}

function renderArmoryUI() {
  let html = `<p style="font-size:12px; color:#8d9880;">Nivel Armería: <b style="color:var(--accent);">${P.modLevel}/5</b>. Mira/cañón solo a distancia; empuñadura/filo solo melee.</p>`;
  let eqWpn = P.inv.find(i => i.uid === P.equippedWeaponUid);
  let eqArm = P.inv.find(i => i.uid === P.equippedArmorUid);
  [eqWpn, eqArm].forEach(inst => {
    if (!inst) return;
    let base = getItemBase(inst.id);
    let installedMods = inst.mods || [];
    let isMelee = base.type === 'weapon' && (base.ammoType || '').includes('Ninguna');
    html += `
      <div class="item" style="border-color:var(--gold);">
        <b>${base.name}</b> <span class="equipped-tag">EQUIPADO</span>${isMelee ? ' <span style="font-size:10px;">(Melee)</span>' : ''}<br>
        <span style="font-size:11px; color:#8d9880;">Mejoras: ${installedMods.length > 0 ? installedMods.map(m => MODS_DB.find(x => x.id === m)?.name).join(", ") : "Ninguna"}</span><hr style="border-color:#222;">
    `;
    MODS_DB.filter(m => {
      if (m.target !== base.type) return false;
      if ((m.modLvl || 1) > P.modLevel) return false;
      if (base.type === 'weapon') {
        if (m.rangedOnly && isMelee) return false;
        if (m.meleeOnly && !isMelee) return false;
      }
      return true;
    }).forEach(mod => {
      let hasMod = installedMods.includes(mod.id);
      let canApply = !hasMod && canPayReqs(mod.reqs);
      html += `
        <div style="margin-top:4px; font-size:12px;">
          <span><b>${mod.name}</b> (${mod.bonusDmg ? '+' + mod.bonusDmg + ' Daño' : '+' + mod.bonusDef + ' Def'}) [Nv.${mod.modLvl||1}] — ${formatReqs(mod.reqs)}</span><br>
          <button style="margin-top:2px; font-size:10px; padding:3px 6px;" ${hasMod || !canApply ? 'disabled' : ''} onclick="applyMod(${inst.uid}, '${mod.id}')">${hasMod ? 'Instalada' : 'Instalar'}</button>

      `;

function scrapItem(uid) {
  let idx = P.inv.findIndex(i => i.uid === uid);
  if (idx === -1) return;
  let inst = P.inv[idx];
  if (inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid) {
    logMsg("No puedes desguazar un objeto equipado.");
    return;
  }
  let it = getItemBase(inst.id);
  let lvl = P.scrapLevel || 1;
  // Yield escala con nivel y valor del objeto
  let baseJunk = [
    { id: 20, min: 1, max: 2 + lvl },
    { id: 21, min: 1, max: 1 + lvl },
    { id: 22, min: 0, max: lvl },
    { id: 23, min: 0, max: Math.floor(lvl / 2) + 1 }
  ];
  if (it.type === 'weapon' && !(it.ammoType || '').includes('Ninguna')) {
    baseJunk.push({ id: 13, min: 0, max: lvl });
    baseJunk.push({ id: 27, min: 0, max: 1 + Math.floor(lvl / 2) });
  }
  if (it.type === 'armor') {
    baseJunk.push({ id: 24, min: 1, max: 1 + lvl });
    baseJunk.push({ id: 25, min: 0, max: Math.floor(lvl / 2) + 1 });
  }
  if (inst.legendary) {
    baseJunk.push({ id: 28, min: 1, max: 1 + Math.floor(lvl / 2) });
    baseJunk.push({ id: 36, min: 0, max: lvl });
  }

  let gained = [];
  baseJunk.forEach(j => {
    let qty = j.min + Math.floor(Math.random() * (j.max - j.min + 1));
    if (qty > 0) {
      addItemToInv(j.id, qty);
      let jb = getItemBase(j.id);
      gained.push(qty + "x " + jb.name);
    }
  });

  P.inv.splice(idx, 1);
  logMsg("Desguazaste " + it.name + ". Obtuviste: " + (gained.join(", ") || "nada útil"));
  renderVault('scrap');
  updateStats();
}

function getStorageUpgradeCost() {

}

function isStackableType(it) {
  if (!it) return false;
  if (it.stackable) return true;
  return ['junk', 'med', 'chem', 'ingredient', 'other', 'food', 'drink', 'quest', 'ammo'].includes(it.type);
}

function promptQty(max, actionLabel) {
  if (max <= 1) return 1;
  let raw = prompt(actionLabel + " (1-" + max + "):", String(max));
  if (raw === null) return 0;
  let n = parseInt(raw, 10);
  if (isNaN(n) || n < 1) return 0;
  return Math.min(max, n);
}

function mergeOrPushStack(list, inst, qty) {
  let base = getItemBase(inst.id);
  if (isStackableType(base)) {
    // Apilar siempre por id en tipos stackables (ignorar mods vacíos)
    let existing = list.find(i => i.id === inst.id && !i.legendary);
    if (existing) {
      existing.qty = (existing.qty || 1) + qty;
      return;
    }
  }
  let copy = {
    uid: Date.now() + Math.floor(Math.random() * 100000),
    id: inst.id,
    qty: qty,
    mods: (inst.mods && inst.mods.length) ? [...inst.mods] : []
  };
  if (inst.itemLevel) copy.itemLevel = inst.itemLevel;
  if (inst.legendary) copy.legendary = inst.legendary;
  if (inst.ability) copy.ability = inst.ability;
  list.push(copy);
}


function consolidateStacks(list) {
  if (!list) return;
  let map = {};
  let out = [];
  for (let inst of list) {
    let base = getItemBase(inst.id);
    if (isStackableType(base) && !inst.legendary) {
      let key = inst.id;
      if (map[key] !== undefined) {
        out[map[key]].qty = (out[map[key]].qty || 1) + (inst.qty || 1);
        continue;
      }
      map[key] = out.length;
      out.push({ uid: inst.uid || (Date.now() + Math.floor(Math.random()*1e5)), id: inst.id, qty: inst.qty || 1, mods: [] });
    } else {
      out.push(inst);
    }
  }
  list.length = 0;
  out.forEach(x => list.push(x));
}


let _qtyPadState = null;
function openQtyPad(maxQ, title, onConfirm) {
  _qtyPadState = { max: maxQ, value: String(maxQ), onConfirm: onConfirm };
  let m = document.getElementById('modal');
  document.getElementById('modal-body').innerHTML = `
    <h2 style="color:var(--accent);margin-top:0;text-align:center;">${title}</h2>
    <p style="text-align:center;font-size:12px;color:#8d9880;">Disponible: ${maxQ}</p>
    <div id="qty-display" style="text-align:center;font-size:28px;font-weight:bold;color:var(--gold);padding:12px;border:1px solid var(--line);margin:8px 0;background:#0a0c08;">${maxQ}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
      ${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k =>
        `<button style="padding:14px;font-size:16px;" onclick="qtyPadKey('${k}')">${k}</button>`
      ).join('')}
    </div>
    <button id="qty-confirm-btn" style="width:100%;margin-top:10px;background:var(--accent);color:#111;font-weight:bold;padding:12px;" onclick="qtyPadConfirm()">Confirmar</button>
    <button style="width:100%;margin-top:6px;" onclick="closeModal();">Cancelar</button>
  `;
  m.classList.add('show');
}
function qtyPadKey(k) {
  if (!_qtyPadState) return;
  let v = _qtyPadState.value || '';
  if (k === 'C') v = '';
  else if (k === '⌫') v = v.slice(0, -1);
  else {
    if (v === '0') v = '';
    v += k;
  }
  let n = parseInt(v || '0', 10);
  if (n > _qtyPadState.max) n = _qtyPadState.max;
  _qtyPadState.value = v === '' ? '' : String(n);
  let el = document.getElementById('qty-display');
  if (el) el.textContent = _qtyPadState.value === '' ? '0' : _qtyPadState.value;
}
function qtyPadConfirm() {
  if (!_qtyPadState) return;
  let n = parseInt(_qtyPadState.value || '0', 10);
  if (isNaN(n) || n < 1) { closeModal(); return; }
  n = Math.min(_qtyPadState.max, n);
  let cb = _qtyPadState.onConfirm;
  _qtyPadState = null;
  closeModal();
  if (cb) cb(n);
}

function moveToStorage(uid) {
  ensureVaultDefaults();
  let idx = P.inv.findIndex(i => i.uid === uid);
  if (idx === -1) return;
  let inst = P.inv[idx];
  if (inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid) {
    logMsg("No puedes guardar un objeto equipado.");
    return;
  }
  let base = getItemBase(inst.id);
  let maxQ = inst.qty || 1;
  const doStore = (qty) => {
    if (qty <= 0) return;
    let addW = (base?.weight || 0) * qty;
    if (getStorageWeight() + addW > P.storageMaxWeight) {
      logMsg("Almacén lleno (" + P.storageMaxWeight + " kg). Mejora la capacidad en Mejoras.");
      return;
    }
    let i2 = P.inv.findIndex(i => i.uid === uid);
    if (i2 === -1) return;
    let inst2 = P.inv[i2];
    let mq = inst2.qty || 1;
    mergeOrPushStack(P.storage, inst2, qty);
    if (qty >= mq) P.inv.splice(i2, 1);
    else inst2.qty = mq - qty;
    consolidateStacks(P.storage);
    consolidateStacks(P.inv);
    logMsg("Guardado en almacén: " + qty + "x " + base.name);
    renderVault('storage');
    updateStats();
  };
  if (isStackableType(base) && maxQ > 1) {
    openQtyPad(maxQ, "Almacenar: " + base.name, doStore);
    // rename confirm button after open
    setTimeout(() => {
      let btn = document.getElementById('qty-confirm-btn');
      if (btn) btn.textContent = 'Almacenar';
    }, 30);
  } else {
    doStore(maxQ);
  }
}

function moveFromStorage(uid) {
  ensureVaultDefaults();
  let idx = P.storage.findIndex(i => i.uid === uid);
  if (idx === -1) return;
  let inst = P.storage[idx];
  let base = getItemBase(inst.id);
  let maxQ = inst.qty || 1;
  const doTake = (qty) => {
    if (qty <= 0) return;
    let i2 = P.storage.findIndex(i => i.uid === uid);
    if (i2 === -1) return;
    let inst2 = P.storage[i2];
    let mq = inst2.qty || 1;
    let currentWeight = P.inv.reduce((acc, i) => {
      let b = getItemBase(i.id);
      return acc + ((b?.weight || 0) * (i.qty || 1));
    }, 0);
    if (currentWeight + (base?.weight || 0) * qty > getMaxWeight()) {
      logMsg("Inventario lleno. No puedes sacar el objeto.");
      return;
    }
    if (isStackableType(base)) {
      let existing = P.inv.find(i => i.id === inst2.id && !i.legendary);
      if (existing) existing.qty = (existing.qty || 1) + qty;
      else {
        let copy = { uid: Date.now() + Math.floor(Math.random() * 100000), id: inst2.id, qty: qty, mods: [] };
        if (inst2.itemLevel) copy.itemLevel = inst2.itemLevel;
        P.inv.push(copy);
      }
    } else {
      if (qty >= mq) {
        P.storage.splice(i2, 1);
        P.inv.push(inst2);
        logMsg("Sacado del almacén: " + base.name);
        renderVault('storage');
        updateStats();
        return;
      }
    }
    if (qty >= mq) P.storage.splice(i2, 1);
    else inst2.qty = mq - qty;
    consolidateStacks(P.storage);
    consolidateStacks(P.inv);
    logMsg("Sacado del almacén: " + qty + "x " + base.name);
    renderVault('storage');
    updateStats();
  };
  if (isStackableType(base) && maxQ > 1) {
    openQtyPad(maxQ, "Sacar: " + base.name, doTake);
    setTimeout(() => {
      let btn = document.getElementById('qty-confirm-btn');
      if (btn) btn.textContent = 'Sacar';
    }, 30);
  } else {
    doTake(maxQ);
  }
}

function openLunchbox(boxBaseId) {
  if (!removeOneItemByBaseId(boxBaseId)) return;

  let rewards = [];
  let isNuka = (boxBaseId === 15);
  let isLegendaryBox = (boxBaseId === 29);

  if (isLegendaryBox) {
    let legInst = addLegendaryToInv();
    if (legInst) {
      let legBase = getItemBase(legInst.id);
      rewards.push("★ " + legBase.name + " LEGENDARIA (" + legInst.abilityName + ")");
    } else {
      rewards.push("Chapas de compensación (+200)");
      P.caps += 200;
    }
  } else if (isNuka) {
    let gearIds = DB_ITEMS.filter(i => (i.type === 'weapon' || i.type === 'armor') && i.shopTier <= (P.shopLevel || 1)).map(i => i.id);
    let pickedId = gearIds[Math.floor(Math.random() * gearIds.length)] || 1;
    let itemObj = getItemBase(pickedId);
    if (addItemToInv(pickedId, 1)) {
      rewards.push(formatItemGainName(itemObj, 1));
    } else {
      rewards.push("Chapas de compensación (+50)");
      P.caps += 50;
    }
  } else {
    let lvl = P.lunchboxLevel || 1;
    let gotCaps = (20 + lvl * 15) + Math.floor(Math.random() * (40 + lvl * 20));
    P.caps += gotCaps;
    rewards.push(gotCaps + " Chapas");

    let maxTier = Math.min(10, (P.shopLevel || 1) + Math.floor(lvl / 2));
    let allPossibleIds = DB_ITEMS.filter(i => i.shopTier <= maxTier && i.type !== 'other').map(i => i.id);
    let numRewards = 1 + (lvl >= 3 ? 1 : 0) + (lvl >= 5 ? 1 : 0);
    for (let n = 0; n < numRewards; n++) {
      let pickedId = allPossibleIds[Math.floor(Math.random() * allPossibleIds.length)];
      let itemObj = getItemBase(pickedId);
      let cantidadCaida = (itemObj.type === 'junk' || itemObj.type === 'med' || itemObj.type === 'ingredient') ? (1 + Math.floor(Math.random() * (2 + lvl))) : 1;
      if (addItemToInv(pickedId, cantidadCaida)) {
        rewards.push(formatItemGainName(itemObj, cantidadCaida));
      }
    }
  }

  logMsg("¡Abriste una " + getItemBase(boxBaseId).name + "! Conseguiste: " + rewards.join(", "));
  
  let m = document.getElementById('modal');
  let titleColor = isLegendaryBox ? "#ff66cc" : (isNuka ? "var(--gold)" : "var(--accent)");
  document.getElementById('modal-body').innerHTML = `
    <h2 style="color:${titleColor}; text-align:center;">🎉 ¡TARTERA ABIERTA!</h2>
    <p style="text-align:center; font-size:13px;">Has obtenido:</p>
    <div style="background:#10130e; border:1px solid #30362c; padding:12px; margin:12px 0; text-align:center;">
      ${rewards.map(r => `<div style="font-size:14px; font-weight:bold; color:var(--txt); margin:4px 0;">• ${r}</div>`).join('')}
    </div>
    <button style="width:100%;" onclick="closeModal(); renderVault();">ACEPTAR</button>
  `;
  m.classList.add('show');
  updateStats();
}

function updateQuestProgress(type, amount = 1) {
  P.activeQuests.forEach(q => {
    if (q.type === type && !q.completed) {
      q.current = Math.min(q.target, q.current + amount);
      if (q.current >= q.target) {
        q.completed = true;
        logMsg("¡Misión secundaria completada: '" + q.title + "'! Reclama en Misiones.");
      }
    }
  });
  if (!P.activeFactionQuests) P.activeFactionQuests = [];
  P.activeFactionQuests.forEach(q => {
    if (q.type === type && !q.completed) {
      q.current = Math.min(q.target, q.current + amount);
      if (q.current >= q.target) {
        q.completed = true;
        logMsg("¡Misión de facción completada: '" + q.title + "'! Reclama en el asentamiento.");
      }
    }
  });
}

function offerQuestEvent() {
  let available = QUEST_POOL.filter(qp => !P.activeQuests.some(aq => aq.id === qp.id));
  if (available.length === 0) {
    findLoot();
    return;
  }

  let quest = available[Math.floor(Math.random() * available.length)];
  let itemObj = quest.reward.item ? getItemBase(quest.reward.item) : null;
  let itemRew = itemObj ? formatItemGainName(itemObj, quest.reward.qty || 1) : "Ninguno";

  let m = document.getElementById('modal');
  document.getElementById('modal-body').innerHTML = `
    <h2 style="color:var(--accent);">📜 NUEVA MISIÓN ENCONTRADA</h2>
    <h3>${quest.title}</h3>
    <p>${quest.desc}</p>
    <div style="font-size:12px; background:#10130e; padding:8px; border:1px solid #30362c; margin-bottom:12px;">
      <b>Recompensas:</b><br>
      • Chapas: ${quest.reward.caps}<br>
      • Experiencia: ${quest.reward.xp}<br>
      • Objeto: ${itemRew}
    </div>
    <button onclick="acceptQuest('${quest.id}')">ACEPTAR MISIÓN</button>
    <button onclick="closeModal()">RECHAZAR</button>
  `;
  m.classList.add('show');
}

function acceptQuest(questId) {
  let baseQ = QUEST_POOL.find(q => q.id === questId);
  if (baseQ) {
    P.activeQuests.push({ ...baseQ, current: 0, completed: false, claimed: false });
    logMsg("Has aceptado la misión: " + baseQ.title);
  }
  closeModal();
  updateStats();
}

function claimReward(questId) {
  let idx = P.activeQuests.findIndex(q => q.id === questId);
  if (idx === -1) return;

  let q = P.activeQuests[idx];
  P.caps += q.reward.caps;
  addXP(q.reward.xp);
  
  let itemText = "";
  if (q.reward.item) {
    let itemObj = getItemBase(q.reward.item);
    let qty = q.reward.qty || 1;
    addItemToInv(q.reward.item, qty);
    itemText = " y " + formatItemGainName(itemObj, qty);
  }

  logMsg("Recompensa reclamada por '" + q.title + "': +" + q.reward.caps + " chapas, EXP" + itemText + ".");
  P.activeQuests.splice(idx, 1);
  renderQuests();
  updateStats();
}

    html += `<p style="font-size:12px;color:#8d9880;">Ninguna misión de facción activa.</p>`;
  } else {
    P.activeFactionQuests.forEach(q => {
      let fac = FACTIONS[q.faction];
      let pct = Math.floor((q.current / q.target) * 100);

      </div>`;
    });
  }
  html += `<h3 style="color:var(--accent); font-size:13px; margin-top:12px;">Secundarias</h3>`;
  if (P.activeQuests.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">No tienes misiones secundarias. Explora el mapa para encontrar encargos.</p>`;
  } else {
    P.activeQuests.forEach(q => {
      let pct = Math.floor((q.current / q.target) * 100);
      let itemObj = q.reward.item ? getItemBase(q.reward.item) : null;
      let itemRew = itemObj ? formatItemGainName(itemObj, q.reward.qty || 1) : null;

      html += `
        <div class="item">
          <div class="item-head">
            <b>${q.title}</b>
            <span style="font-size:11px; color:${q.completed ? 'var(--accent)' : 'var(--gold)'};">
              ${q.completed ? 'COMPLETADA' : 'EN PROGRESO'}
            </span>
          </div>
          <p style="font-size:12px; margin: 4px 0;">${q.desc}</p>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${pct}%; background:var(--accent);"></div>
          </div>
          <div style="font-size:11px; color:#8d9880; display:flex; justify-content:space-between;">
            <span>Progreso: ${q.current} / ${q.target}</span>
            <span>Recompensa: ${q.reward.caps} chapas, ${q.reward.xp} EXP ${itemRew ? '+ ' + itemRew : ''}</span>
          </div>
      `;
      if (q.completed) {
        html += `<button style="margin-top:8px; width:100%; background:var(--accent); color:#111; font-weight:bold;" onclick="claimReward('${q.id}')">RECLAMAR RECOMPENSA</button>`;
      }
      html += `</div>`;
    });
  }
  document.getElementById('main-view').innerHTML = html;
}

function hashCoord(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return Math.abs(h | 0);
}

function getFactionShopLevel(fid) {
  let rep = getFactionRep(fid);
  let levels = (FACTIONS[fid] && FACTIONS[fid].shopLevels) || [100, 250, 500, 750, 1000];
  let lvl = 0;
  for (let i = 0; i < levels.length; i++) {
    if (rep >= levels[i]) lvl = i + 1;
  }
  return lvl; // 0 = bloqueada, 1-5 = niveles
}

function formatGameDateTime() {
  let h = P.worldHours || 9;
  let day = Math.floor(h / 24) + 1;
  let hour = h % 24;
  // Meses simples de 30 días
  let month = Math.floor((day - 1) / 30) + 1;
  let dom = ((day - 1) % 30) + 1;
  let year = 2290 + Math.floor((month - 1) / 12);
  month = ((month - 1) % 12) + 1;
  return dom + '/' + month + '/' + year + ' ' + String(hour).padStart(2, '0') + ':00';
}

function getWeatherInfo() {
  let key = P.weather || 'day';
  return WEATHER_TYPES[key] || WEATHER_TYPES.day;
}

function updateWeatherFromTime() {
  let hour = (P.worldHours || 9) % 24;
  let h = hashCoord(Math.floor((P.worldHours || 0) / 6), P.x + P.y);
  let roll = h % 100;
  let isNight = (hour >= 20 || hour < 6);

  if (isNight) {
    if (roll < 15) P.weather = 'radrain';
    else if (roll < 30) P.weather = 'fog';
    else if (roll < 45) P.weather = 'storm';
    else if (roll < 70) P.weather = 'clear_night';
    else P.weather = 'night';
  } else {
    if (roll < 12) P.weather = 'radrain';
    else if (roll < 25) P.weather = 'rain';
    else if (roll < 35) P.weather = 'fog';
    else if (roll < 45) P.weather = 'storm';
    else P.weather = 'day';
  }
}

function advanceTime(hours = 1) {
  P.worldHours = (P.worldHours || 9) + hours;
  let prev = P.weather;
  updateWeatherFromTime();
  // Efectos climáticos por hora
  let w = getWeatherInfo();
  if (w.radMult > 1 && Math.random() < 0.4 * (w.radMult - 1)) {
    addRads(Math.floor(3 * w.radMult));
  }
  if (P.weather !== prev) {
    logMsg("Clima: " + w.label);
  }
  // Compañeros descansando regeneran vida cada hora
  // Granja del jugador: chapas por hora
  let ps = P.playerSettlement;
  if (ps && ps.claimed && (ps.settlers || 0) > 0) {
    ps.farmCaps = (ps.farmCaps || 0) + (ps.settlers * 2 * hours);
  }
  if (P.prison && P.prison.length) {
    for (let h = 0; h < hours; h++) {
      P.prison.forEach(c => {
        if (c.hp < c.maxHp) {
          let heal = Math.max(1, Math.floor(c.maxHp * 0.12));
          c.hp = Math.min(c.maxHp, c.hp + heal);
          if (c.resting && c.hp >= c.maxHp) {
            c.resting = false;
            c.hp = c.maxHp;
            logMsg(c.name + " se ha recuperado y está listo.");
          }
        }
      });
    }
  }
}

function getSettlementAt(x, y) {
  return SETTLEMENTS.find(s => s.x === x && s.y === y) || null;
}

function getZoneAt(x, y) {
  let sett = getSettlementAt(x, y);
  if (sett) {
    let fac = FACTIONS[sett.faction];
    let isPlayer = !!(sett.playerOwned || sett.id === 'player_home');
    let displayName = sett.name;
    if (isPlayer) {
      if (P.playerSettlement && P.playerSettlement.claimed && P.playerSettlement.name) {
        displayName = P.playerSettlement.name + ' (Nv.' + (P.playerSettlement.level || 1) + ')';
      } else {
        displayName = 'Lugar reclamable';
      }
    }
    let def = { ...ZONE_DEFS.settlement };
    if (isPlayer) def.cls = 'player-settlement';
    return {
      type: 'settlement',
      ...def,
      name: displayName,
      settlementId: sett.id,
      faction: isPlayer ? null : sett.faction,
      factionName: isPlayer ? null : (fac ? fac.name : sett.faction),
      playerOwned: isPlayer
    };
  }
  let h = hashCoord(x, y);
  let type;
  if (Math.abs((y * 3 + x) % 11) === 0 || Math.abs((x * 5 - y) % 13) === 0) {
    type = 'river';
  } else if (x % 7 === 0 || y % 9 === 0) {
    type = 'road';
  } else {
    let roll = h % 100;
    if (roll < 32) type = 'empty';
    else if (roll < 50) type = 'ruin';
    else if (roll < 60) type = 'camp';
    else if (roll < 74) type = 'poi';
    else if (roll < 88) type = 'city';
    else type = 'empty';
  }

  let def = ZONE_DEFS[type];
  let names = POI_NAMES[type] || [def.label];
  let name = names[h % names.length];
  return { type, ...def, name };
}

function getZoneName() {
  if (P.location) {
    let room = getCurrentRoom();
    return (P.location.name || 'Interior') + (room ? ' — ' + room.name : '');
  }
  return getZoneAt(P.x, P.y).name;
}

function getCurrentRoom() {
  if (!P.location || !P.location.rooms) return null;
  return P.location.rooms.find(r => r.id === P.location.roomId) || P.location.rooms[0];
}

function countMedsById(baseId) {
  return countItemsByBaseId(baseId);
}

function fmtCoord(n) {
  return n > 0 ? '+' + n : '' + n;
}

function renderWorldGrid() {
  let cells = '';
  for (let dy = 3; dy >= -3; dy--) {
    for (let dx = -3; dx <= 3; dx++) {
      let zx = P.x + dx, zy = P.y + dy;
      let z = getZoneAt(zx, zy);
      let isPlayer = (dx === 0 && dy === 0);
      let cls = 'world-cell ' + z.cls + (isPlayer ? ' player' : '') + (z.enterable ? ' enterable' : '') + (z.playerOwned ? ' player-settlement' : '');
      let icon = isPlayer ? '☺' : z.icon;
      cells += `<div class="${cls}" title="${z.name}">${icon}</div>`;
    }
  }
  return `<div class="world-grid" style="grid-template-columns:repeat(7,1fr);max-width:280px;">${cells}</div>
    <p style="font-size:9px;color:#8d9880;text-align:center;margin:2px 0;">· vacío · ═ carretera · ≈ río · ⌂ ruinas · ▣ ciudad · ★ interés · ⛺ camp · ⚑ asentamiento</p>`;
}

function enterLocation() {
  let zone = getZoneAt(P.x, P.y);
  if (!zone.enterable) {
    logMsg("No hay nada a lo que entrar aquí.");
    return;
  }
  let templateKey = zone.type;
  if (!INTERIOR_TEMPLATES[templateKey]) templateKey = 'ruin';
  let rooms = INTERIOR_TEMPLATES[templateKey].map(r => ({ ...r, exits: { ...r.exits } }));
  P.location = {
    type: zone.type,
    name: zone.name,
    worldX: P.x,
    worldY: P.y,
    roomId: rooms[0].id,
    rooms: rooms,
    searched: {}
  };
  logMsg("Entras en: " + zone.name + ".");
  renderMap();
  updateStats();
}

function exitLocation() {
  if (!P.location) return;
  logMsg("Sales de " + P.location.name + " al Yermo.");
  P.location = null;
  renderMap();
  updateStats();
}

function interiorMove(dir) {
  let room = getCurrentRoom();
  if (!room || !room.exits[dir]) {
    logMsg("No puedes ir en esa dirección.");
    return;
  }
  P.location.roomId = room.exits[dir];
  let next = getCurrentRoom();
  logMsg("Te mueves a: " + (next ? next.name : '...') + ".");
  tickEffects();
  advanceTime(1);
  let combatChance = 0.18 + (getWeatherInfo().combatMod || 0);
  if (Math.random() < combatChance) {
    startCombat(false);
    return;
  }
  renderMap();
  updateStats();
}

function ensureFactionDefaults() {
  if (!P.reputation) P.reputation = {};
  ['bos','enclave','outcasts','settlers','railroad','rnc','strip','institute'].forEach(k => {
    if (P.reputation[k] === undefined || P.reputation[k] === null) P.reputation[k] = 0;
  });
  if (!P.activeFactionQuests) P.activeFactionQuests = [];
  if (!Array.isArray(P.activeFactionQuests)) P.activeFactionQuests = [];
  if (!P.factionQuestPool) P.factionQuestPool = {};
  if (P.volMusic === undefined) P.volMusic = 0.6;
  if (P.volSfx === undefined) P.volSfx = 0.7;
  if (P.factionShopPage === undefined) P.factionShopPage = {};
}


function factionColor(fid) {
  try {
    let f = FACTIONS && FACTIONS[fid];
    return (f && f.color) ? f.color : '#00aa2a';
  } catch (e) { return '#00aa2a'; }
}
function factionName(fid) {
  try {
    let f = FACTIONS && FACTIONS[fid];
    return (f && f.name) ? f.name : (fid || 'Facción');
  } catch (e) { return fid || 'Facción'; }
}

function getFactionRep(fid) {
  ensureFactionDefaults();
  return P.reputation[fid] || 0;
}

function addFactionRep(fid, amount) {
  ensureFactionDefaults();
  P.reputation[fid] = Math.min(1000, (P.reputation[fid] || 0) + amount);
  logMsg("Reputación con " + (FACTIONS[fid]?.name || fid) + ": " + P.reputation[fid]);
}

function getAvailableFactionQuests(fid) {
  ensureFactionDefaults();
  let rep = getFactionRep(fid);
  let pool = FACTION_QUEST_POOL[fid] || [];
  let activeIds = (P.activeFactionQuests || []).filter(q => q.faction === fid).map(q => q.id);
  let activeCount = activeIds.length;
  // Slots de oferta = 3 menos las ya activas (máx 3 activas por facción)
  let offerSlots = Math.max(0, 3 - activeCount);
  if (!P.factionQuestPool[fid]) P.factionQuestPool[fid] = [];
  // Quitar del pool las ya activas o inválidas
  P.factionQuestPool[fid] = P.factionQuestPool[fid].filter(id => {
    if (activeIds.includes(id)) return false;
    let q = pool.find(x => x.id === id);
    return q && q.minRep <= rep;
  });
  // Cap duro a offerSlots
  if (P.factionQuestPool[fid].length > offerSlots) {
    P.factionQuestPool[fid] = P.factionQuestPool[fid].slice(0, offerSlots);
  }
  // Rellenar hasta offerSlots
  while (P.factionQuestPool[fid].length < offerSlots) {
    let candidates = pool.filter(q =>
      q.minRep <= rep &&
      !P.factionQuestPool[fid].includes(q.id) &&
      !activeIds.includes(q.id)
    );
    if (candidates.length === 0) break;
    let pick = candidates[Math.floor(Math.random() * candidates.length)];
    P.factionQuestPool[fid].push(pick.id);
  }
  return P.factionQuestPool[fid].map(id => pool.find(q => q.id === id)).filter(Boolean);
}

function enterSettlement(settlementId) {
  let sett = SETTLEMENTS.find(s => s.id === settlementId);
  if (!sett) return;
  if (P.x !== sett.x || P.y !== sett.y) {
    logMsg("Debes estar en el asentamiento.");
    return;
  }
  if (sett.playerOwned || sett.id === 'player_home') {
    enterPlayerSettlement();
    return;
  }
  P.location = { type: 'settlement', settlementId: sett.id, name: sett.name, faction: sett.faction };
  logMsg("Entras en " + sett.name + " (" + (FACTIONS[sett.faction]?.name || '') + ").");
  renderSettlementUI(sett.id, 'missions');
  updateStats();
}

function renderSettlementUI(settlementId, tab) {
  ensureFactionDefaults();
  let sett = SETTLEMENTS.find(s => s.id === settlementId);
  if (!sett) { renderMap(); return; }
  if (sett.playerOwned || sett.id === 'player_home') {
    enterPlayerSettlement();
    return;
  }
  let fac = FACTIONS[sett.faction] || { name: sett.faction, color: '#00aa2a', shopLevels: [100,250,500,750,1000] };
  let fcol = fac.color || '#00aa2a';
  let rep = getFactionRep(sett.faction);
  tab = tab || 'missions';

  let html = `
    <div style="text-align:center;">
      <h2 style="color:${fcol}; margin:4px 0;">⚑ ${sett.name}</h2>
      <div style="font-size:12px; color:#8d9880;"><span style="color:${fcol};">${fac.name}</span> · Reputación: <b style="color:${fcol};">${rep}/1000</b></div>
    </div>
    <div class="subtabs" style="margin-top:8px;">
      <button class="${tab === 'missions' ? 'active' : ''}" onclick="renderSettlementUI('${sett.id}','missions')">Misiones</button>
      <button class="${tab === 'shop' ? 'active' : ''}" onclick="renderSettlementUI('${sett.id}','shop')">Tienda</button>
      <button class="${tab === 'base' ? 'active' : ''}" onclick="renderSettlementUI('${sett.id}','base')">Base</button>
    </div>
  `;

  if (tab === 'missions') {
    html += `<h3 style="color:${fcol}; font-size:13px;">Misiones principales (reclamar aquí)</h3>`;
    let mine = (P.activeFactionQuests || []).filter(q => q && q.faction === sett.faction);
    if (mine.length > 0) {
      mine.forEach(q => {
        html += `<div class="item fcol" style="border-color:${fcol} !important;">
          <b style="color:${fcol} !important;">${q.title}</b> <span style="font-size:10px;color:${fcol} !important;">PRINCIPAL</span><br>
          <span style="font-size:11px;color:#8d9880;">${q.desc || ''}</span><br>
          <span style="font-size:11px;">Progreso: ${q.current || 0}/${q.target || 1}</span><br>`;
        if (q.completed) {
          html += `<button style="margin-top:6px;background:var(--accent);color:#111;" onclick="claimFactionQuest('${q.id}')">RECLAMAR RECOMPENSA</button>`;
        } else {
          html += `<span style="font-size:11px;color:#8d9880;">En curso...</span>`;
        }
        html += `</div>`;
      });
    }
    let avail = getAvailableFactionQuests(sett.faction).filter(q => q && !(P.activeFactionQuests || []).some(a => a.id === q.id));
    let activeCount = (P.activeFactionQuests || []).filter(q => q && q.faction === sett.faction).length;
    html += `<h3 style="color:${fcol}; font-size:13px;">Disponibles (${avail.length}) · Activas ${activeCount}/3</h3>`;
    if (activeCount >= 3) {
      html += `<p style="font-size:11px;color:var(--danger);">Máximo de 3 misiones activas con esta facción. Completa alguna para aceptar más.</p>`;
    }
    if (avail.length === 0) {
      html += `<p style="font-size:12px;color:#8d9880;">No hay misiones nuevas. Completa las activas o sube reputación.</p>`;
    } else {
      avail.forEach(q => {
        let rw = q.reward || {};
        html += `<div class="item fcol" style="border-color:${fcol} !important;">
          <b style="color:${fcol} !important;">${q.title}</b><br>
          <span style="font-size:11px;color:#8d9880;">${q.desc || ''}</span><br>
          <span style="font-size:11px;">Recompensa: ${rw.caps || 0} chapas · ${rw.xp || 0} XP · +${rw.rep || 0} rep</span><br>
          <button style="margin-top:6px;" onclick="acceptFactionQuest('${sett.faction}','${q.id}')">ACEPTAR</button>
        </div>`;
      });
    }
  } else if (tab === 'shop') {
    let shopLvl = getFactionShopLevel(sett.faction);
    let thresholds = fac.shopLevels || [100, 250, 500, 750, 1000];
    if (shopLvl < 1) {
      html += `<p style="font-size:13px;color:var(--danger);">Tienda bloqueada. Necesitas reputación ${thresholds[0]} (tienes ${rep}).</p>`;
    } else {
      html += `<p style="font-size:12px;color:#8d9880;">Tienda nivel <b style="color:${fcol};">${shopLvl}/5</b> · Rep <b style="color:${fcol};">${rep}/1000</b> · Umbrales: ${thresholds.join('/')}</p>`;
      let baseItems = (FACTION_SHOP_ITEMS[sett.faction] || []).filter(it => shopLvl >= (it.shopLevel || 1));
      let uniqueItems = (FACTION_UNIQUE_SHOP[sett.faction] || []).filter(it => shopLvl >= (it.shopLevel || 1));
      let items = [...uniqueItems, ...baseItems];
      let seen = {};
      items = items.filter(e => { if (!e || seen[e.id]) return false; seen[e.id] = true; return true; });
      if (items.length === 0) {
        html += `<p style="font-size:12px;color:#8d9880;">Sin mercancía.</p>`;
      } else {
        if (!P.factionShopPage) P.factionShopPage = {};
        if (P.factionShopPage[sett.id] === undefined) P.factionShopPage[sett.id] = 0;
        let page = P.factionShopPage[sett.id] || 0;
        const PER = 5;
        let totalPages = Math.max(1, Math.ceil(items.length / PER));
        if (page >= totalPages) page = totalPages - 1;
        if (page < 0) page = 0;
        P.factionShopPage[sett.id] = page;
        let slice = items.slice(page * PER, page * PER + PER);
        slice.forEach(entry => {
          let it = getItemBase(entry.id);
          if (!it) return;
          let price = Math.max(1, Math.floor((it.value || 10) * 1.8));
          let uniqueTag = it.factionOnly ? ' <span style="color:var(--gold);font-size:10px;">★ FACCIÓN</span>' : '';
          html += `<div class="item fcol" style="border-color:${fcol} !important;">
            <b style="color:${fcol} !important;">${it.name}</b>${uniqueTag} — ${price} chapas
            <span style="font-size:10px;color:#8d9880;"> (Tienda Nv.${entry.shopLevel || 1} · Equipo Nv.${P.lvl || 1})</span><br>
            <button style="margin-top:4px;" onclick="buyFactionItem('${sett.faction}',${entry.id},${price})">Comprar</button>
          </div>`;
        });
        if (totalPages > 1) {

function isSynthCompanion(c) {
  if (!c) return false;
  let n = (c.name || '').toLowerCase();
  let t = (c.type || '').toLowerCase();
  return t === 'synth' || n.includes('synth') || n.includes('sintético') || n.includes('courser');
}

function synthSellPrice(c) {
  let base = 40 + (c.level || 1) * 15;
  if (c.isLegendary) base = Math.floor(base * 2.5);
  if ((c.name || '').toLowerCase().includes('courser') || (c.name || '').toLowerCase().includes('gen-3')) base = Math.floor(base * 1.3);
  return base;
}

function openSynthLiberationUI(settlementId) {
  let synths = (P.prison || []).filter(isSynthCompanion);
  let html = `<h2 style="color:#cccc66;margin-top:0;">🕊 Liberación de Synth</h2>
    <p style="font-size:12px;color:#8d9880;">El Ferrocarril paga por liberar Synths. Se eliminan de la prisión.</p>`;
  if (synths.length === 0) {
    html += `<p style="font-size:12px;color:#8d9880;">No tienes compañeros sintéticos en la prisión.</p>`;
  } else {
    synths.forEach(c => {

}

function sellSynthCompanion(id, settlementId) {
  let idx = (P.prison || []).findIndex(c => c.id === id);
  if (idx < 0) return;
  let c = P.prison[idx];
  if (!isSynthCompanion(c)) return;
  let price = synthSellPrice(c);
  if (P.equippedCompanionId === id) P.equippedCompanionId = null;
  P.prison.splice(idx, 1);
  P.caps += price;
  logMsg("Has liberado a " + c.name + " a cambio de " + price + " chapas.");
  openSynthLiberationUI(settlementId);
  updateStats();
}

function generateSynthOffer() {
  let lvl = P.lvl || 1;
  let names = [
    'Synth Gen-1', 'Synth Gen-1 armado', 'Synth Gen-2', 'Synth Gen-2 infiltrado',
    'Synth Gen-3', 'Synth Gen-3 Cazador', 'Courser', 'Synth de seguridad'
  ];
  let offers = [];
  for (let i = 0; i < 3; i++) {
    let name = names[Math.floor(Math.random() * names.length)];
    let olvl = Math.max(1, lvl - 2 + Math.floor(Math.random() * 4));
    let isLeg = Math.random() < 0.08;
    let hp = 50 + olvl * 8 + (isLeg ? 40 : 0);
    let dmg = 10 + olvl * 1.5 + (isLeg ? 10 : 0);
    let cost = 80 + olvl * 25 + (isLeg ? 200 : 0);
    let comp = createCompanionFromEnemy(name + (isLeg ? ' Legendario' : ''), olvl, Math.floor(hp), Math.floor(dmg), isLeg);
    comp.type = 'synth';
    offers.push({ companion: comp, cost: cost });
  }
  return offers;
}

let _synthHireOffers = null;

function openSynthHireUI(settlementId) {
  if (!_synthHireOffers) _synthHireOffers = generateSynthOffer();
  let html = `<h2 style="color:#66ccff;margin-top:0;">🤖 Contratación de Synth</h2>
    <p style="font-size:12px;color:#8d9880;">Oferta actual (acorde a tu nivel ${P.lvl}). Rerolear es gratis.</p>`;

    html += `<div class="item">
      <b>${c.isLegendary ? '★ ' : ''}${c.name}</b> Nv.${c.level} — <span style="color:var(--gold);">${o.cost} chapas</span><br>

function hireSynthOffer(idx, settlementId) {
  if (!_synthHireOffers || !_synthHireOffers[idx]) return;
  let o = _synthHireOffers[idx];
  if (P.caps < o.cost) { logMsg("No tienes chapas."); return; }
  if (!P.prison) P.prison = [];
  if (P.prison.length >= getPrisonCapacity()) {
    logMsg("Prisión llena.");
    return;
  }
  P.caps -= o.cost;
  P.prison.push(o.companion);
  logMsg("Has contratado a " + o.companion.name + " por " + o.cost + " chapas.");
  _synthHireOffers.splice(idx, 1);
  if (_synthHireOffers.length === 0) _synthHireOffers = generateSynthOffer();
  openSynthHireUI(settlementId);
  updateStats();
}

function getCasinoAudio() {
  let audio = document.getElementById('casino-audio');
  if (!audio) {
    audio = document.createElement('audio');
    audio.id = 'casino-audio';
    audio.loop = true;
    audio.preload = 'auto';
    document.body.appendChild(audio);
  }
  return audio;
}

function startCasinoMusic() {
  casinoActive = true;
  // Pausar ambiente y radio
  pauseAmbientMusic();
  let radio = document.getElementById('radio-audio');
  if (radio && !radio.paused) {
    radio.pause();
  }
  let audio = getCasinoAudio();
  // Ruta relativa offline (PWA/GitHub Pages)
  let src = './audio/CasinoStrip.mp3';
  try {
    // Fuerza recarga del path correcto si hace falta
    let abs = new URL(src, window.location.href).href;
    if (!audio.src || audio.src.indexOf('CasinoStrip') === -1) {
      audio.src = abs;
    }
  } catch (e) {
    audio.src = src;
  }
  audio.loop = true;
  audio.volume = (P.volMusic !== undefined) ? P.volMusic : 0.6;
  const tryPlay = () => {
    audio.play().then(() => {
      // ok
    }).catch((err) => {
      logMsg("Casino: no se pudo reproducir CasinoStrip.mp3 (¿está en audio/?).");
      console.warn('casino audio', err);
    });
  };
  if (audio.readyState >= 2) {
    tryPlay();
  } else {
    audio.oncanplay = () => { audio.oncanplay = null; tryPlay(); };
    audio.load();
    // Fallback por si oncanplay no dispara en cache
    setTimeout(tryPlay, 300);
  }
}

function stopCasinoMusic() {
  casinoActive = false;
  let audio = document.getElementById('casino-audio');
  if (audio) {
    try { audio.pause(); audio.currentTime = 0; } catch (e) {}
  }
  if (!radioPlaying) startAmbientMusic();
}

function doSlots(bet, settlementId) {
  if ((P.chips||0) < bet) { logMsg("Fichas insuficientes."); return; }
  P.chips -= bet;
  let symbols = ['🍒','🍋','7️⃣','💎','🔔'];
  let a = symbols[Math.floor(Math.random()*symbols.length)];
  let b = symbols[Math.floor(Math.random()*symbols.length)];
  let c = symbols[Math.floor(Math.random()*symbols.length)];
  let win = 0;
  if (a===b && b===c) {
    if (a==='💎') win = bet * 25;
    else if (a==='7️⃣') win = bet * 10;
    else win = bet * 3;
  } else if (a===b || b===c || a===c) win = Math.floor(bet * 0.5);
  P.chips += win;
  let el = document.getElementById('slots-result');
  if (el) el.innerHTML = a + ' ' + b + ' ' + c + (win ? '<br><span style="color:var(--gold);">+" + win + " fichas</span>' : '<br>Sin premio');
  // fix string bug
  if (el) el.innerHTML = a + ' ' + b + ' ' + c + (win ? ('<br><span style="color:var(--gold);">+' + win + ' fichas</span>') : '<br>Sin premio');
  updateStats();

function cardVal() { return 1 + Math.floor(Math.random()*13); }
function handScore(cards) {
  let t = 0, aces = 0;
  cards.forEach(c => { if (c === 1) { aces++; t += 11; } else t += Math.min(10, c); });
  while (t > 21 && aces > 0) { t -= 10; aces--; }
  return t;
}

function doBlackjack(bet, settlementId) {
  if ((P.chips||0) < bet) { logMsg("Fichas insuficientes."); return; }
  P.chips -= bet;
  let player = [cardVal(), cardVal()];
  let dealer = [cardVal(), cardVal()];
  while (handScore(player) < 17) player.push(cardVal());
  while (handScore(dealer) < 17) dealer.push(cardVal());
  let ps = handScore(player), ds = handScore(dealer);
  let msg = "Tú: " + ps + " · Banca: " + ds + " — ";
  let win = 0;
  if (ps > 21) msg += "Te pasas.";
  else if (ds > 21 || ps > ds) {
    win = (ps === 21 && player.length === 2) ? Math.floor(bet * 2.5) : bet * 2;
    msg += "Ganas +" + (win - bet) + " fichas netas.";
    P.chips += win;
  } else if (ps === ds) {
    P.chips += bet;
    msg += "Empate. Apuesta devuelta.";
  } else msg += "Pierdes.";
  let el = document.getElementById('bj-result');
  if (el) el.textContent = msg;
  updateStats();
}

function doRoulette(bet, kind, settlementId) {
  if ((P.chips||0) < bet) { logMsg("Fichas insuficientes."); return; }
  P.chips -= bet;
  let n = Math.floor(Math.random() * 37); // 0-36
  let isRed = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n);
  let win = 0;
  let msg = "Salió " + n + (n === 0 ? ' (verde)' : (isRed ? ' rojo' : ' negro')) + ". ";
  if (kind === 'red' && isRed && n !== 0) win = bet * 2;
  else if (kind === 'black' && !isRed && n !== 0) win = bet * 2;
  else if (kind === 'even' && n !== 0 && n % 2 === 0) win = bet * 2;
  else if (kind === 'number') {
    // jugador "elige" aleatorio implícito: gana solo si sale 7 como número de la casa demo
    if (n === 7) win = bet * 35;
  }
  if (win) { P.chips += win; msg += "Ganas " + win + " fichas!"; }
  else msg += "Sin premio.";
  let el = document.getElementById('rou-result');
  if (el) el.textContent = msg;
  updateStats();
}

function generateSynthGen1Offer() {
  let names = ['Synth Gen-1', 'Synth Gen-1 trabajador', 'Synth Gen-1 básico', 'Synth Gen-1 de servicio'];
  let offers = [];
  for (let i = 0; i < 3; i++) {
    let name = names[Math.floor(Math.random() * names.length)];
    let hp = 45 + Math.floor(Math.random() * 15);
    let dmg = 8 + Math.floor(Math.random() * 5);
    let cost = 50 + Math.floor(Math.random() * 30);
    let comp = createCompanionFromEnemy(name, 1, hp, dmg, false);
    comp.type = 'synth';
    comp.level = 1;
    offers.push({ companion: comp, cost: cost });
  }
  return offers;
}
let _synthGen1Offers = null;

function openSynthHireGen1UI(settlementId) {
  ensureFactionDefaults();
  if (getFactionRep('institute') < 500) {
    logMsg("Necesitas 500 de reputación con el Instituto (tienes " + getFactionRep('institute') + ").");

function hireSynthGen1(idx, settlementId) {
  if (!_synthGen1Offers || !_synthGen1Offers[idx]) return;

function getSettlerHireCost() {
  let ps = ensurePlayerSettlement();

function claimFarmCaps() {

  ps.farmCaps = 0;
