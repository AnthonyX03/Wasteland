  renderMap();
  updateStats();
}

function exitLocation() {
  if (!P.location) return;
  logMsg("Sales de " + P.location.name + " al Yermo.");
  P.location = null;
  renderMap();
  updateStats();
}

function interiorMove(dir) {
  let room = getCurrentRoom();
  if (!room || !room.exits[dir]) {
    logMsg("No puedes ir en esa dirección.");
    return;
  }
  P.location.roomId = room.exits[dir];
  let next = getCurrentRoom();
  logMsg("Te mueves a: " + (next ? next.name : '...') + ".");
  tickEffects();
  advanceTime(1);
  let combatChance = 0.18 + (getWeatherInfo().combatMod || 0);
  if (Math.random() < combatChance) {
    startCombat(false);
    return;
  }
  renderMap();
  updateStats();
}


// ========== DLC ZETANS ==========
const ABDUCTION_SITE = { x: 22, y: 18 };
const SHIP_ROOM_NAMES = [
  'Corredor de acceso', 'Bahía de carga', 'Laboratorio genético', 'Sala de contención',
  'Puente de mando', 'Hangar de sondas', 'Núcleo de energía', 'Camarote de oficiales',
  'Sala de abducción', 'Depósito de muestras', 'Pasillo irradiado', 'Torre de observación',
  'Cámaras de estasis', 'Taller de drones', 'Comunicaciones', 'Escotilla de escape'
];

function ensureZetanDefaults() {
  if (P.zetanEscapedOnce === undefined) P.zetanEscapedOnce = false;
  if (P.zetanShip === undefined) P.zetanShip = null;
  if (P.zetanAbductions === undefined) P.zetanAbductions = 0;
  if (!P.ammoBox) P.ammoBox = {};
  if (P.ammoBox["Célula energética alienígena"] === undefined) P.ammoBox["Célula energética alienígena"] = 0;
  if (P.ammoBox["Módulo de alimentación alienígena"] === undefined) P.ammoBox["Módulo de alimentación alienígena"] = 0;
  // Si la nave guardada está corrupta, invalidar
  if (P.zetanShip && P.zetanShip.active) {
    if (!Array.isArray(P.zetanShip.grid) || P.zetanShip.grid.length < 7) {
      P.zetanShip = null;
    } else if (typeof P.zetanShip.px !== 'number' || typeof P.zetanShip.py !== 'number') {
      P.zetanShip = null;
    }
  }
}

function isOnZetanShip() {
  return !!(P && P.zetanShip && P.zetanShip.active && P.zetanShip.grid && P.zetanShip.grid.length);
}

function generateZetanShip() {
  // Siempre 7x7 para que coincida con el grid del mapa del Yermo
  let size = 7;
  let grid = [];
  for (let y = 0; y < size; y++) {
    grid[y] = [];
    for (let x = 0; x < size; x++) {
      let name = SHIP_ROOM_NAMES[Math.floor(Math.random() * SHIP_ROOM_NAMES.length)];
      grid[y][x] = { name: name, visited: false, icon: '◈' };
    }
  }
  let edge = Math.floor(Math.random() * 4);
  let sx, sy, ex, ey;
  if (edge === 0) { sx = Math.floor(Math.random() * size); sy = 0; ex = Math.floor(Math.random() * size); ey = size - 1; }
  else if (edge === 1) { sx = Math.floor(Math.random() * size); sy = size - 1; ex = Math.floor(Math.random() * size); ey = 0; }
  else if (edge === 2) { sx = 0; sy = Math.floor(Math.random() * size); ex = size - 1; ey = Math.floor(Math.random() * size); }
  else { sx = size - 1; sy = Math.floor(Math.random() * size); ex = 0; ey = Math.floor(Math.random() * size); }
  if (sx === ex && sy === ey) { ex = (ex + 3) % size; ey = (ey + 2) % size; }
  grid[sy][sx] = { name: 'Escotilla de entrada', visited: true, icon: '◎', isStart: true };
  grid[ey][ex] = { name: 'Escotilla de escape', visited: false, icon: '⇨', isExit: true };
  for (let i = 0; i < 3; i++) {
    let rx = Math.floor(Math.random() * size), ry = Math.floor(Math.random() * size);
    if (!grid[ry][rx].isStart && !grid[ry][rx].isExit) {
      grid[ry][rx].name = ['Núcleo de energía', 'Sala de contención', 'Hangar de sondas'][i % 3];
      grid[ry][rx].icon = ['⚡', '⛓', '🛸'][i % 3];
      grid[ry][rx].special = true;
    }
  }
  return {
    active: true,
    size: size,
    grid: grid,
    px: sx,
    py: sy,
    startX: sx,
    startY: sy,
    exitX: ex,
    exitY: ey,
    seed: Date.now() % 99999
  };
}

function startZetanAbduction() {
  ensureZetanDefaults();
  P.location = null;
  P.zetanShip = generateZetanShip();
  P.zetanAbductions = (P.zetanAbductions || 0) + 1;
  logMsg("¡Un rayo de abducción te envuelve! Despiertas a bordo de una nave Zetan...");
  logMsg("Objetivo: alcanza la escotilla de escape ⇨. Si mueres, pierdes toda la Sangre de Zetan y vuelves a la entrada.");
  renderZetanShipMap();
  updateStats();
}

let _shipMoving = false;
function moveOnZetanShip(dx, dy) {
  if (!isOnZetanShip()) return;
  if (_shipMoving) return;
  if (typeof combatState !== 'undefined' && combatState) return;
  if (P.inCombat) return;
  let ship = P.zetanShip;
  if (!ship || !Array.isArray(ship.grid) || !ship.grid.length) return;
  dx = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
  dy = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
  if (dx === 0 && dy === 0) return;
  let nx = (ship.px | 0) + dx;
  let ny = (ship.py | 0) + dy;
  let size = ship.size | 0;
  if (nx < 0 || ny < 0 || nx >= size || ny >= size) {
    logMsg("No puedes salir de los límites de la nave por aquí.");
    return;
  }
  if (!ship.grid[ny] || !ship.grid[ny][nx]) {
    logMsg("Casilla inválida.");
    return;
  }
  _shipMoving = true;
  ship.px = nx;
  ship.py = ny;
  let cell = ship.grid[ny][nx];
  cell.visited = true;
  logMsg("Te mueves a: " + (cell.icon || '◈') + " " + cell.name + " [" + nx + "," + ny + "]");
  try { tickEffects(); } catch (e) {}
  try { advanceTime(1); } catch (e) {}
  renderZetanShipMap();
  updateStats();
  let ambush = Math.random() < 0.35;
  if (ambush) {
    setTimeout(function() {
      _shipMoving = false;
      if (isOnZetanShip() && !combatState) startCombat(Math.random() < 0.08, true);
    }, 100);
  } else {
    setTimeout(function() { _shipMoving = false; }, 120);
  }
}

function tryEscapeZetanShip() {
  if (!isOnZetanShip()) return;
  let ship = P.zetanShip;
  if (ship.px !== ship.exitX || ship.py !== ship.exitY) {
    logMsg("No hay escotilla de escape aquí.");
    return;
  }
  // Escape exitoso
  P.zetanShip = null;
  let first = !P.zetanEscapedOnce;
  P.zetanEscapedOnce = true;
  // Volver cerca del sitio de abducción
  P.x = ABDUCTION_SITE.x + (Math.random() < 0.5 ? -1 : 1);
  P.y = ABDUCTION_SITE.y + (Math.random() < 0.5 ? -1 : 1);
  logMsg("¡Escapas de la nave Zetan y caes de nuevo en el Yermo!");
  if (first) {

function onZetanShipDeath() {
  if (!isOnZetanShip()) return;
  // Perder toda sangre de zetan
  let lost = 0;
  for (let i = P.inv.length - 1; i >= 0; i--) {
    if (P.inv[i].id === 2400) {
      lost += P.inv[i].qty || 1;
      P.inv.splice(i, 1);
    }
  }
  let ship = P.zetanShip;
  ship.px = ship.startX;
  ship.py = ship.startY;
  P.hp = Math.max(25, Math.floor(getMaxHp() * 0.3));
  logMsg("Has caído en la nave. Pierdes " + lost + "× Sangre de Zetan. Despiertas en la escotilla de entrada.");
  combatState = null;
  closeModal();
  renderZetanShipMap();
  updateStats();
}

function renderZetanShipMap() {
  if (!isOnZetanShip()) { renderMap(); return; }
  let ship = P.zetanShip;
  if (!ship.grid || !ship.grid[ship.py] || !ship.grid[ship.py][ship.px]) {
    logMsg("Error de nave. Regenerando...");
    P.zetanShip = generateZetanShip();
    ship = P.zetanShip;
  }
  let cell = ship.grid[ship.py][ship.px];
  cell.visited = true;
  let cells = '';
  for (let y = 0; y < ship.size; y++) {
    for (let x = 0; x < ship.size; x++) {
      let c = ship.grid[y][x];
      let isHere = (x === ship.px && y === ship.py);
      let cls = 'world-cell';
      if (isHere) cls += ' player';
      if (c.isExit) cls += ' enterable';
      let content;
      if (isHere) content = '☺';
      else if (c.visited || c.isExit || c.isStart) content = c.icon || '◈';
      else content = '·';
      cells += '<div class="' + cls + '" title="' + (c.visited || isHere ? c.name : '???') + '">' + content + '</div>';
    }
  }
  let isExit = !!cell.isExit;
  let actBtns = isExit
    ? '<button style="background:#66ffaa;color:#111;font-weight:bold;" onclick="tryEscapeZetanShip()">⇨ ESCAPAR DE LA NAVE</button>'
    : '<button onclick="zetanShipExplore()">EXPLORAR SALA</button>';
  let blood = countItemsByBaseId(2400);
  document.getElementById('main-view').innerHTML = `
    <div class="map-compact">
    <div class="map-top"><b style="color:#66ffaa;">🛸 Nave Zetan</b> · ${cell.icon || '◈'} <b>${cell.name}</b></div>
    <div class="map-signal-hint" style="color:#8d9880;">Sangre: <b style="color:#66ffaa;">${blood}</b> · [${ship.px},${ship.py}] · Si mueres pierdes la sangre</div>
    <div class="world-grid" style="grid-template-columns:repeat(7,1fr);max-width:260px;width:260px;height:260px;">${cells}</div>
    <div class="map-actions">
      <div class="map-act-row">${actBtns}</div>
      <div class="map-act-hint" style="color:#66ffaa;">Llega a ⇨ para escapar · Emboscadas frecuentes</div>
    </div>
    <div class="map-controls">
      <div class="quick-meds">
        <button onclick="quickUseStim()">💉 Stim</button>
        <button onclick="quickUseRadAway()">☢ RadAway</button>
      </div>
      <div class="map-arrows">
        <div></div><button onclick="moveOnZetanShip(0,-1)">▲</button><div></div>
        <button onclick="moveOnZetanShip(-1,0)">◀</button><button onclick="moveOnZetanShip(0,1)">▼</button><button onclick="moveOnZetanShip(1,0)">▶</button>
      </div>

        <button disabled style="opacity:0.4;">📻</button>

function zetanShipExplore() {
  if (!isOnZetanShip()) return;
  tickEffects();
  advanceTime(1);
  if (Math.random() < 0.55) {
    startCombat(Math.random() < 0.1, true);
    return;
  }
  // Loot: sangre, munición alienígena, a veces armas
  let r = Math.random();
  if (r < 0.28) {
    if (addItemToInv(2400, 1)) logMsg("Encuentras 1× Sangre de Zetan.");
  } else if (r < 0.50) {
    let ammoId = Math.random() < 0.55 ? 2420 : 2421;
    let qty = 1 + Math.floor(Math.random() * 3);
    if (addItemToInv(ammoId, qty)) logMsg("Encuentras munición: " + getItemBase(ammoId).name + " ×" + qty);
  } else if (r < 0.68) {
    let id = [2405, 2406, 13, 7][Math.floor(Math.random() * 4)];
    if (addItemToInv(id, 1)) logMsg("Explorando encuentras: " + getItemBase(id).name);
  } else if (r < 0.82) {
    let weapons = [2401, 2402, 2410, 2411, 2412, 2413, 2414, 2415, 2416, 2417, 2418, 2419];
    let id = weapons[Math.floor(Math.random() * weapons.length)];
    if (addItemToInv(id, 1)) logMsg("¡Encuentras un arma Zetan: " + getItemBase(id).name + "!");
  } else {
    logMsg("La sala está vacía... por ahora.");
  }
  updateStats();
  renderZetanShipMap();
}

function confirmSellZetanBlood(qty) {
  let n = countItemsByBaseId(2400);
  qty = Math.min(n, Math.max(1, parseInt(qty, 10) || 0));
  let left = qty;
  for (let i = P.inv.length - 1; i >= 0 && left > 0; i--) {

function ensureFactionDefaults() {
  if (!P.reputation) P.reputation = {};
  ['bos','enclave','outcasts','settlers','railroad','rnc','strip','institute','atom','minutemen','legion','slavers','nucleologos'].forEach(k => {
    if (P.reputation[k] === undefined || P.reputation[k] === null) P.reputation[k] = 0;
  });
  try { ensureZetanDefaults(); } catch(e) {}

  if (!P.activeFactionQuests) P.activeFactionQuests = [];
  if (!Array.isArray(P.activeFactionQuests)) P.activeFactionQuests = [];
  if (!P.factionQuestPool) P.factionQuestPool = {};
  if (P.volMusic === undefined) P.volMusic = 0.6;
  if (P.volSfx === undefined) P.volSfx = 0.7;
  if (P.factionShopPage === undefined) P.factionShopPage = {};
  if (P.commerceUnlocked === undefined) P.commerceUnlocked = false;
  if (!P.fastTravelUnlocked) P.fastTravelUnlocked = ['vault_home'];
  if (!P.fastTravelUnlocked.includes('vault_home')) P.fastTravelUnlocked.unshift('vault_home');
  ensureChips();
  try { if (typeof ensureZetanDefaults === 'function') ensureZetanDefaults(); } catch (e) {}
}

function addFactionRep(fid, amount) {

  logMsg("Reputación con " + (FACTIONS[fid]?.name || fid) + ": " + P.reputation[fid]);
}

function getAvailableFactionQuests(fid) {
  ensureFactionDefaults();
  let rep = getFactionRep(fid);
  let pool = FACTION_QUEST_POOL[fid] || [];
  let activeIds = (P.activeFactionQuests || []).filter(q => q.faction === fid).map(q => q.id);
  let activeCount = activeIds.length;
  // Slots de oferta = 3 menos las ya activas (máx 3 activas por facción)
  let offerSlots = Math.max(0, 3 - activeCount);
  if (!P.factionQuestPool[fid]) P.factionQuestPool[fid] = [];
  // Quitar del pool las ya activas o inválidas
  P.factionQuestPool[fid] = P.factionQuestPool[fid].filter(id => {
    if (activeIds.includes(id)) return false;
    let q = pool.find(x => x.id === id);
    return q && q.minRep <= rep;
  });
  // Cap duro a offerSlots
  if (P.factionQuestPool[fid].length > offerSlots) {
    P.factionQuestPool[fid] = P.factionQuestPool[fid].slice(0, offerSlots);
  }
  // Rellenar hasta offerSlots
  while (P.factionQuestPool[fid].length < offerSlots) {
    let candidates = pool.filter(q =>
      q.minRep <= rep &&
      !P.factionQuestPool[fid].includes(q.id) &&
      !activeIds.includes(q.id)
    );
    if (candidates.length === 0) break;
    let pick = candidates[Math.floor(Math.random() * candidates.length)];
    P.factionQuestPool[fid].push(pick.id);
  }
  return P.factionQuestPool[fid].map(id => pool.find(q => q.id === id)).filter(Boolean);
}

// ===== SYNTH LIBERACIÓN / CONTRATACIÓN / CASINO =====
function isSynthCompanion(c) {
  if (!c) return false;
  let n = (c.name || '').toLowerCase();
  let t = (c.type || '').toLowerCase();
  return t === 'synth' || n.includes('synth') || n.includes('sintético') || n.includes('courser');
}

function synthSellPrice(c) {
  let base = 40 + (c.level || 1) * 15;
  if (c.isLegendary) base = Math.floor(base * 2.5);
  if ((c.name || '').toLowerCase().includes('courser') || (c.name || '').toLowerCase().includes('gen-3')) base = Math.floor(base * 1.3);
  return base;
}

function openSynthLiberationUI(settlementId) {
  let synths = (P.prison || []).filter(isSynthCompanion);
  let html = `<h2 style="color:#cccc66;margin-top:0;">🕊 Liberación de Synth</h2>
    <p style="font-size:12px;color:#8d9880;">El Ferrocarril paga por liberar Synths. Se eliminan de la prisión.</p>`;
  if (synths.length === 0) {
    html += `<p style="font-size:12px;color:#8d9880;">No tienes compañeros sintéticos en la prisión.</p>`;
  } else {
    synths.forEach(c => {
      let price = synthSellPrice(c);
      html += `<div class="item">
        <b>${c.isLegendary ? '★ ' : ''}${c.name}</b> Nv.${c.level} — <span style="color:var(--gold);">${price} chapas</span><br>
        <button style="margin-top:4px;" onclick="sellSynthCompanion('${c.id}','${settlementId}')">Liberar / Vender</button>
      </div>`;
    });
  }
  html += `<button style="width:100%;margin-top:8px;" onclick="renderSettlementUI('${settlementId}','base')">Volver</button>`;
  document.getElementById('main-view').innerHTML = html;
}

function sellSynthCompanion(id, settlementId) {
  let idx = (P.prison || []).findIndex(c => c.id === id);
  if (idx < 0) return;
  let c = P.prison[idx];
  if (!isSynthCompanion(c)) return;
  let price = synthSellPrice(c);
  if (P.equippedCompanionId === id) P.equippedCompanionId = null;
  P.prison.splice(idx, 1);
  P.caps += price;
  logMsg("Has liberado a " + c.name + " a cambio de " + price + " chapas.");
  openSynthLiberationUI(settlementId);
  updateStats();
}

function generateSynthOffer() {
  let lvl = P.lvl || 1;
  let names = [
    'Synth Gen-1', 'Synth Gen-1 armado', 'Synth Gen-2', 'Synth Gen-2 infiltrado',
    'Synth Gen-3', 'Synth Gen-3 Cazador', 'Courser', 'Synth de seguridad'
  ];
  let offers = [];
  for (let i = 0; i < 3; i++) {
    let name = names[Math.floor(Math.random() * names.length)];
    let olvl = Math.max(1, lvl - 2 + Math.floor(Math.random() * 4));
    let isLeg = Math.random() < 0.08;
    let hp = 50 + olvl * 8 + (isLeg ? 40 : 0);
    let dmg = 10 + olvl * 1.5 + (isLeg ? 10 : 0);
    let cost = 80 + olvl * 25 + (isLeg ? 200 : 0);
    let comp = createCompanionFromEnemy(name + (isLeg ? ' Legendario' : ''), olvl, Math.floor(hp), Math.floor(dmg), isLeg);
    comp.type = 'synth';
    offers.push({ companion: comp, cost: cost });
  }
  return offers;
}

let _synthHireOffers = null;

function openSynthHireUI(settlementId) {
  if (!_synthHireOffers) _synthHireOffers = generateSynthOffer();
  let html = `<h2 style="color:#66ccff;margin-top:0;">🤖 Contratación de Synth</h2>
    <p style="font-size:12px;color:#8d9880;">Oferta actual (acorde a tu nivel ${P.lvl}). Rerolear es gratis.</p>`;
  _synthHireOffers.forEach((o, idx) => {
    let c = o.companion;
    let st = getCompanionCombatStats(c);
    html += `<div class="item">
      <b>${c.isLegendary ? '★ ' : ''}${c.name}</b> Nv.${c.level} — <span style="color:var(--gold);">${o.cost} chapas</span><br>
      <span style="font-size:11px;color:#8d9880;">HP ${c.maxHp} · ATK ${st.dmg} · DEF ${st.def}</span><br>
      <button style="margin-top:4px;" ${P.caps < o.cost ? 'disabled' : ''} onclick="hireSynthOffer(${idx},'${settlementId}')">Contratar</button>
    </div>`;
  });
  html += `<button style="width:100%;margin-top:6px;" onclick="_synthHireOffers=generateSynthOffer();openSynthHireUI('${settlementId}')">🔄 Rerolear oferta</button>
    <button style="width:100%;margin-top:6px;" onclick="renderSettlementUI('${settlementId}','base')">Volver</button>`;
  document.getElementById('main-view').innerHTML = html;
}

function hireSynthOffer(idx, settlementId) {
  if (!_synthHireOffers || !_synthHireOffers[idx]) return;
  let o = _synthHireOffers[idx];
  if (P.caps < o.cost) { logMsg("No tienes chapas."); return; }
  if (!P.prison) P.prison = [];
  if (P.prison.length >= getPrisonCapacity()) {
    logMsg("Prisión llena.");
    return;
  }
  P.caps -= o.cost;
  P.prison.push(o.companion);
  logMsg("Has contratado a " + o.companion.name + " por " + o.cost + " chapas.");
  _synthHireOffers.splice(idx, 1);
  if (_synthHireOffers.length === 0) _synthHireOffers = generateSynthOffer();
  openSynthHireUI(settlementId);
  updateStats();
}

let casinoActive = false;
let radioPausedByCasino = false;

function getCasinoAudio() {
  let audio = document.getElementById('casino-audio');
  if (!audio) {
    audio = document.createElement('audio');
    audio.id = 'casino-audio';
    audio.loop = true;
    audio.preload = 'auto';
    document.body.appendChild(audio);
  }
  return audio;
}

function startCasinoMusic() {
  // Prioridad radio: si hay radio sonando, no poner música del Strip
  let radio = document.getElementById('radio-audio');
  if (radioPlaying && radio && !radio.paused) {
    casinoActive = true; // estamos en zona Strip, pero sin música de casino
    radioPausedByCasino = false;
    pauseAmbientMusic();
    return;
  }
  if (casinoActive) {
    let a = getCasinoAudio();
    if (a && a.paused && !(radioPlaying && radio && !radio.paused)) a.play().catch(()=>{});
    return;
  }
  casinoActive = true;
  pauseAmbientMusic();
  radioPausedByCasino = false;
  let audio = getCasinoAudio();
  // Ruta relativa offline (PWA/GitHub Pages)
  let src = './audio/CasinoStrip.mp3';
  try {
    // Fuerza recarga del path correcto si hace falta
    let abs = new URL(src, window.location.href).href;
    if (!audio.src || audio.src.indexOf('CasinoStrip') === -1) {
      audio.src = abs;
    }
  } catch (e) {
    audio.src = src;
  }
  audio.loop = true;
  audio.volume = (P.volMusic !== undefined) ? P.volMusic : 0.6;
  const tryPlay = () => {
    audio.play().then(() => {
      // ok
    }).catch((err) => {
      logMsg("Casino: no se pudo reproducir CasinoStrip.mp3 (¿está en audio/?).");
      console.warn('casino audio', err);
    });
  };
  if (audio.readyState >= 2) {
    tryPlay();
  } else {
    audio.oncanplay = () => { audio.oncanplay = null; tryPlay(); };
    audio.load();
    // Fallback por si oncanplay no dispara en cache
    setTimeout(tryPlay, 300);
  }
}

function stopCasinoMusic() {
  casinoActive = false;
  let audio = document.getElementById('casino-audio');
  if (audio) {
    try { audio.pause(); audio.currentTime = 0; } catch (e) {}
  }
  // Restaurar radio si estaba sonando al entrar al Strip; si no, ambiente
  if (radioPausedByCasino && radioPlaying) {
    radioPausedByCasino = false;
    let radio = document.getElementById('radio-audio');
    if (radio) {
      radio.volume = P.volMusic !== undefined ? P.volMusic : 0.6;
      radio.play().catch(() => { radioPlaying = false; startAmbientMusic(); });
    }
  } else {
    radioPausedByCasino = false;
    if (!radioPlaying) startAmbientMusic();
  }
}

function confirmSellSlaves(qty) {
  let n = countItemsByBaseId(2305);
  qty = parseInt(qty, 10) || 0;
  if (qty < 1) return;
  if (qty > n) qty = n;
  let left = qty;
  for (let i = P.inv.length - 1; i >= 0 && left > 0; i--) {
    if (P.inv[i].id === 2305) {
      let q = P.inv[i].qty || 1;
      if (q <= left) { left -= q; P.inv.splice(i, 1); }
      else { P.inv[i].qty = q - left; left = 0; }
    }
  }
  let caps = qty * 500;
  P.caps += caps;
  let repGain = 0;
  for (let i = 0; i < qty; i++) repGain += 10 + Math.floor(Math.random() * 11);
  addFactionRep('slavers', repGain);
  logMsg('Vendidos ' + qty + ' esclavo(s): +' + caps + ' chapas, +' + repGain + ' rep. con Los Negreros.');
  updateStats();
  let sett = SETTLEMENTS.find(s => s.faction === 'slavers');
  if (sett) renderSettlementUI(sett.id, 'base');
}

function spinSlots(casinoId) {
  ensureChips();
  casinoId = String(casinoId || '');
  let bet = _slotsBet[casinoId] || 0;
  if (bet < 1) { logMsg('Añade fichas a la apuesta (+1 / +5 / …).'); return; }
  if (!spendCasinoChips(casinoId, bet)) {
    logMsg('Fichas insuficientes. Tienes ' + getCasinoChips(casinoId) + '.');
    return;
  }
  let syms = ['🍒','🍋','🔔','7️⃣','💎'];
  let weights = [30, 25, 20, 15, 10];
  function pick() {
    let t = weights.reduce((a,b)=>a+b,0), r = Math.random()*t, a=0;
    for (let i=0;i<syms.length;i++) { a += weights[i]; if (r <= a) return syms[i]; }
    return syms[0];
  }
  let grid = [];
  for (let r = 0; r < 3; r++) {
    grid[r] = [];
    for (let c = 0; c < 3; c++) {
      grid[r][c] = pick();
      let cell = document.getElementById('slot-c' + r + c);
      if (cell) cell.textContent = grid[r][c];
    }
  }
  let a = grid[1][0], b = grid[1][1], c = grid[1][2];
  let win = 0;
  if (a === b && b === c) {
    if (a === '💎') win = bet * 25;
    else if (a === '7️⃣') win = bet * 10;
    else if (a === '🔔') win = bet * 5;
    else if (a === '🍋') win = bet * 4;
    else win = bet * 3;
  }
  if (win) addCasinoChips(casinoId, win);
  let el = document.getElementById('slots-result');
  if (el) el.innerHTML = win
    ? '<span style="color:var(--gold);font-weight:bold;">¡' + a + b + c + '! +' + win + ' fichas</span>'
    : '<span style="color:#8d9880;">Línea: ' + a + ' ' + b + ' ' + c + ' — sin premio</span>';
  logMsg(win ? ('Tragaperras: +' + win + ' fichas') : 'Tragaperras: sin premio');
  updateStats();
  // Actualizar contador de fichas sin destruir la rejilla
  let hdr = document.querySelector('#main-view p');
  if (hdr) {
    let col = getCasinoColor(casinoId);
    hdr.innerHTML = 'Fichas: <b style="color:' + col + ';">' + getCasinoChips(casinoId) + '</b>';
  }
}

  if (bet < 1) { logMsg('Añade fichas a la apuesta.'); return; }

  let p = draw() + draw();
  let d = draw() + draw();
  while (p < 17) p += draw();
  while (d < 17) d += draw();
  let msg = `Tú: ${p} · Crupier: ${d}. `;
  let win = 0;
  if (p > 21) msg += "Te pasas.";
  else if (d > 21 || p > d) {

    addCasinoChips(casinoId, win);
    msg += "Ganas " + win + " fichas!";
  } else if (p === d) {
    addCasinoChips(casinoId, bet);
    msg += "Empate. Se devuelve la apuesta.";
  } else msg += "Pierdes.";
  let el = document.getElementById('bj-result');
  if (el) el.textContent = msg;
  logMsg(msg);
  updateStats();
}

  if (!_synthGen1Offers) _synthGen1Offers = generateSynthGen1Offer();
  let html = `<h2 style="color:#88ddff;margin-top:0;">🤖 Contratación Gen-1</h2>
    <p style="font-size:12px;color:#8d9880;">Solo nivel 1. Rerolear gratis.</p>`;
  _synthGen1Offers.forEach((o, idx) => {
    let c = o.companion;
    let st = getCompanionCombatStats(c);
    html += `<div class="item">
      <b>${c.name}</b> Nv.1 — <span style="color:var(--gold);">${o.cost} chapas</span><br>
      <span style="font-size:11px;color:#8d9880;">HP ${c.maxHp} · ATK ${st.dmg} · DEF ${st.def}</span><br>
      <button style="margin-top:4px;" ${P.caps < o.cost ? 'disabled' : ''} onclick="hireSynthGen1(${idx},'${settlementId}')">Contratar</button>
    </div>`;
  });
  html += `<button style="width:100%;margin-top:6px;" onclick="_synthGen1Offers=generateSynthGen1Offer();openSynthHireGen1UI('${settlementId}')">🔄 Rerolear</button>
    <button style="width:100%;margin-top:6px;" onclick="renderSettlementUI('${settlementId}','base')">Volver</button>`;
  document.getElementById('main-view').innerHTML = html;
}

function hireSynthGen1(idx, settlementId) {
  if (!_synthGen1Offers || !_synthGen1Offers[idx]) return;
  let o = _synthGen1Offers[idx];
  if (P.caps < o.cost) { logMsg("No tienes chapas."); return; }
  if (!P.prison) P.prison = [];
  if (P.prison.length >= getPrisonCapacity()) { logMsg("Prisión llena."); return; }
  P.caps -= o.cost;
  P.prison.push(o.companion);
  logMsg("Has contratado a " + o.companion.name + " (Gen-1) por " + o.cost + " chapas.");
  _synthGen1Offers.splice(idx, 1);
  if (_synthGen1Offers.length === 0) _synthGen1Offers = generateSynthGen1Offer();
  openSynthHireGen1UI(settlementId);
  updateStats();
}

function ensurePlayerSettlement() {
  if (!P.playerSettlement) {
    P.playerSettlement = {
      claimed: false, name: '', level: 1, settlers: 0, farmCaps: 0,
      houseBuilt: false, travelBuilt: false, medicBuilt: false
    };
  }
  return P.playerSettlement;
}

function getSettlerHireCost() {
  let ps = ensurePlayerSettlement();
  // Cada colono cuesta más: 200, 350, 550, 800...
  let n = ps.settlers || 0;
  return 200 + n * 150 + n * n * 25;
}

function getSettlementUpgradeCost(level) {
  // level is current, cost to go to level+1
  return {
    1: [{ id: 20, qty: 8 }, { id: 21, qty: 6 }],
    2: [{ id: 20, qty: 12 }, { id: 21, qty: 8 }, { id: 13, qty: 4 }],
    3: [{ id: 21, qty: 12 }, { id: 23, qty: 6 }, { id: 13, qty: 6 }],
    4: [{ id: 23, qty: 10 }, { id: 28, qty: 2 }, { id: 20, qty: 15 }],
    5: [{ id: 28, qty: 3 }, { id: 13, qty: 10 }, { id: 23, qty: 12 }],
    6: [{ id: 28, qty: 4 }, { id: 36, qty: 4 }, { id: 21, qty: 15 }],
    7: [{ id: 28, qty: 5 }, { id: 36, qty: 6 }, { id: 13, qty: 12 }],
    8: [{ id: 28, qty: 6 }, { id: 38, qty: 3 }, { id: 23, qty: 15 }],
    9: [{ id: 28, qty: 8 }, { id: 38, qty: 4 }, { id: 36, qty: 8 }]
  }[level] || [{ id: 28, qty: 10 }];
}

function claimFarmCaps() {
  let ps = ensurePlayerSettlement();
  let amt = ps.farmCaps || 0;
  if (amt <= 0) return;
  P.caps += amt;
  ps.farmCaps = 0;
  logMsg("Has reclamado " + amt + " chapas de la granja.");
  renderPlayerSettlementUI('farm');
  updateStats();
}

function hireFarmSettler() {
  let ps = ensurePlayerSettlement();
  if (ps.settlers >= 10 || ps.settlers >= ps.level) {
    logMsg("No puedes contratar más colonos todavía.");
    return;
  }
  let cost = getSettlerHireCost();
  if (P.caps < cost) { logMsg("Chapas insuficientes."); return; }
  P.caps -= cost;
  ps.settlers++;
  logMsg("Colono contratado. Granja: " + ps.settlers + " trabajadores.");
  renderPlayerSettlementUI('farm');
  updateStats();
}

function upgradePlayerSettlement() {
  let ps = ensurePlayerSettlement();
  if (ps.level >= 10) return;
  let costs = getSettlementUpgradeCost(ps.level);
  if (!canPayReqs(costs)) { logMsg("Faltan recursos."); return; }
  payReqs(costs);
  ps.level++;
  logMsg(ps.name + " sube a nivel " + ps.level + ".");
  renderPlayerSettlementUI('base');
  updateStats();
}

function buildPlayerFacility(which) {
  let ps = ensurePlayerSettlement();
  if (which === 'house') {
    let hc = [{ id: 20, qty: 15 }, { id: 21, qty: 10 }, { id: 25, qty: 5 }];
    if (!canPayReqs(hc)) return;
    payReqs(hc);
    ps.houseBuilt = true;
    logMsg("Casa construida en " + ps.name + ".");
  } else if (which === 'travel') {
    let tc = [{ id: 13, qty: 8 }, { id: 22, qty: 8 }, { id: 28, qty: 2 }];
    if (!canPayReqs(tc)) return;
    payReqs(tc);
    ps.travelBuilt = true;
    if (!P.fastTravelUnlocked) P.fastTravelUnlocked = [];
    if (!P.fastTravelUnlocked.includes('player_home')) P.fastTravelUnlocked.push('player_home');
    logMsg("Baliza de viaje rápido construida.");
  } else if (which === 'medic') {
    let mc = [{ id: 35, qty: 6 }, { id: 34, qty: 4 }, { id: 13, qty: 6 }];
    if (!canPayReqs(mc) || P.caps < 500) return;
    payReqs(mc);
    P.caps -= 500;
    ps.medicBuilt = true;
    logMsg("Enfermería construida. Curación gratuita disponible.");
  }
  renderPlayerSettlementUI('base');
  updateStats();
}

function playerMedicHeal() {
  let maxhp = getMaxHp();
  P.hp = maxhp;
  P.rads = 0;
  logMsg("El médico de tu asentamiento te cura por completo (gratis).");
  renderPlayerSettlementUI('base');
  updateStats();
}

function getFarmCapsPerHour() {
  let ps = P.playerSettlement;
  if (!ps || !ps.claimed) return 0;
  let base = (ps.settlers || 0) * 2;
  let rank = (P.perks && P.perks.p_local) || 0;
  if (rank >= 2) return Math.floor(base * 1.5);
  if (rank >= 1) return Math.floor(base * 1.25);
  return base;
}
function getSierraChipsPerHour() {
  let emp = (P.sierraCasino && P.sierraCasino.employees) || 0;
  let base = emp * 2;
  let rank = (P.perks && P.perks.p_greedy) || 0;
  if (rank >= 2) return Math.floor(base * 1.5);
  if (rank >= 1) return Math.floor(base * 1.25);
  return base;
}
function getSierraHireCost() {
  ensureChips();
  let n = (P.sierraCasino && P.sierraCasino.employees) || 0;
  return 250 + n * 200 + n * n * 50;
}
function hireSierraEmployee() {
  ensureChips();

function claimSierraEarnings() {

  addCasinoChips('sierra', n);
  P.sierraCasino.pendingChips = 0;

  renderSierraCasinoUI('casino');
  updateStats();
}

function upgradeSierraCasino() {
  ensureChips();
  let sc = P.sierraCasino;
  if (sc.level >= 10) return;
  let cost = 80 + sc.level * 60;
  if (!spendCasinoChips('sierra', cost)) { logMsg("Fichas insuficientes."); return; }
  // consume module
  let inv = P.inv.find(i => i.id === 3100 && (i.qty || 1) > 0);
  if (!inv) { addCasinoChips('sierra', cost); logMsg("Necesitas un Módulo de Mejora para Casino."); return; }
  inv.qty = (inv.qty || 1) - 1;
  if (inv.qty <= 0) P.inv = P.inv.filter(i => i !== inv);
  sc.level++;
  logMsg("Casino Sierra Madre mejorado a nivel " + sc.level + ".");
  renderSierraCasinoUI('base');
  updateStats();
}

function buildSierraFeature(feat, cost) {
  if (!spendCasinoChips('sierra', cost)) { logMsg("Fichas insuficientes."); return; }
  let sc = P.sierraCasino;
  if (feat === 'medic') sc.medicBuilt = true;
  if (feat === 'room') { sc.roomBuilt = true; if (!P.ownedHouses) P.ownedHouses = []; if (!P.ownedHouses.includes('sierra_madre')) P.ownedHouses.push('sierra_madre'); }
  if (feat === 'travel') {
    sc.travelBuilt = true;
    if (!P.fastTravelUnlocked) P.fastTravelUnlocked = [];
    if (!P.fastTravelUnlocked.includes('sierra_madre')) P.fastTravelUnlocked.push('sierra_madre');
  }
  logMsg("Construcción completada.");
  renderSierraCasinoUI('base');
  updateStats();
}

function sierraHeal(kind) {
  if (kind === 'hp') {
    let need = Math.max(0, getMaxHp() - P.hp);
    let cost = Math.ceil(need / 5);
    if (!spendCasinoChips('sierra', cost)) { logMsg("Fichas insuficientes."); return; }
    P.hp = getMaxHp();
    logMsg("Médico Sierra Madre: salud restaurada (" + cost + " fichas).");
  } else {
    let need = P.rads || 0;
    let cost = Math.ceil(need / 2);
    if (!spendCasinoChips('sierra', cost)) { logMsg("Fichas insuficientes."); return; }
    P.rads = 0;
    logMsg("Médico Sierra Madre: radiación eliminada (" + cost + " fichas).");
  }
  renderSierraCasinoUI('base');
  updateStats();
}

function sierraExchangeTo(casinoId, amount) {
  if (!spendCasinoChips('sierra', amount)) { logMsg("Fichas Sierra Madre insuficientes."); return; }
  addCasinoChips(casinoId, amount);
  logMsg("Cambias " + amount + " SM por " + amount + " de " + ((getCasinoDef(casinoId)||{}).name||casinoId) + ".");
  renderSierraCasinoUI('base');
  updateStats();
}

function ensureRobcoFactory() {
  if (!P.robcoFactory || typeof P.robcoFactory !== 'object') {
    P.robcoFactory = {
      claimed: false, level: 1, robots: 0,
      pendingScrap: {}, // { itemId: qty }
      medicBuilt: false, roomBuilt: false, travelBuilt: false,
      lastMedicHour: -9999,
      craftOffers: null
    };
  }
  if (!P.robcoFactory.pendingScrap) P.robcoFactory.pendingScrap = {};

}

function claimRobcoFactory() {
  ensureRobcoFactory();
  P.robcoFactory.claimed = true;
  P.robcoFactory.level = 1;
  P.robcoFactory.robots = 0;
  P.robcoFactory.pendingScrap = {};
  logMsg("¡Fábrica RobCo Industries reclamada!");
  renderRobcoFactoryUI('scrap');
  updateStats();
}

function getRobcoHireCost() {
  let n = (P.robcoFactory && P.robcoFactory.robots) || 0;
  // primera más barata, luego sube
  let base = 3 + n * 2 + Math.floor(n * n * 0.5);
  return [
    { id: 20, qty: base },
    { id: 21, qty: Math.max(1, Math.floor(base * 0.7)) },
    { id: 13, qty: Math.max(1, Math.floor(base * 0.5)) }
  ];
}
function getRobcoUpgradeCost(level) {
  let q = 6 + level * 4;
  return [
    { id: 21, qty: q },
    { id: 23, qty: Math.floor(q * 0.6) },
    { id: 36, qty: Math.floor(q * 0.4) },
    { id: 28, qty: Math.max(1, Math.floor(level / 2)) }
  ];
}

function hireRobcoWorker() {
  ensureRobcoFactory();
  let rf = P.robcoFactory;
  let maxR = Math.min(10, rf.level || 1);
  if ((rf.robots || 0) >= maxR) { logMsg("Sin plazas. Mejora la fábrica."); return; }
  let cost = getRobcoHireCost();
  if (!canPayReqs(cost)) { logMsg("Chatarra insuficiente."); return; }
  payReqs(cost);
  rf.robots = (rf.robots || 0) + 1;
  logMsg("Robot contratado (" + rf.robots + "/" + maxR + ").");
  renderRobcoFactoryUI('scrap');
  updateStats();
}

function claimRobcoScrap() {
  ensureRobcoFactory();
  let pending = P.robcoFactory.pendingScrap || {};
  let any = false;
  Object.keys(pending).forEach(jid => {
    let q = pending[jid] || 0;
    if (q > 0) {
      addItemToInv(parseInt(jid,10), q);
      any = true;
    }
  });
  P.robcoFactory.pendingScrap = {};
  if (any) logMsg("Chatarra reclamada de la chatarrería RobCo.");
  renderRobcoFactoryUI('scrap');
  updateStats();
}

function tickRobcoScrap() {
  ensureRobcoFactory();
  let rf = P.robcoFactory;
  if (!rf.claimed || (rf.robots || 0) <= 0) return;
  if (!rf.pendingScrap) rf.pendingScrap = {};
  for (let i = 0; i < rf.robots; i++) {
    let jid = ROBCO_SCRAP_IDS[Math.floor(Math.random() * ROBCO_SCRAP_IDS.length)];
    rf.pendingScrap[jid] = (rf.pendingScrap[jid] || 0) + 1;
  }
}

function upgradeRobcoFactory() {
  ensureRobcoFactory();
  let rf = P.robcoFactory;
  if (rf.level >= 10) return;
  let cost = getRobcoUpgradeCost(rf.level);
  if (!canPayReqs(cost)) { logMsg("Chatarra insuficiente."); return; }
  payReqs(cost);
  rf.level++;
  logMsg("Fábrica RobCo mejorada a nivel " + rf.level + ".");
  renderRobcoFactoryUI('base');
  updateStats();
}

function buildRobcoFeature(feat) {
  ensureRobcoFactory();
  let rf = P.robcoFactory;
  let cost;
  if (feat === 'medic') cost = [{id:13,qty:8},{id:36,qty:4},{id:22,qty:6}];
  else if (feat === 'room') cost = [{id:20,qty:12},{id:21,qty:10},{id:27,qty:6}];
  else if (feat === 'travel') cost = [{id:13,qty:10},{id:36,qty:5},{id:28,qty:3}];
  else return;
  if (!canPayReqs(cost)) { logMsg("Chatarra insuficiente."); return; }
  payReqs(cost);
  if (feat === 'medic') rf.medicBuilt = true;
  if (feat === 'room') {
    rf.roomBuilt = true;
    if (!P.ownedHouses) P.ownedHouses = [];
    if (!P.ownedHouses.includes('robco_factory')) P.ownedHouses.push('robco_factory');
  }
  if (feat === 'travel') {
    rf.travelBuilt = true;
    if (!P.fastTravelUnlocked) P.fastTravelUnlocked = [];
    if (!P.fastTravelUnlocked.includes('robco_factory')) P.fastTravelUnlocked.push('robco_factory');
  }
  logMsg("Construcción RobCo completada.");
  renderRobcoFactoryUI('base');
  updateStats();
}

function robcoMedicHeal() {
  ensureRobcoFactory();
  let rf = P.robcoFactory;
  let hoursSince = (P.worldHours||0) - (rf.lastMedicHour||-9999);
  if (hoursSince < 24) { logMsg("Mr. Handy necesita recargar. Vuelve más tarde."); return; }
  P.hp = getMaxHp();
  P.rads = 0;
  rf.lastMedicHour = P.worldHours || 0;
  logMsg("Mr. Handy te cura por completo (gratis). Próximo uso en 24 h.");
  renderRobcoFactoryUI('base');
  updateStats();
}

function generateRobcoCraftOffers() {
  let offers = [];
  let names = ['Protectron', 'Mr. Handy', 'Assaultron', 'Sentry Bot', 'Robobrain', 'Eyebot'];
  let plvl = P.lvl || 1;
  for (let i = 0; i < 3; i++) {
    let name = names[Math.floor(Math.random() * names.length)];
    let lvl = Math.max(1, plvl - 2 + Math.floor(Math.random() * 4));
    let hp = 40 + lvl * 8 + Math.floor(Math.random() * 20);
    let dmg = 10 + lvl * 2 + Math.floor(Math.random() * 8);
    let costQty = 4 + Math.floor(lvl * 1.5) + Math.floor(Math.random() * 4);
    let cost = [
      { id: 13, qty: costQty },
      { id: 36, qty: Math.max(1, Math.floor(costQty / 2)) },
      { id: 23, qty: Math.max(1, Math.floor(costQty * 0.6)) }
    ];
    offers.push({ name: name, level: lvl, hp: hp, dmg: dmg, cost: cost });
  }
  return offers;
}

function renderRobcoCraftUI() {
  ensureRobcoFactory();
  let rf = P.robcoFactory;
  if (!rf.craftOffers) rf.craftOffers = generateRobcoCraftOffers();
  let html = `<h2 style="color:#a0a0a0;margin-top:0;">⚙ Fabricar robots</h2>
    <p style="font-size:12px;color:#8d9880;">Fabrica compañeros robot con chatarra. Reroleo infinito.</p>`;
  rf.craftOffers.forEach((o, idx) => {
    html += `<div class="item" style="border-color:#a0a0a0 !important;">
      <b style="color:#a0a0a0;">${o.name}</b> · Nv.${o.level}<br>
      <span style="font-size:11px;color:#8d9880;">HP ${o.hp} · ATK ${o.dmg}</span><br>
      <span style="font-size:11px;">Coste: ${formatReqs(o.cost)}</span><br>
      <button style="margin-top:4px;" ${!canPayReqs(o.cost)?'disabled':''} onclick="craftRobcoCompanion(${idx})">Fabricar</button>
    </div>`;
  });
  html += `<button style="width:100%;margin-top:6px;" onclick="rerollRobcoCraft()">🔄 Rerolear ofertas</button>
    <button style="width:100%;margin-top:6px;" onclick="renderRobcoFactoryUI('factory')">← Volver</button>`;
  document.getElementById('main-view').innerHTML = html;
}

function rerollRobcoCraft() {
  ensureRobcoFactory();
  P.robcoFactory.craftOffers = generateRobcoCraftOffers();
  logMsg("Nuevas ofertas de fabricación RobCo.");
  renderRobcoCraftUI();
}

function craftRobcoCompanion(idx) {
  ensureRobcoFactory();
  let offers = P.robcoFactory.craftOffers || [];
  let o = offers[idx];
  if (!o) return;
  if (!canPayReqs(o.cost)) { logMsg("Chatarra insuficiente."); return; }
  if (!P.prison) P.prison = [];
  if (P.prison.length >= getPrisonCapacity()) { logMsg("Prisión llena."); return; }
  payReqs(o.cost);
  let comp = createCompanionFromEnemy(o.name + ' RobCo', o.level, o.hp, o.dmg, false);
  comp.type = 'robot';
  comp.weapon = getCompanionWeaponName('robot', false);
  P.prison.push(comp);
  logMsg("Fabricado: " + comp.name + " (Nv." + comp.level + "). Enviado a la prisión.");
  P.robcoFactory.craftOffers = generateRobcoCraftOffers();
  renderRobcoCraftUI();
  updateStats();
}

function acceptFactionQuest(factionId, questId) {
  ensureFactionDefaults();
  let pool = FACTION_QUEST_POOL[factionId] || [];
  let base = pool.find(q => q.id === questId);
  if (!base) return;
  if ((P.activeFactionQuests || []).some(q => q.id === questId)) return;
  // Máximo 3 misiones activas por facción
  let activeForFac = (P.activeFactionQuests || []).filter(q => q.faction === factionId);
  if (activeForFac.length >= 3) {
    logMsg("Ya tienes 3 misiones activas con esta facción. Completa alguna primero.");
    return;
  }
  // Solo aceptar si está en el pool de rotación actual
  if (P.factionQuestPool[factionId] && !P.factionQuestPool[factionId].includes(questId)) {
    logMsg("Esa misión no está disponible ahora.");
    return;
  }
  // Siempre empezar de cero: no contar objetos viejos del inventario
  if (base.type === 'collect' && base.itemId) {
    removeAllItemsByBaseId(base.itemId);
  }
  P.activeFactionQuests.push({
    ...base,
    faction: factionId,
    current: 0,
    completed: false
  });
  // Quitar del pool de rotación
  if (P.factionQuestPool[factionId]) {
    P.factionQuestPool[factionId] = P.factionQuestPool[factionId].filter(id => id !== questId);
  }
  logMsg("Misión de facción aceptada: " + base.title);
  let sett = SETTLEMENTS.find(s => s.faction === factionId && s.x === P.x && s.y === P.y);
  if (sett) renderSettlementUI(sett.id, 'missions');
  else updateStats();
}

function claimFactionQuest(questId) {
  ensureFactionDefaults();
  let idx = P.activeFactionQuests.findIndex(q => q.id === questId);
  if (idx === -1) return;
  let q = P.activeFactionQuests[idx];
  if (!q.completed) return;
  // Consumir objetos de misión requeridos
  if (q.type === 'collect' && q.itemId) {
    let need = q.target || 1;
    let have = countItemsByBaseId(q.itemId);
    if (have < need) {
      logMsg("Te faltan objetos de misión para reclamar.");
      q.completed = false;
      q.current = have;
      return;
    }
    removeItemsByBaseId(q.itemId, need);
  }
  P.caps += q.reward.caps || 0;
  addXP(q.reward.xp || 0);
  addFactionRep(q.faction, q.reward.rep || 5);
  // Rotar: invalidar pool para que salga nueva misión
  if (P.factionQuestPool[q.faction]) {
    P.factionQuestPool[q.faction] = P.factionQuestPool[q.faction].filter(id => id !== q.id);
  }
  P.activeFactionQuests.splice(idx, 1);
  logMsg("Recompensa de facción reclamada: " + q.title);
  let sett = SETTLEMENTS.find(s => s.faction === q.faction && s.x === P.x && s.y === P.y);
  if (sett) renderSettlementUI(sett.id, 'missions');
  updateStats();
}

function buyFactionItem(factionId, itemId, price) {
  let fac = FACTIONS[factionId];
  if (getFactionShopLevel(factionId) < 1) {
    logMsg("Tienda bloqueada. Necesitas 100 de reputación.");
    return;
  }
  if (P.caps < price) {
    logMsg("No tienes suficientes chapas.");

  }
  P.caps -= price;
  if ((getItemBase(itemId) && (getItemBase(itemId).type === "weapon" || getItemBase(itemId).type === "armor")) ? addLeveledGearToInv(itemId) : addItemToInv(itemId, 1)) {
    logMsg("Compraste en la tienda de facción: " + getItemBase(itemId).name);
  } else {
    P.caps += price;
    logMsg("No cabe en el inventario.");
  }
  let sett = SETTLEMENTS.find(s => s.faction === factionId && s.x === P.x && s.y === P.y);
  if (sett) renderSettlementUI(sett.id, 'shop');
  updateStats();
}

  logMsg("Viaje rápido a " + dest.name + ".");
  closeModal();
  renderMap();

  let maxhp = getMaxHp();
  let need = Math.max(0, maxhp - P.hp);
  let cost = Math.ceil(need / 2);
  if (need <= 0) { logMsg("Ya estás a máxima salud."); return; }
  if (P.caps < cost) { logMsg("No tienes chapas suficientes."); return; }
  P.caps -= cost;
  P.hp = maxhp;
  logMsg("El médico te cura por completo (" + cost + " chapas).");
  renderSettlementUI(settlementId, 'base');
  updateStats();
}

function settlementHealRad(settlementId) {
  let need = P.rads || 0;
  let cost = need * 1;
  if (need <= 0) { logMsg("No tienes radiación."); return; }
  if (P.caps < cost) { logMsg("No tienes chapas suficientes."); return; }
  P.caps -= cost;
  P.rads = 0;
  logMsg("El médico elimina toda tu radiación (" + cost + " chapas).");
  renderSettlementUI(settlementId, 'base');
  updateStats();
}

function settlementHealFull(settlementId) {
  let maxhp = getMaxHp();
  let needHp = Math.max(0, maxhp - P.hp);
  let needRad = P.rads || 0;
  let cost = Math.ceil(needHp / 2) + needRad * 1;
  if (needHp <= 0 && needRad <= 0) { logMsg("Ya estás en perfectas condiciones."); return; }
  if (P.caps < cost) { logMsg("No tienes chapas suficientes."); return; }
  P.caps -= cost;
  P.hp = maxhp;
  P.rads = 0;
  logMsg("El médico te cura por completo (salud y radiación, " + cost + " chapas).");
  renderSettlementUI(settlementId, 'base');
  updateStats();
}

function buySettlementHouse(settlementId) {
  if (!P.ownedHouses) P.ownedHouses = [];
  if (P.ownedHouses.includes(settlementId)) {
    logMsg("Ya tienes casa aquí.");
    return;
  }
  if (P.caps < 2000) {
    logMsg("Necesitas 2000 chapas.");
    return;
  }
  P.caps -= 2000;
  P.ownedHouses.push(settlementId);
  let s = SETTLEMENTS.find(x => x.id === settlementId);
  logMsg("Has comprado una casa en " + (s ? s.name : settlementId) + ".");
  renderSettlementUI(settlementId, 'base');
  updateStats();
}

  let prev = document.getElementById('rest-heal-preview');
  if (prev) {
    let heal = Math.min(Math.max(0, maxhp - P.hp), perHour * h);
    prev.textContent = 'Recuperarás ~' + heal + ' HP';
  }
}

function doHouseRest(settlementId) {
  let sel = document.getElementById('rest-hours');
  let hours = sel ? parseInt(sel.value, 10) : 1;
  if (isNaN(hours) || hours < 1) hours = 1;
  if (hours > 24) hours = 24;
  let maxhp = getMaxHp();
  let perHour = Math.max(2, Math.floor(maxhp * 0.04) + Math.floor(P.lvl * 0.5));
  let heal = perHour * hours;
  let before = P.hp;
  P.hp = Math.min(maxhp, P.hp + heal);
  let snap = {};
  if (P.prison) {
    P.prison.forEach(c => { if (!c.resting) snap[c.id] = c.hp; });
  }
  advanceTime(hours);
  if (P.prison) {
    P.prison.forEach(c => {
      if (!c.resting && snap[c.id] !== undefined) c.hp = snap[c.id];
    });
  }
  logMsg("Descansas " + hours + " h en tu casa. Recuperas " + (P.hp - before) + " HP.");
  closeModal();
  if (settlementId === 'player_home') renderPlayerSettlementUI('base');
  else renderSettlementUI(settlementId, 'base');
  updateStats();
}

/** Reproduce la pista actual de la emisora activa. Único punto que toca audio.src */
function playCurrentRadioTrack(userGesture) {
  let stationId = radioStationId;
  let st = RADIO_STATIONS[stationId];
  if (!st || !st.tracks || !st.tracks.length) return;

  let trackIdx = radioTrackIndex % st.tracks.length;
  if (trackIdx < 0) trackIdx += st.tracks.length;
  radioTrackIndex = trackIdx;

  let gen = ++radioGen;
  let audio = getRadioAudio();

  // Limpiar handlers previos
  audio.oncanplay = null;
  audio.oncanplaythrough = null;
  audio.onended = null;
  audio.onerror = null;
  try { audio.pause(); } catch (e) {}

  let fullSrc = radioResolveSrc(st.tracks[trackIdx]);
  audio.loop = false;
  audio.volume = (P.volMusic !== undefined ? P.volMusic : 0.6);
  pauseAmbientMusic();
  let cas = document.getElementById('casino-audio');
  if (cas && !cas.paused) { try { cas.pause(); } catch (e) {} }

  radioPlaying = true;

  let played = false;
  const doPlay = () => {
    if (gen !== radioGen) return;
    if (played) return;
    played = true;
    let p = audio.play();
    if (!p || typeof p.then !== 'function') {
      updateRadioStatusUI(userGesture, st, trackIdx);
      return;
    }
    p.then(() => {
      if (gen !== radioGen) return;
      radioPlaying = true;
      pauseAmbientMusic();
      updateRadioStatusUI(userGesture, st, trackIdx);
    }).catch((err) => {
      if (gen !== radioGen) return;
      played = false; // permitir reintento
      if (err && err.name === 'AbortError') {
        setTimeout(() => {
          if (gen !== radioGen) return;
          audio.play().then(() => {
            if (gen !== radioGen) return;
            radioPlaying = true;
            pauseAmbientMusic();
            updateRadioStatusUI(false, st, trackIdx);
          }).catch(() => {});
        }, 180);
        return;
      }
      console.warn('radio play', err);
      let stEl = document.getElementById('music-status');
      if (stEl) stEl.textContent = 'No se pudo reproducir esta pista. Prueba Siguiente o otra emisora.';
      logMsg('Error de radio en pista ' + (trackIdx + 1) + '. ¿Existe el MP3 en audio/?');
    });
  };

  audio.onended = function() {
    if (gen !== radioGen) return;
    if (!radioPlaying || radioStationId !== stationId) return;
    let cur = RADIO_STATIONS[radioStationId];
    if (!cur) return;
    radioTrackIndex = (radioTrackIndex + 1) % cur.tracks.length;
    playCurrentRadioTrack(false);
  };

  audio.onerror = function() {
    if (gen !== radioGen) return;
    console.warn('radio load error', st.tracks[trackIdx]);
    logMsg('No se pudo cargar: ' + st.tracks[trackIdx]);
  };

  // Un solo load → play cuando esté listo (sin doble disparo)
  audio.oncanplay = function() {
    if (gen !== radioGen) return;
    audio.oncanplay = null;
    doPlay();
  };

  try {
    audio.src = fullSrc;
    audio.load();
  } catch (e) {
    audio.src = fullSrc;
  }

  // Respaldo si oncanplay no dispara (algunos WebViews Android)
  setTimeout(() => {
    if (gen !== radioGen) return;
    if (!played) doPlay();
  }, 700);
}

function startRadioStation(stationId) {
  let st = RADIO_STATIONS[stationId];
  if (!st) return;
  let prev = radioStationId;
  // Nueva generación invalida cualquier play en curso
  radioGen++;
  let audio = getRadioAudio();
  audio.oncanplay = null;
  audio.onended = null;
  audio.onerror = null;
  try { audio.pause(); } catch (e) {}
  pauseAmbientMusic();
  let cas = document.getElementById('casino-audio');
  if (cas && !cas.paused) { try { cas.pause(); } catch (e) {} }

  radioStationId = stationId;
  radioPlaying = true;
  if (prev !== stationId) radioTrackIndex = 0;
  else if (radioTrackIndex < 0 || radioTrackIndex >= st.tracks.length) radioTrackIndex = 0;

  if (document.querySelector('.radio-panel')) openRadioTuneUI();
  playCurrentRadioTrack(true);
}

function radioPrevTrack() {

function pauseAmbientMusic() {

function captureSignal() {
  if (P.radioSignal && P.x === P.radioSignal.x && P.y === P.radioSignal.y) {
    let rewards = [];
    let capsGain = 40 + Math.floor(Math.random() * 80) + P.lvl * 5;
    P.caps += capsGain;
    rewards.push(capsGain + " chapas");
    let roll = Math.random();
    if (roll < 0.15) {
      if (addItemToInv(29, 1)) rewards.push("★ Tartera Legendaria");
    } else if (roll < 0.35) {
      if (addItemToInv(15, 1)) rewards.push("Tartera Nuka-Cola");
    } else if (roll < 0.55) {
      if (addItemToInv(14, 1)) rewards.push("Tartera Vault-Tec");
    } else if (roll < 0.75) {
      let drinks = [50, 51, 52, 53, 54];
      let d = drinks[Math.floor(Math.random() * drinks.length)];
      if (addItemToInv(d, 1)) rewards.push(getItemBase(d).name);
    } else {
      let goodJunk = [28, 36, 38, 13];
      let j = goodJunk[Math.floor(Math.random() * goodJunk.length)];
      let qty = 2 + Math.floor(Math.random() * 3);
      if (addItemToInv(j, qty)) rewards.push(qty + "x " + getItemBase(j).name);
    }
    if (Math.random() < 0.5) {
      if (addItemToInv(7, 1 + Math.floor(Math.random() * 2))) rewards.push("Estimulante");
    }
    addXP(20 + P.lvl * 3);
    logMsg("¡Señal capturada! Recompensas: " + rewards.join(", "));
    P.radioSignal = null;
    updateStats();
    openRadioCaptureUI();
    return;
  }
  let dx = (Math.floor(Math.random() * 4) + 1) * (Math.random() < 0.5 ? 1 : -1);
  let dy = (Math.floor(Math.random() * 4) + 1) * (Math.random() < 0.5 ? 1 : -1);
  if (dx === 0 && dy === 0) dx = 1;
  P.radioSignal = { x: P.x + dx, y: P.y + dy };
  let sx = P.radioSignal.x > 0 ? "+" + P.radioSignal.x : P.radioSignal.x;
  let sy = P.radioSignal.y > 0 ? "+" + P.radioSignal.y : P.radioSignal.y;
  logMsg("Señal detectada en coordenadas [" + sx + ", " + sy + "]. Desplázate hasta allí y vuelve a captar.");
  openRadioCaptureUI();
  updateStats();
}

function move(dx, dy) {
  if (isOnZetanShip()) {
    moveOnZetanShip(dx, dy);
    return;
  }
  if (P.location) {
    logMsg("Estás en un interior. Usa las salidas de la habitación o SALIR.");
    return;
  }
  P.x += dx;
  P.y += dy;
  let zone = getZoneAt(P.x, P.y);
  logMsg("Te desplazas a [" + fmtCoord(P.x) + ", " + fmtCoord(P.y) + "] — " + zone.icon + " " + zone.name + ".");
  updateQuestProgress('explore', 1);
  tickEffects();
  advanceTime(1);
  // Radiación al cruzar ríos + clima
  let wMult = getWeatherInfo().radMult || 1;
  if (zone.type === 'river') {
    addRads(Math.floor((15 + Math.floor(Math.random() * 25)) * wMult));
  } else if (Math.random() < zone.radChance * 0.3 * wMult) {
    addRads(Math.floor((3 + Math.floor(Math.random() * 8)) * wMult));
  }
  if (Math.random() < 0.08) radioEvent();
  else tryWastelandEvent('move');
  renderMap();
  updateStats();
}


function tryWastelandEvent(source) {
  if (P.location) return false;
  if (P.inCombat) return false;
  let chance = source === 'move' ? 0.14 : 0.22;
  if (Math.random() > chance) return false;
  return triggerRandomWastelandEvent(source);
}
function triggerRandomWastelandEvent(source) {
  const EVENTS = [
    { id: 'merchant', w: 18 }, { id: 'ambush', w: 16 }, { id: 'tipster', w: 14 },
    { id: 'refugee', w: 12 }, { id: 'cache', w: 12 }, { id: 'wanderer', w: 10 },
    { id: 'caravan', w: 10 }, { id: 'trap', w: 8 }
  ];
  let total = EVENTS.reduce((s, e) => s + e.w, 0);
  let roll = Math.random() * total, acc = 0, pick = EVENTS[0].id;
  for (let e of EVENTS) { acc += e.w; if (roll <= acc) { pick = e.id; break; } }
  if (pick === 'merchant') return eventMerchant();
  if (pick === 'ambush') return eventAmbush();
  if (pick === 'tipster') return eventTipster();
  if (pick === 'refugee') return eventRefugee();
  if (pick === 'cache') return eventCache();
  if (pick === 'wanderer') return eventWanderer();
  if (pick === 'caravan') return eventCaravan();
  if (pick === 'trap') return eventTrap();
  return false;
}

function exploreZone() {
  tickEffects();
  advanceTime(1);
  if (!P.location && checkLootTipOnExplore()) return;
  if (!P.location && tryWastelandEvent('explore')) return;
  let zone = P.location ? { type: P.location.type, radChance: 0.2, exploreBias: 'loot', name: getCurrentRoom()?.name } : getZoneAt(P.x, P.y);

  // Interior: evitar doble registro de misma habitación reduce loot
  if (P.location) {
    let rid = P.location.roomId;
    if (P.location.searched[rid]) {
      logMsg("Ya registraste esta habitación. Queda poco de interés.");
      if (Math.random() < 0.35) startCombat(false);
      else if (Math.random() < 0.5) {
        logMsg("No encuentras nada útil.");
        updateStats();
      } else findLoot();
      return;
    }
    P.location.searched[rid] = true;
  }

  // Radiación según zona
  if (Math.random() < (zone.radChance || 0.2)) {
    let radAmt = zone.type === 'river' ? (25 + Math.floor(Math.random() * 40)) : (5 + Math.floor(Math.random() * 20));
    addRads(radAmt);
  }

  let percBonus = (P.special.P * 0.02) + getEffectBonus('lootBonus');
  let r = Math.random();
  let bias = zone.exploreBias || 'combat';

  // Ajustar probabilidades según tipo de zona
  let combatChance = 0.35;
  let lootChance = 0.25;
  let nothingChance = 0.15;
  if (bias === 'nothing') { combatChance = 0.15; lootChance = 0.15; nothingChance = 0.45; }
  if (bias === 'loot') { combatChance = 0.25; lootChance = 0.40; }
  if (bias === 'rad') { combatChance = 0.20; lootChance = 0.20; }
  if (bias === 'combat') { combatChance = 0.45; lootChance = 0.20; }
  if (P.location) { combatChance += 0.05; lootChance += 0.10; }

  let legChance = 0.08 + (P.special.P * 0.005);
  if (r < legChance) {
    startCombat(true);
  } else if (r < legChance + combatChance - percBonus / 2) {
    startCombat(false);
  } else if (r < legChance + combatChance + lootChance + percBonus) {
    findLoot();
  } else if (r < legChance + combatChance + lootChance + nothingChance + 0.15) {
    if (bias === 'nothing') logMsg("El Yermo está desolado. Solo polvo y silencio.");
    else logMsg("No encuentras nada de valor esta vez.");
    addXP(5);
    updateStats();
  } else if (r < 0.92) {
    offerQuestEvent();
  } else {
    radioEvent();
  }
}

/* ========== NUEVO SISTEMA DE COMBATE POR TURNOS (ESTILO IMAGEN) ========== */
function isHumanEnemy(nameOrEnemy) {
  if (!nameOrEnemy) return false;
  if (typeof nameOrEnemy === 'object') {
    if (nameOrEnemy.human === true) return true;
    nameOrEnemy = nameOrEnemy.name || nameOrEnemy.enemyName || '';
  }
  let n = String(nameOrEnemy).toLowerCase();
  // No humanos: robots, mutantes, animales, necrófagos, synths...
  if (/robot|protectron|handy|sentry|assaultron|synth|supermutante|sanguinario|bestia|rata|perro|mosca|topo|necr[oó]fago|behemoth|devorador|coloso|courser/.test(n)) return false;
  if (/saqueador|mercenario|cazador|asesino|centinela del enclave|negrero|colono|patrulla|minuteman|hermandad|oficial|agente|francotirador humano/.test(n)) return true;
  return false;
}

function startCombat(isLegendary = false, forceZetan = false) {
  let onShip = forceZetan || isOnZetanShip();
  let pool;
  if (onShip) {
    pool = isLegendary ? (typeof ZETAN_LEGENDARY !== 'undefined' ? ZETAN_LEGENDARY : LEGENDARY_ENEMIES) : (typeof ZETAN_ENEMIES !== 'undefined' ? ZETAN_ENEMIES : ENEMIES);
  } else {
    pool = isLegendary ? LEGENDARY_ENEMIES : ENEMIES;
  }
  let available = pool.filter(e => e.level <= P.lvl);
  if (available.length === 0) {
    // Si no hay del nivel, coger los de menor nivel
    available = pool.filter(e => e.level <= Math.max(1, P.lvl));
    if (available.length === 0) available = [pool[0]];
  }
  let e = available[Math.floor(Math.random() * available.length)];

  // Escalar un poco HP/DMG según diferencia de nivel (opcional, suave)
  let lvlDiff = Math.max(0, P.lvl - e.level);
  let hpScale = 1 + (lvlDiff * 0.03);
  let dmgScale = 1 + (lvlDiff * 0.02);

  combatState = {
    enemyName: e.name + " (Nv." + e.level + ")",
    enemyHuman: !!(e.human || isHumanEnemy(e)),
    isZetan: !!(e.zetan || onShip),
    enemyMaxHp: Math.floor(e.hp * hpScale),
    enemyHp: Math.floor(e.hp * hpScale),
    enemyDmg: Math.floor(e.dmg * dmgScale),
    enemyLoot: e.loot,
    enemyCaps: e.caps,
    enemyLevel: e.level,
    isLegendary: !!isLegendary,
    hasHealed: false,
    poisonTurns: 0,
    armorBroken: 0,
    playerSecondChanceUsed: false,
    log: []
  };
  if (isLegendary) {
    combatLog("¡Un enemigo LEGENDARIO aparece!");
  }
  // Enemigos irradiados contaminan
  let ename = (e.name || '').toLowerCase();
  if (ename.includes('necrófago') || ename.includes('irradiad') || ename.includes('radiact')) {
    combatState.causesRads = true;
    combatLog("¡Emite radiación!");
  }
  renderCombatUI();
}

  let comp = getEquippedCompanion();
  let compHtml = '';
  if (comp && !comp.resting && comp.hp > 0) {
    let cp = Math.max(0, Math.floor((comp.hp / comp.maxHp) * 100));
    compHtml = `
    <div class="combat-entity">
      <div class="combat-entity-name player">

      </div>
    </div>`;
  }
  let hasPendant = (P.inv || []).some(x => {

  });

  let m = document.getElementById('modal');

  document.getElementById('modal-body').innerHTML = `
    <div class="combat-title">${titleText}</div>

      <div class="combat-entity-name enemy">
        <span>${combatState.isLegendary ? '★ ' : ''}${combatState.enemyName}</span>
        <span>${combatState.enemyHp} / ${combatState.enemyMaxHp}</span>
      </div>
      <div class="combat-hp-bar">

    </div>

        <span>Tú</span>
        <span>${P.hp} / ${maxhp}</span>
      </div>
      <div class="combat-hp-bar">
