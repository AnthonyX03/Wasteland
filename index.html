  setTimeout(() => {
    let box = document.getElementById('combat-log-box');
    if (box) box.scrollTop = box.scrollHeight;
  }, 30);
}

function openCaptureUI() {
  if (!combatState) return;
  let pendants = (P.inv || []).filter(x => {
    let b = getItemBase(x.id);
    return b && b.captureChance !== undefined && x.qty > 0;
  });
  if (pendants.length === 0) {
    combatLog("No tienes colgantes de prisionero.");
    renderCombatUI();
    return;
  }
  let html = `<h3 style="color:var(--gold);margin-top:0;">Capturar enemigo</h3>
    <p style="font-size:12px;">Elige un colgante. Si fallas, el enemigo contraataca.</p>`;
  pendants.forEach(p => {
    let b = getItemBase(p.id);
    let pct = Math.round((b.captureChance || 0) * 100);
    html += `<div class="item"><b>${b.name}</b> (${p.qty}) — ${pct}%
      <button style="margin-top:4px;" onclick="tryCapture(${p.uid})">Usar</button></div>`;
  });
  html += `<button style="width:100%;margin-top:8px;" onclick="renderCombatUI()">Cancelar</button>`;
  document.getElementById('modal-body').innerHTML = html;
}

function tryCapture(uid) {
  if (combatState && (combatState.combatZone || combatState.noCapture)) {
    logMsg("No se puede capturar en la Combat Zone.");
    return;
  }
  if (!combatState) return;
  let inst = (P.inv || []).find(x => x.uid === uid);
  if (!inst) { renderCombatUI(); return; }
  let base = getItemBase(inst.id);
  if (!base || base.captureChance === undefined) { renderCombatUI(); return; }
  if (!P.prison) P.prison = [];
  let cap = getPrisonCapacity();
  if (P.prison.length >= cap) {
    combatLog("¡Prisión llena! Mejora las celdas en el Refugio.");
    renderCombatUI();
    return;
  }
  // consumir 1
  if (inst.qty > 1) inst.qty--;
  else P.inv = P.inv.filter(x => x.uid !== uid);

  let chance = base.captureChance;
  if (Math.random() < chance) {
    let cleanName = combatState.enemyName.replace(/\s*\(Nv\.\d+\)/, '').replace(/^★\s*/, '');
    let comp = createCompanionFromEnemy(
      cleanName,
      combatState.enemyLevel || 1,
      combatState.enemyMaxHp,
      combatState.enemyDmg,
      !!combatState.isLegendary
    );
    P.prison.push(comp);
    let msg = "¡Captura exitosa! " + (comp.isLegendary ? "★ " : "") + comp.name + " Nv." + comp.level + " entra en la prisión.";
    if (comp.ability) msg += " Habilidad: " + comp.ability.name + ".";
    logMsg(msg);
    combatLog(msg);
    // cerrar combate sin loot de muerte
    combatState = null;
    let m = document.getElementById('modal');
    document.getElementById('modal-body').innerHTML = `
      <h2 style="color:var(--accent);">CAPTURA EXITOSA</h2>
      <p style="font-size:14px;">${comp.isLegendary ? '★ ' : ''}<b>${comp.name}</b> (Nv.${comp.level})</p>
      <p style="font-size:12px;color:#8d9880;">Tipo: ${comp.type} · HP ${comp.maxHp} · ATK ${comp.baseDmg}</p>
      ${comp.ability ? '<p style="color:var(--gold);font-size:12px;">★ ' + comp.ability.name + ': ' + comp.ability.desc + '</p>' : ''}
      <button style="width:100%;margin-top:10px;" onclick="closeModal();renderMap();updateStats();">Continuar</button>
    `;
    m.classList.add('show');
    updateStats();
    return;
  } else {
    combatLog("¡El colgante falló! El enemigo se enfurece.");
    // enemigo contraataca
    let a = getEquippedArmor();
    let aAb = getArmorAbility();
    let totalDef = a.def + getDefenseBonusFromEndurance() + getEffectBonus('def');
    let dmgTaken = Math.max(1, combatState.enemyDmg - totalDef);
    // daño a compañero primero si hay
    let comp = getEquippedCompanion();
    if (comp && !comp.resting && comp.hp > 0) {
      let st = getCompanionCombatStats(comp);
      let cdmg = Math.max(1, combatState.enemyDmg - st.def);
      if (comp.ability && comp.ability.id === 'c_hard' && !comp.hardSkinUsed) {
        comp.hardSkinUsed = true;
        combatLog(comp.name + " bloquea el golpe con Caparazón Endurecido.");
      } else {
        if (comp.ability && comp.ability.id === 'c_shield') cdmg = Math.floor(cdmg * 0.85);
        if (comp.ability && comp.ability.id === 'c_terror') cdmg = Math.floor(cdmg * 0.85);
        comp.hp -= cdmg;
        combatLog(combatState.enemyName + " golpea a " + comp.name + " por " + cdmg + ".");
        if (comp.hp <= 0) {
          comp.hp = 0;
          comp.resting = true;
          if (P.equippedCompanionId === comp.id) { /* sigue equipado pero descansa */ }
          combatLog(comp.name + " cae y debe descansar en la prisión.");
        }
      }
    } else {
      P.hp -= dmgTaken;
      combatLog(combatState.enemyName + " te golpea por " + dmgTaken + ".");
      if (P.hp <= 0) {
        P.hp = 0;
        endCombat(false);
        return;
      }
    }
    renderCombatUI();
  }
}

function companionAttack() {
  if (!combatState) return;
  let comp = getEquippedCompanion();
  if (!comp || comp.resting || comp.hp <= 0) {
    combatLog("Tu compañero no puede atacar.");
    renderCombatUI();
    return;
  }
  let st = getCompanionCombatStats(comp);
  let attacks = 1;
  if (comp.ability && comp.ability.id === 'c_swift' && Math.random() < 0.15) {
    attacks = 2;
    combatLog(comp.name + " ataca dos veces (Reflejos de Asalto)!");
  }
  let totalHit = 0;
  for (let i = 0; i < attacks; i++) {
    let hit = Math.max(1, st.dmg + Math.floor(Math.random() * 4));
    let critChance = 0.05 + (comp.special.L || 1) * 0.02;
    if (comp.ability && comp.ability.id === 'c_crit') critChance += 0.30;
    if (Math.random() < critChance) {
      let mult = (comp.ability && comp.ability.id === 'c_precise') ? 2.2 : 1.5;
      hit = Math.floor(hit * mult);
      combatLog("¡Crítico de " + comp.name + "!");
    }
    if (comp.ability && comp.ability.id === 'c_lucky' && Math.random() < 0.10) {
      hit = Math.floor(hit * 3);
      combatLog("¡Golpe de Suerte de " + comp.name + "!");
    }
    if (comp.ability && comp.ability.id === 'c_armorbreak') {
      combatState.armorBroken = (combatState.armorBroken || 0) + 3;
      hit += 3;
    }
    totalHit += hit;
    if (comp.ability && comp.ability.id === 'c_vamp') {
      let heal = Math.floor(hit * 0.20);
      comp.hp = Math.min(comp.maxHp, comp.hp + heal);
    }
    if (comp.ability && comp.ability.id === 'c_poison') {
      combatState.poisonTurns = Math.max(combatState.poisonTurns || 0, 3);
      combatState.compPoison = true;
    }
    if (comp.ability && comp.ability.id === 'c_shock' && Math.random() < 0.10) {
      combatState.enemyStunnedNext = true;
      combatLog("¡Descarga eléctrica! El enemigo puede perder el turno.");
    }
  }
  if (comp.ability && comp.ability.id === 'c_rad') {
    totalHit += 8;
    combatLog("Aura Radiactiva: +8.");
  }
  combatState.enemyHp -= totalHit;
  combatLog(comp.name + " ataca e inflige " + totalHit + " de daño" + (comp.weapon ? " con " + comp.weapon : "") + ".");

  if (comp.ability && comp.ability.id === 'c_regen') {
    let rh = Math.max(1, Math.floor(comp.maxHp * 0.05));
    comp.hp = Math.min(comp.maxHp, comp.hp + rh);
  }

  if (combatState.enemyHp <= 0) {
    combatState.enemyHp = 0;
    endCombat(true);
    return;
  }

  // turno enemigo simplificado
  enemyCombatTurn();
  if (!combatState) return;
  if (P.hp <= 0) {
    endCombat(false);
    return;
  }
  renderCombatUI();
}

function enemyCombatTurn() {
  if (!combatState) return;
  if (combatState.enemyStunnedNext) {
    combatState.enemyStunnedNext = false;
    combatLog("El enemigo está aturdido y pierde el turno.");
    return;
  }
  let a = getEquippedArmor();
  let aAb = getArmorAbility();
  let enemyDmgMult = 1;
  let comp = getEquippedCompanion();
  if (comp && comp.ability && comp.ability.id === 'c_terror') enemyDmgMult *= 0.85;

  // daño preferente al compañero activo
  if (comp && !comp.resting && comp.hp > 0) {
    let st = getCompanionCombatStats(comp);
    let cdmg = Math.max(1, Math.floor(combatState.enemyDmg * enemyDmgMult) - st.def);
    if (comp.ability && comp.ability.id === 'c_hard' && !comp.hardSkinUsed) {
      comp.hardSkinUsed = true;
      combatLog(comp.name + " absorbe el golpe (Caparazón Endurecido).");
      return;
    }
    if (comp.ability && comp.ability.id === 'c_shield') cdmg = Math.floor(cdmg * 0.85);
    comp.hp -= cdmg;
    combatLog(combatState.enemyName + " golpea a " + comp.name + " por " + cdmg + ".");
    if (comp.hp <= 0) {
      comp.hp = 0;
      comp.resting = true;
      combatLog(comp.name + " cae inconsciente. Descansará en la prisión.");
    }
    return;
  }

  let totalDef = a.def + (((P.perks && P.perks.p_skin) || 0) * 2) + getDefenseBonusFromEndurance() + getEffectBonus('def');
  if (aAb && aAb.id === 'a_tank') totalDef += 15;
  let dmgTaken = Math.max(1, Math.floor(combatState.enemyDmg * enemyDmgMult) - totalDef);
  P.hp -= dmgTaken;
  combatLog(combatState.enemyName + " te golpea por " + dmgTaken + ".");
}


function combatLog(msg) {
  if (combatState) {
    combatState.log.push(msg);
    if (combatState.log.length > 12) combatState.log.shift();
  }
}

function combatAttack() {
  if (!combatState) return;

  let w = getEquippedWeapon();
  let a = getEquippedArmor();
  let ammoKey = w.ammoType;
  let isMelee = ammoKey.includes("Ninguna");
  let wAb = getWeaponAbility();
  let aAb = getArmorAbility();

  let ironBonus = ((P.perks && P.perks.p_iron) || 0) * 3;
  let gunsBonus = (!isMelee && P.perks && P.perks.p_guns) ? (P.perks.p_guns * 2) : 0;
  let brawlerBonus = (isMelee && P.perks && P.perks.p_brawler) ? (P.perks.p_brawler * 4) : 0;
  let furyBonus = (P.hp / getMaxHp() < 0.3 && P.perks && P.perks.p_fury) ? (P.perks.p_fury * 5) : 0;

  // Bonos de habilidades legendarias de arma
  let legDmgBonus = 0;
  if (wAb) {
    if (wAb.id === 'w_precision') legDmgBonus += 8;
    if (wAb.id === 'w_fury' && P.hp / getMaxHp() < 0.4) legDmgBonus += 15;
    if (wAb.id === 'w_exec' && combatState.enemyHp / combatState.enemyMaxHp < 0.3) legDmgBonus = Math.floor((w.damage + legDmgBonus) * 0.5);
    if (wAb.id === 'w_rad') legDmgBonus += 10;
    if (wAb.id === 'w_burn') legDmgBonus += 12;
    if (wAb.id === 'w_legend' && combatState.isLegendary) legDmgBonus = Math.floor((w.damage) * 0.35);
  }
  if (aAb && aAb.id === 'a_power') legDmgBonus += 6;

  // Bonos de efectos activos (Nuka, drogas, comida...)
  legDmgBonus += getEffectBonus('dmg');
  if (isMelee) legDmgBonus += getEffectBonus('meleeDmg');

  let baseDmg = w.damage + ironBonus + gunsBonus + brawlerBonus + furyBonus + legDmgBonus;


  // --- HIPNOTRON: captura de esclavos ---
  if (w.hypno || (w.hypnoChance !== undefined)) {
    let ammoKeyH = w.ammoType;
    let isMeleeH = !ammoKeyH || String(ammoKeyH).includes("Ninguna");
    if (!isMeleeH && !(P.ammoBox[ammoKeyH] && P.ammoBox[ammoKeyH] > 0)) {
      combatLog("¡Sin Células de Hipnotron!");
      // puñetazo mínimo
      combatState.enemyHp = Math.max(0, combatState.enemyHp - 1);
      renderCombatUI();
      if (combatState.enemyHp <= 0) endCombat(true);
      else setTimeout(() => { if (combatState) enemyTurn(); }, 400);
      return;
    }
    if (!isMeleeH) P.ammoBox[ammoKeyH] = (P.ammoBox[ammoKeyH] || 1) - 1;
    playWeaponSound(w);
    let chance = w.hypnoChance || 0.2;
    let human = combatState.enemyHuman || isHumanEnemy(combatState.enemyName);
    if (!human) {
      combatLog("El Hipnotron falla: el objetivo no es humano (0% efectividad).");
      combatState.enemyHp = Math.max(0, combatState.enemyHp - 1);
      renderCombatUI();
      updateStats();
      if (combatState.enemyHp <= 0) endCombat(true);
      else setTimeout(() => { if (combatState) enemyTurn(); }, 450);
      return;
    }
    if (Math.random() < chance) {
      combatLog("¡Hipnosis exitosa! El sujeto queda sometido.");
      // Fin especial: sin loot/xp/caps
      combatState.hypnoCapture = true;
      endCombat(true);
      return;
    } else {
      combatLog("El Hipnotron no hace efecto esta vez (prob. " + Math.round(chance * 100) + "% en humanos).");
      combatState.enemyHp = Math.max(0, combatState.enemyHp - 1);
      renderCombatUI();
      updateStats();
      if (combatState.enemyHp <= 0) endCombat(true);
      else setTimeout(() => { if (combatState) enemyTurn(); }, 450);
      return;
    }
  }

  // Ataque del jugador
  let hasAmmo = isMelee || (P.ammoBox[ammoKey] && P.ammoBox[ammoKey] > 0);
  // Munición Infinita (armadura)
  if (!isMelee && aAb && aAb.id === 'a_ammo' && Math.random() < 0.10) {
    hasAmmo = true; // no consume
  }
  let hit = 0;
  let attacks = 1;

  // Disparo Doble
  if (wAb && wAb.id === 'w_double' && Math.random() < 0.15) {
    attacks = 2;
    combatLog("¡Disparo Doble!");
  }

  for (let atk = 0; atk < attacks; atk++) {
    // Cada disparo a distancia consume 1 bala
    let canShoot = isMelee || (P.ammoBox[ammoKey] && P.ammoBox[ammoKey] > 0);
    if (!isMelee && aAb && aAb.id === 'a_ammo' && Math.random() < 0.10) canShoot = true;
    if (canShoot || isMelee) {
      playWeaponSound(w);
      hit = Math.max(1, baseDmg + Math.floor(Math.random() * 4));

      // Penetración de Blindaje
      if (wAb && wAb.id === 'w_pen') {
        // se aplica después restando defensa enemiga
      }

      let critChance = (((P.perks && P.perks.p_bloody) || 0) * 0.05) + (P.special.L * 0.02) + getEffectBonus('critChance');
      if (wAb && wAb.id === 'w_crit') critChance += 0.40;
      if (Math.random() < critChance) {
        let critMult = 1.5 + (((P.perks && P.perks.p_crit) || 0) * 0.15);
        hit = Math.floor(hit * critMult);
        combatLog("¡Golpe crítico mortífero!");
      }

      // Golpe de Suerte (x3)
      if (wAb && wAb.id === 'w_lucky' && Math.random() < 0.10) {
        hit = Math.floor(hit * 3);
        combatLog("¡Golpe de Suerte! ¡Daño x3!");
      }

      // Daño en Cadena
      if (wAb && wAb.id === 'w_chain') {
        let chain = Math.floor(hit * 0.30);
        hit += chain;
        combatLog("Daño en Cadena: +" + chain);
      }

      if (!isMelee && !(aAb && aAb.id === 'a_ammo' && Math.random() < 0.10)) {
        if (P.ammoBox[ammoKey] > 0) P.ammoBox[ammoKey]--;
      }

      // Rompeblindajes: daño extra acumulativo
      if (wAb && wAb.id === 'w_armorbreak') {
        combatState.armorBroken = (combatState.armorBroken || 0) + 3;
        hit += 3;
      }

      combatLog(`Atacas con ${w.name}${w.legendary ? ' ★' : ''} e infliges ${hit} de daño.`);
    } else {
      hit = 2 + Math.floor(Math.random() * 3);
      combatLog("¡Sin munición! Atacas con los puños e infliges " + hit + " de daño.");
    }

    // Aplicar veneno
    if (wAb && wAb.id === 'w_poison') {
      combatState.poisonTurns = 3;
    }

    // Vampirismo / Sed de Sangre
    if (wAb && wAb.id === 'w_vamp') {
      let heal = Math.floor(hit * 0.20);
      P.hp = Math.min(getMaxHp(), P.hp + heal);
      if (heal > 0) combatLog("Vampirismo: +" + heal + " HP.");
    }
    if (wAb && wAb.id === 'w_lifesteal') {
      P.hp = Math.min(getMaxHp(), P.hp + 8);
      combatLog("Sed de Sangre: +8 HP.");
    }

    combatState.enemyHp -= hit;
  }

  // Daño de veneno al final del turno del jugador
  if (combatState.poisonTurns > 0) {
    combatState.enemyHp -= 5;
    combatState.poisonTurns--;
    combatLog("Veneno Persistente: 5 de daño.");
  }

  // Curación legendaria del enemigo al 25%
  if (combatState.isLegendary && !combatState.hasHealed && combatState.enemyHp > 0 &&
      combatState.enemyHp <= combatState.enemyMaxHp * 0.25) {
    combatState.enemyHp = combatState.enemyMaxHp;
    combatState.hasHealed = true;
    combatLog("¡El enemigo LEGENDARIO se regenera completamente!");
  }

  if (combatState.enemyHp <= 0) {
    combatState.enemyHp = 0;
    endCombat(true);
    return;
  }

  // ¿El enemigo está aturdido?
  let enemyStunned = false;
  if (wAb && wAb.id === 'w_stun' && Math.random() < 0.20) {
    enemyStunned = true;
    combatLog("¡El enemigo está aturdido y pierde su turno!");
  }

  // Congelante: reduce daño enemigo
  let enemyDmgMult = 1;
  if (wAb && wAb.id === 'w_freeze') enemyDmgMult = 0.75;

  if (!enemyStunned) {
    // Ataque del enemigo
    let dodgeChance = (P.special.A * 0.03) + (((P.perks && P.perks.p_reflex) || 0) * 0.05) + getEffectBonus('dodge');
    if (aAb && aAb.id === 'a_dodge') dodgeChance += 0.15;

    if (Math.random() < dodgeChance) {
      combatLog("¡Esquivaste el ataque del enemigo!");
    } else {
      let totalDef = a.def + (((P.perks && P.perks.p_skin) || 0) * 2) + getDefenseBonusFromEndurance() + getEffectBonus('def');
      if (aAb && aAb.id === 'a_tank') totalDef += 15;
      if (aAb && aAb.id === 'a_immortal') totalDef += 4;

      let rawDmg = Math.floor(combatState.enemyDmg * enemyDmgMult);
      let dmgTaken = Math.max(1, rawDmg - totalDef);

      // Espinas / Reflejo
      if (aAb && aAb.id === 'a_thorns') {
        combatState.enemyHp -= 6;
        combatLog("Espinas: el enemigo recibe 6 de daño.");
      }
      if (aAb && aAb.id === 'a_reflect') {
        let reflected = Math.floor(dmgTaken * 0.20);
        combatState.enemyHp -= reflected;
        combatLog("Reflejo de Daño: " + reflected + " devueltos.");
      }

      P.hp -= dmgTaken;
      combatLog(`${combatState.enemyName} te golpea por ${dmgTaken} de daño.`);

      // Absorción
      if (aAb && aAb.id === 'a_absorb') {
        P.hp = Math.min(getMaxHp(), P.hp + 5);
        combatLog("Absorción: +5 HP.");
      }
    }
  }

  // Regeneración de armadura
  if (aAb && aAb.id === 'a_regen') {
    P.hp = Math.min(getMaxHp(), P.hp + 4);
    combatLog("Regeneración: +4 HP.");
  }

  // Radiación de enemigos contaminados
  if (combatState.causesRads) {
    let radHit = 8 + Math.floor(Math.random() * 12);
    let res = getRadResistance();
    let actual = Math.max(1, Math.floor(radHit * (1 - res / 100)));
    P.rads = Math.min(1000, (P.rads || 0) + actual);
    combatLog("Radiación +" + actual + " (total " + P.rads + ")");
    let maxhp = getMaxHp();
    if (P.hp > maxhp) P.hp = maxhp;
  }

  // Segunda Oportunidad
  if (P.hp <= 0 && aAb && aAb.id === 'a_second' && !combatState.playerSecondChanceUsed) {
    P.hp = 1;
    combatState.playerSecondChanceUsed = true;
    combatLog("¡Segunda Oportunidad! Sobrevives con 1 HP.");
  }

  if (P.hp <= 0) {
    P.hp = 0;
    endCombat(false);
    return;
  }

  // Si el enemigo murió por espinas/reflejo
  if (combatState.enemyHp <= 0) {
    combatState.enemyHp = 0;
    endCombat(true);
    return;
  }

  updateStats();
  renderCombatUI();
}

function combatFlee() {
  if (!combatState) return;

  let fleeChance = 0.5 + (P.special.A * 0.03);
  if (P.perks && P.perks.p_ninja) fleeChance += 0.2;
  let aAb = getArmorAbility();
  if (aAb && aAb.id === 'a_speed') fleeChance += 0.20;

  if (Math.random() < fleeChance) {
    logMsg("¡Lograste huir con éxito del combate!");
    combatState = null;
    closeModal();
    updateStats();
  } else {
    combatLog("¡No pudiste huir! El enemigo te alcanza.");
    // Recibe un golpe al fallar la huida
    let a = getEquippedArmor();
    let totalDef = a.def + (((P.perks && P.perks.p_skin) || 0) * 2) + getDefenseBonusFromEndurance();
    let dmgTaken = Math.max(1, combatState.enemyDmg - totalDef);
    P.hp -= dmgTaken;
    combatLog(`${combatState.enemyName} te golpea por ${dmgTaken} de daño.`);

    if (P.hp <= 0) {
      P.hp = 0;
      endCombat(false);
      return;
    }
    updateStats();
    renderCombatUI();
  }
}

function endCombat(victory) {
  if (!combatState) return;

  let wAb = getWeaponAbility();
  let aAb = getArmorAbility();

  if (victory) {
    if (combatState.hypnoCapture) {
      addItemToInv(2305, 1);
      logMsg("El esclavo se dirige a Paradise Falls. Obtienes 1× Esclavo (Otros). Sin chapas, XP ni botín de combate.");
      combatLog("Esclavo capturado → Paradise Falls.");
      combatState = null;
      closeModal();
      updateStats();
      renderMap();
      return;
    }
    if (combatState.combatZone) {
      // Solo tickets — sin chapas, loot, legendarios ni captura
      let tix = 3 + Math.floor(Math.random() * 5) + Math.floor((combatState.enemyLevel || 1) / 3);
      P.tickets = (P.tickets || 0) + tix;
      let xpGain = 25 + Math.floor((combatState.enemyLevel || 1) * 2);
      addXP(xpGain);
      let comp = getEquippedCompanion();
      if (comp && !comp.resting) addCompanionXP(comp, 10 + Math.floor((combatState.enemyLevel || 1) * 2));
      updateQuestProgress('kill', 1);
      logMsg("Victoria en Combat Zone vs " + combatState.enemyName + ". +" + tix + " tickets · +" + xpGain + " XP.");
    } else {
    let baseReward = combatState.enemyCaps[0] + Math.floor(Math.random() * (combatState.enemyCaps[1] - combatState.enemyCaps[0]));
    let bonusMult = 1 + (((P.perks && P.perks.p_scav) || 0) * 0.25);
    if (wAb && wAb.id === 'w_caps') bonusMult += 0.50;
    if (aAb && aAb.id === 'a_caps') bonusMult += 0.30;
    let reward = Math.floor(baseReward * bonusMult);

    P.caps += reward;

    // Drop normal
    let itemDrop = combatState.enemyLoot[Math.floor(Math.random() * combatState.enemyLoot.length)];
    let itemObj = getItemBase(itemDrop);
    let itemQty = (itemObj && (itemObj.type === 'junk' || itemObj.type === 'med')) ? (1 + Math.floor(Math.random() * 2)) : 1;
    let added = addItemToInv(itemDrop, itemQty);

    // XP
    let xpGain = combatState.isLegendary ? 90 : 35;
    if (wAb && wAb.id === 'w_xp') xpGain = Math.floor(xpGain * 1.40);
    if (aAb && aAb.id === 'a_xp') xpGain = Math.floor(xpGain * 1.25);
    addXP(xpGain);
    
    let comp = getEquippedCompanion();
    if (comp && !comp.resting) {
      addCompanionXP(comp, 15 + Math.floor((combatState.enemyLevel || 1) * 3) + (combatState.isLegendary ? 40 : 0));
    }
updateQuestProgress('kill', 1);
    if (combatState.isLegendary) updateQuestProgress('kill_leg', 1);

    let lootTxt = added ? " y " + formatItemGainName(itemObj, itemQty) : " (mochila llena para el objeto)";

    // Drop legendario garantizado
    if (combatState.isLegendary) {
      let legInst = addLegendaryToInv();
      if (legInst) {
        let legBase = getItemBase(legInst.id);
        lootTxt += " ¡y un objeto LEGENDARIO: " + legBase.name + " ★ (" + legInst.abilityName + ")!";
      } else {
        lootTxt += " (mochila llena, no pudiste recoger el legendario).";
      }
    }

    // Robo de Munición
    if (wAb && wAb.id === 'w_ammo') {
      let ammoGain = 1 + Math.floor(Math.random() * 3);
      let w = getEquippedWeapon();
      if (w.ammoType && !w.ammoType.includes("Ninguna")) {
        P.ammoBox[w.ammoType] = (P.ammoBox[w.ammoType] || 0) + ammoGain;
        lootTxt += " +" + ammoGain + " balas.";
      }
    }

    logMsg("Derrotaste a " + combatState.enemyName + ". Obtienes " + reward + " chapas" + lootTxt);
    }
  } else {
    if (isOnZetanShip()) {
      onZetanShipDeath();
      return;
    }
    P.hp = 25;
    P.caps = Math.max(0, P.caps - 15);
    logMsg("Has caído derrotado. Pierdes 15 chapas.");
  }

  let wasCZ = combatState && combatState.combatZone;
  let wasShip = combatState && combatState.isZetan && isOnZetanShip();
  combatState = null;
  closeModal();
  if (wasShip) { renderZetanShipMap(); updateStats(); return; }
  if (wasCZ) {
    P.location = { type: 'combatzone', name: 'Combat Zone' };
    renderCombatZoneUI('combat');
  } else {
    renderMap();
  }
  updateStats();
}

function findLoot() {
  // Objetos de misión de facción: solo con misión activa y sin tener ya el cupo
  if (P.activeFactionQuests) {
    for (let q of P.activeFactionQuests) {
      if (q.type !== 'collect' || !q.itemId || q.completed) continue;
      let have = countItemsByBaseId(q.itemId);
      // Parche: no generar otro objeto único si ya tienes los necesarios
      if (have >= (q.target || 1)) {
        q.current = q.target || 1;
        q.completed = true;
        continue;
      }
      if (Math.random() < 0.35) {
        if (addItemToInv(q.itemId, 1)) {
          logMsg("¡Has encontrado el objeto de misión: " + getItemBase(q.itemId).name + "!");
          have = countItemsByBaseId(q.itemId);
          q.current = Math.min(q.target || 1, have);
          if (q.current >= (q.target || 1)) {
            q.completed = true;
            logMsg("¡Misión de facción lista para reclamar: " + q.title + "!");
          }
          updateStats();
          return;
        }
      }
    }
  }

  // 4% Tartera Legendaria
  if (Math.random() < 0.04) {
    if (addItemToInv(29, 1)) {
      logMsg("¡Explorando encontraste una ★ TARTERA LEGENDARIA!");
      updateQuestProgress('loot', 1);
      addXP(25);
      updateStats();
      return;
    }
  }
  // 12% bebida (Nuka / alcohol)
  if (Math.random() < 0.12) {
    let drinks = DB_ITEMS.filter(i => i.type === 'drink').map(i => i.id);
    let did = drinks[Math.floor(Math.random() * drinks.length)];
    if (addItemToInv(did, 1)) {
      logMsg("Explorando encontraste: " + getItemBase(did).name + ".");
      updateQuestProgress('loot', 1);
      addXP(15);
      updateStats();
      return;
    }
  }
  // 15% ingrediente de cocina
  if (Math.random() < 0.15) {
    let ings = DB_ITEMS.filter(i => i.type === 'ingredient').map(i => i.id);
    let iid = ings[Math.floor(Math.random() * ings.length)];
    let qty = 1 + Math.floor(Math.random() * 2);
    if (addItemToInv(iid, qty)) {
      logMsg("Explorando encontraste: " + formatItemGainName(getItemBase(iid), qty) + ".");
      updateQuestProgress('loot', 1);
      addXP(12);
      updateStats();
      return;
    }
  }

  let tierFilteredIds = DB_ITEMS.filter(i => i.shopTier <= (P.shopLevel || 1) && i.type !== 'other').map(i => i.id);
  let picked = tierFilteredIds[Math.floor(Math.random() * tierFilteredIds.length)];
  let itemObj = getItemBase(picked);
  let count = (itemObj.type === 'junk' || itemObj.type === 'med' || itemObj.type === 'ingredient') ? (1 + Math.floor(Math.random() * 3)) : 1;

  if (addItemToInv(picked, count)) {
    logMsg("Explorando encontraste: " + formatItemGainName(itemObj, count) + ".");
    updateQuestProgress('loot', 1);
  }
  addXP(15);
  updateStats();
}

function radioEvent() {
  let events = [
    "Captas una señal de radio antigua.",
    "Encuentras un alijo con 15 chapas.",
    "Una tormenta de radiación te envuelve.",
    "Un viajero misterioso te regala 1x Tartera Vault-Tec.",
    "Detectas una señal encriptada... ¡encontraste una ★ Tartera Legendaria!"
  ];
  let idx = Math.floor(Math.random() * events.length);

function renderInv(sub = P.subtab, page) {
  // Al cambiar de subcategoría, volver a página 0
  if (P.subtab !== sub) P.invPage = 0;
  P.subtab = sub;
  if (page !== undefined) P.invPage = page;
  if (P.invPage === undefined || P.invPage < 0) P.invPage = 0;

  const ITEMS_PER_PAGE = 5;

  let html = `
    <h2>INVENTARIO</h2>
    <div class="subtabs" >
      <button class="${sub === 'weapon' ? 'active' : ''}" onclick="renderInv('weapon')">Armas</button>
      <button class="${sub === 'armor' ? 'active' : ''}" onclick="renderInv('armor')">Armaduras</button>
      <button class="${sub === 'med' ? 'active' : ''}" onclick="renderInv('med')">Ayuda</button>
      <button class="${sub === 'food' ? 'active' : ''}" onclick="renderInv('food')">Comida/Bebida</button>
      <button class="${sub === 'ingredient' ? 'active' : ''}" onclick="renderInv('ingredient')">Ingredientes</button>
      <button class="${sub === 'junk' ? 'active' : ''}" onclick="renderInv('junk')">Chatarra</button>
      <button class="${sub === 'ammo' ? 'active' : ''}" onclick="renderInv('ammo')">Munición</button>
      <button class="${sub === 'other' ? 'active' : ''}" onclick="renderInv('other')">Otros</button>
    </div>
  `;

  if (sub === 'ammo') {
    html += `<div class="item">`;
    for (let [type, qty] of Object.entries(P.ammoBox)) {
      html += `<div class="row"><span>${type}</span><b>${qty} balas</b></div>`;
    }
    html += `</div>`;
    document.getElementById('main-view').innerHTML = html;
    return;
  }

  let list = P.inv.filter(inst => {
    let it = getItemBase(inst.id);
    if (!it) return false;
    if (sub === 'weapon') return it.type === 'weapon';
    if (sub === 'armor') return it.type === 'armor';
    if (sub === 'med') return it.type === 'med' || it.type === 'chem';
    if (sub === 'junk') return it.type === 'junk';
    if (sub === 'food') return it.type === 'food' || it.type === 'drink';
    if (sub === 'ingredient') return it.type === 'ingredient';
    if (sub === 'other') return it.type === 'other' || it.type === 'quest';
    return false;
  });

  if (list.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">No hay elementos en esta categoría.</p>`;
  } else {
    let totalPages = Math.max(1, Math.ceil(list.length / ITEMS_PER_PAGE));
    if (P.invPage >= totalPages) P.invPage = totalPages - 1;
    let start = P.invPage * ITEMS_PER_PAGE;
    let pageItems = list.slice(start, start + ITEMS_PER_PAGE);

    html += `<p style="font-size:11px; color:#8d9880; margin:4px 0 8px 0;">Mostrando ${start + 1}–${Math.min(start + ITEMS_PER_PAGE, list.length)} de ${list.length} · Página ${P.invPage + 1}/${totalPages}</p>`;

    pageItems.forEach(inst => {
      let it = getItemBase(inst.id);
      let isEquipped = (inst.uid === P.equippedWeaponUid || inst.uid === P.equippedArmorUid);
      let itemQty = inst.qty || 1;
      let isLeg = !!inst.legendary;
      let ilvl = inst.itemLevel || 1;
      let displayName = it.stackable && itemQty > 1 ? `${it.name} (x${itemQty})` : it.name;
      if (isLeg) displayName = "★ " + displayName;
      // Colores tarteras
      let nameColor = isLeg ? 'var(--gold)' : '';
      if (it.id === 14) nameColor = '#55aaff';
      if (it.id === 15) nameColor = '#e05050';
      if (it.id === 29) nameColor = 'var(--gold)';
      if (it.robcoModule || it.id === 3500) nameColor = 'var(--gold)';
      let borderExtra = isLeg || it.robcoModule || it.id === 3500 ? 'border-color:var(--gold);'
        : (it.id===14?'border-color:#3388ff;':it.id===15?'border-color:#e05050;':it.id===29?'border-color:var(--gold);':'');

      let modDmg = (inst.mods || []).reduce((acc, mId) => acc + (MODS_DB.find(x => x.id === mId)?.bonusDmg || 0), 0);
      let modDef = (inst.mods || []).reduce((acc, mId) => acc + (MODS_DB.find(x => x.id === mId)?.bonusDef || 0), 0);

      html += `
        <div class="item" style="${borderExtra}">
          <div class="item-head">
            <b style="${nameColor ? 'color:'+nameColor+';' : ''}">${displayName}</b>
            <span>
              ${isLeg ? `<span class="equipped-tag" style="border-color:var(--gold); color:var(--gold);">LEGENDARIA</span> ` : ''}
              ${isEquipped ? `<span class="equipped-tag">EQUIPADO</span>` : ''}
            </span>
          </div>
      `;

      let scale = getItemLevelBonus(ilvl);
      let modScale = getModLevelScale(ilvl);
      let scaledModDmg = Math.floor(modDmg * modScale);
      let scaledModDef = Math.floor(modDef * modScale);
      if (sub === 'weapon') {
        let scaledDmg = Math.max(1, Math.floor(it.damage * scale) + scaledModDmg);
        html += `<span style="font-size:12px; color:var(--accent);">Lv:${ilvl} · Daño: +${scaledDmg} | Munición: ${it.ammoType || 'Cuerpo a cuerpo'}</span><br>`;
        if (it.hypno || it.hypnoChance !== undefined) {
          let pct = Math.round((it.hypnoChance || 0.2) * 100);
          html += `<span style="font-size:11px; color:#aa6644;">⚡ Hipnosis ${pct}% en humanos → captura Esclavo (sin XP/loot/chapas). Ineficaz vs no humanos.</span><br>`;
          if (it.effectDesc) html += `<span style="font-size:10px; color:#8d9880;">${it.effectDesc}</span><br>`;
        } else if (it.effectDesc) {
          html += `<span style="font-size:11px; color:var(--gold);">${it.effectDesc}</span><br>`;
        }
      } else if (sub === 'armor') {
        let scaledDef = Math.max(0, Math.floor(it.def * scale) + scaledModDef);
        let baseRad = getBaseRadRes(it);
        let scaledRad = baseRad > 0 ? Math.floor(baseRad * scale) : 0;
        html += `<span style="font-size:12px; color:var(--accent);">Lv:${ilvl} · Defensa: +${scaledDef} · Res.RAD: ${scaledRad}%</span><br>`;
      } else if (sub === 'med') {
        if (it.heal) html += `<span style="font-size:12px; color:var(--accent);">Curación: +${it.heal} Salud</span><br>`;
        if (it.effectDesc) html += `<span style="font-size:11px; color:var(--gold);">${it.effectDesc} (${it.effectActions || 0} acciones)</span><br>`;
      } else if (sub === 'food') {
        if (it.heal) html += `<span style="font-size:12px; color:var(--accent);">Curación: +${it.heal}</span><br>`;
        if (it.effectDesc) html += `<span style="font-size:11px; color:var(--gold);">${it.effectDesc} (${it.effectActions || 0} acciones)</span><br>`;
      } else if (sub === 'other') {
        if (it.id === 14) html += `<span style="font-size:12px; color:#55aaff;">Tartera Vault-Tec — abre en REFUGIO.</span><br>`;
        else if (it.id === 15) html += `<span style="font-size:12px; color:#e05050;">Tartera Nuka-Cola — abre en REFUGIO.</span><br>`;
        else if (it.id === 29) html += `<span style="font-size:12px; color:var(--gold);">Tartera Legendaria — abre en REFUGIO.</span><br>`;
        else if (it.robcoModule || it.id === 3500) html += `<span style="font-size:12px; color:var(--gold);">★ Módulo Legendario — úsalo en Fábrica RobCo para mejorar un robot.</span><br>`;
        else if (it.slave || it.id === 2305) html += `<span style="font-size:12px; color:#aa6644;">⛓ ${it.effectDesc || 'Véndelo en Paradise Falls por 500 chapas + reputación.'}</span><br>`;
        else if (it.zetanBlood || it.id === 2400) html += `<span style="font-size:12px; color:#66ffaa;">🧬 ${it.effectDesc || 'Véndela a los Nucleólogos: 100 chapas + 5 rep.'}</span><br>`;
        else if (it.effectDesc) html += `<span style="font-size:12px; color:var(--gold);">${it.effectDesc}</span><br>`;
        else html += `<span style="font-size:12px; color:var(--gold);">Objeto especial.</span><br>`;
      }

      if ((sub === 'weapon' || sub === 'armor') && inst.mods && inst.mods.length > 0) {
        let modNames = inst.mods.map(mId => MODS_DB.find(x => x.id === mId)?.name || mId).join(", ");
        html += `<span style="font-size:11px; color:var(--gold);">Módulos: ${modNames}</span><br>`;
      }

      if (isLeg && inst.abilityName) {
        html += `<span style="font-size:12px; color:var(--gold);">★ ${inst.abilityName}: ${inst.abilityDesc}</span><br>`;
      }

      let unitWeight = (it.weight * itemQty).toFixed(1);
      let sellVal = isLeg ? Math.floor(it.value * 3) : it.value;
      html += `<span style="font-size:11px; color:#8d9880;">Peso Total: ${unitWeight}kg | Valor Unitario: ${sellVal} chapas</span><br>`;

      let canSellHere = typeof isAtCommerce === 'function' && isAtCommerce();
      if (sub === 'weapon' || sub === 'armor') {
        if (!isEquipped) {
          html += `<div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">`;
          html += `<button onclick="equipItem(${inst.uid})">Equipar</button>`;
          if (canSellHere) html += `<button onclick="sellItem(${inst.uid})">Vender</button>`;
          html += `</div>`;
        }
      } else if (sub === 'med' || sub === 'food') {
        html += `<div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">`;
        if (it.type === 'med' || it.type === 'food' || it.type === 'drink' || it.useDesc || it.useEffect || it.heal || it.radRemove) {
          html += `<button onclick="useMedItem(${inst.uid})">Usar 1</button>`;
        }
        if (canSellHere) html += `<button onclick="sellItem(${inst.uid})">Vender 1</button>`;
        html += `</div>`;
      } else if (sub === 'junk' || sub === 'other' || sub === 'ingredient') {
        if (canSellHere && !it.robcoModule && it.id !== 3500) {
          html += `<button style="margin-top:6px;" onclick="sellItem(${inst.uid})">Vender 1</button>`;
        } else if (canSellHere && (it.robcoModule || it.id === 3500)) {
          html += `<span style="font-size:11px;color:#8d9880;">No se vende — solo para mejorar robots en RobCo.</span>`;
        }
      }

      html += `</div>`;
    });

    // Controles de paginación
    if (totalPages > 1) {
      html += `<div style="display:flex; justify-content:center; gap:10px; margin-top:12px; align-items:center;">`;
      html += `<button ${P.invPage <= 0 ? 'disabled' : ''} onclick="renderInv('${sub}', ${P.invPage - 1})">◀ Anterior</button>`;
      html += `<span style="font-size:12px; color:var(--accent);">Pág. ${P.invPage + 1} / ${totalPages}</span>`;
      html += `<button ${P.invPage >= totalPages - 1 ? 'disabled' : ''} onclick="renderInv('${sub}', ${P.invPage + 1})">Siguiente ▶</button>`;
      html += `</div>`;
    }
  }

  document.getElementById('main-view').innerHTML = html;
}

function equipItem(uid) {
  let inst = P.inv.find(i => i.uid === uid);
  if (!inst) return;
  let it = getItemBase(inst.id);
  
  if (it.type === 'weapon') P.equippedWeaponUid = uid;
  if (it.type === 'armor') P.equippedArmorUid = uid;
  
  logMsg("Equipaste " + it.name + ".");
  renderInv();
  updateStats();
}

function sellItem(uid) {
  if (!isAtCommerce()) {
    logMsg("Solo puedes vender en la Zona de Comercio [+3, -3].");
    return;
  }
  let inst = P.inv.find(i => i.uid === uid);
  if (!inst) return;
  let it = getItemBase(inst.id);
  if (!it) return;
  if (it.robcoModule || it.id === 3500) {
    logMsg("El Módulo Legendario RobCo no se puede vender.");
    return;
  }
  if (it.slave || it.noCommerceSell || it.id === 2305) {
    logMsg("Los esclavos solo se venden en Paradise Falls (Negreros).");
    return;
  }

  let sellBonus = 1 + (((P.perks && P.perks.p_barter) || 0) * 0.15);
  let aAb = getArmorAbility();
  if (aAb && aAb.id === 'a_barter') sellBonus += 0.25;
  let baseVal = inst.legendary ? it.value * 3 : (it.value || 1);
  let finalValue = Math.max(1, Math.floor(baseVal * sellBonus));

  P.caps += finalValue;

  if (inst.qty && inst.qty > 1) {
    inst.qty--;
  } else {
    P.inv = P.inv.filter(i => i.uid !== uid);
  }

  logMsg("Vendiste 1x " + (inst.legendary ? "★ " : "") + it.name + " por " + finalValue + " chapas.");
  renderInv(P.subtab);
  updateStats();
}

function useMedItem(uid) {
  let inst = P.inv.find(i => i.uid === uid);
  if (!inst) return;
  let it = getItemBase(inst.id);
  if (!it) return;

  let bonusHeal = ((P.perks && P.perks.p_medic) || 0) * 15;
  if (it.type === 'med') {
    bonusHeal += getEffectBonus('stimBonus');
    let aAb = getArmorAbility();
    if (aAb && aAb.id === 'a_medic') bonusHeal = Math.floor(((it.heal || 0) + bonusHeal) * 0.4);
  }
  let totalHeal = (it.heal || 0) + (it.type === 'med' ? bonusHeal : 0);

  if (it.useEffect === 'caps') {
    let gain = 75;
    P.caps += gain;
    logMsg("Usaste " + it.name + ": +" + gain + " chapas.");
  } else if (it.useEffect === 'ultraluxe_chips') {
    addCasinoChips('ultraluxe', it.id === 3248 ? 50 : 30);
    logMsg("Usaste " + it.name + ": +" + (it.id === 3248 ? 50 : 30) + " fichas Ultra-Luxe.");
  } else if (it.useEffect === 'vikki_chips') {
    addCasinoChips('vikki', 40);
    logMsg("Usaste " + it.name + ": +40 fichas Vikki & Vance.");
  } else if (it.useEffect === 'atomic_chips') {
    addCasinoChips('atomic', 40);
    logMsg("Usaste " + it.name + ": +40 fichas Atomic Wrangler.");
  } else if (it.useEffect === 'gomorrah_chips') {
    addCasinoChips('gomorrah', 40);
    logMsg("Usaste " + it.name + ": +40 fichas Gomorrah.");
  } else if (it.useEffect === 'tops_chips') {
    addCasinoChips('tops', it.id === 3238 ? 80 : 50);
    logMsg("Usaste " + it.name + ": +" + (it.id === 3238 ? 80 : 50) + " fichas The Tops.");
  } else if (it.useEffect === 'luck') {
    let luckAmt = (it.id === 3010 || it.id === 3237) ? 3 : 2;
    let acts = it.id === 3010 ? 6 : (it.id === 3247 ? 14 : 10);
    applyConsumableEffect({
      effectId: 'casino_luck', effectName: it.name || 'Suerte de casino', effectDesc: '+' + luckAmt + ' Suerte',
      effectActions: acts, effectBonus: { luck: luckAmt }
    });
    logMsg("Usaste " + it.name + ": +" + luckAmt + " Suerte (" + acts + " acciones).");
  } else if (it.useEffect === 'charisma') {
    let chaAmt = it.id === 3244 ? 2 : 1;
    let acts = it.id === 3244 ? 10 : 8;
    applyConsumableEffect({
      effectId: 'casino_cha', effectName: it.name || 'Vino de casino', effectDesc: '+' + chaAmt + ' Carisma',
      effectActions: acts, effectBonus: { cha: chaAmt }
    });
    if (totalHeal > 0) P.hp = Math.min(getMaxHp(), P.hp + totalHeal);
    logMsg("Usaste " + it.name + ": +" + (totalHeal||0) + " HP y +" + chaAmt + " Carisma (" + acts + " acciones).");
  } else if (it.useEffect === 'perception') {
    let acts = it.id === 3234 ? 14 : 12;
    applyConsumableEffect({
      effectId: 'casino_per', effectName: it.name, effectDesc: '+2 Percepción',
      effectActions: acts, effectBonus: { per: 2 }
    });
    logMsg("Usaste " + it.name + ": +2 Percepción (" + acts + " acciones).");
  } else if (it.useEffect === 'strength') {
    applyConsumableEffect({
      effectId: 'casino_str', effectName: it.name, effectDesc: '+2 Fuerza',
      effectActions: 12, effectBonus: { str: 2 }
    });
    logMsg("Usaste " + it.name + ": +2 Fuerza (12 acciones).");
  } else if (it.useEffect === 'agility') {
    applyConsumableEffect({
      effectId: 'casino_agi', effectName: it.name, effectDesc: '+2 Agilidad',
      effectActions: 12, effectBonus: { agi: 2 }
    });
    logMsg("Usaste " + it.name + ": +2 Agilidad (12 acciones).");
  } else if (it.useEffect === 'dmg') {
    applyConsumableEffect({
      effectId: 'casino_dmg', effectName: it.name, effectDesc: '+5 daño',
      effectActions: 10, effectBonus: { dmg: 5 }
    });
    if (totalHeal > 0) P.hp = Math.min(getMaxHp(), P.hp + totalHeal);
    logMsg("Usaste " + it.name + ": +" + (totalHeal||0) + " HP y +5 daño (10 acciones).");
  } else if (it.useEffect === 'def') {
    applyConsumableEffect({
      effectId: 'casino_def', effectName: it.name, effectDesc: '+8 defensa',
      effectActions: 10, effectBonus: { def: 8 }
    });
    logMsg("Usaste " + it.name + ": +8 defensa (10 acciones).");
  } else if (totalHeal > 0) {
    P.hp = Math.min(getMaxHp(), P.hp + totalHeal);
    logMsg("Usaste 1x " + it.name + " y recuperaste " + totalHeal + " de salud.");
    if (it.id === 3153) { removeRads(10); logMsg("También -10 RAD."); }
    if (it.radRemove) { removeRads(it.radRemove); logMsg("También -" + it.radRemove + " RAD."); }
  } else if (it.radRemove) {
    removeRads(it.radRemove);
  } else if (it.id === 3143) {
    P._nextEnemyDmgReduce = 0.3;
    logMsg("Veneno de mesa listo: el próximo golpe enemigo hará -30% daño.");
  } else {
    logMsg("Usaste 1x " + it.name + ".");
  }

  if (it.effectId) applyConsumableEffect(it);

  if (inst.qty && inst.qty > 1) {
    inst.qty--;
  } else {
    P.inv = P.inv.filter(i => i.uid !== uid);
  }

  renderInv(P.subtab || 'med');
  updateStats();
}

function quickHeal() {
  let inst = P.inv.find(x => getItemBase(x.id)?.type === 'med');
  if (inst) useMedItem(inst.uid);
  else logMsg("No dispones de estimulantes en el inventario.");
}

function capsPriceHtml(amount) {

function renderShop(sub = P.shopSubtab || 'weapon', page) {
  if (P.shopSubtab !== sub) P.shopPage = 0;
  P.shopSubtab = sub;
  if (page !== undefined) P.shopPage = page;
  if (P.shopPage === undefined || P.shopPage < 0) P.shopPage = 0;
  if (!P.shopLevel) P.shopLevel = 1;

  const ITEMS_PER_PAGE = 5;
  let discountPct = (P.special.C * 0.02) + (((P.perks && P.perks.p_trader) || 0) * 0.10);
  let isMaxShop = P.shopLevel >= 10;
  let nextShopCost = P.shopLevel === 1 ? 1000 : P.shopLevel === 2 ? 2000 : P.shopLevel * 2000;

  let html = `
    <h2>COMERCIANTE</h2>
    <div class="subtabs">
      <button class="${sub === 'weapon' ? 'active' : ''}" onclick="renderShop('weapon')">Armas</button>
      <button class="${sub === 'armor' ? 'active' : ''}" onclick="renderShop('armor')">Armaduras</button>
      <button class="${sub === 'med' ? 'active' : ''}" onclick="renderShop('med')">Ayuda</button>
      <button class="${sub === 'junk' ? 'active' : ''}" onclick="renderShop('junk')">Chatarra</button>
      <button class="${sub === 'ammo' ? 'active' : ''}" onclick="renderShop('ammo')">Munición</button>
      <button class="${sub === 'other' ? 'active' : ''}" onclick="renderShop('other')">Otros</button>
    </div>

    <div class="item" style="border-color: var(--gold); background: #151a12; margin-bottom: 12px;">
      <b>⭐ MEJORA DE NIVEL DE TIENDA</b><br>
      <span style="font-size:12px; color:var(--gold);">Nivel de Tienda actual: ${P.shopLevel} / 10</span><br>
      <span style="font-size:11px; color:#8d9880;">${isMaxShop ? 'NIVEL MÁXIMO DE TIENDA ALCANZADO (Desbloquea Servoarmaduras y Mini Nukes)' : 'Desbloquea más equipo avanzado | Precio mejora: ' + nextShopCost + ' chapas'}</span><br>
      <button style="margin-top:6px;" ${isMaxShop ? 'disabled' : ''} onclick="upgradeShop()">${isMaxShop ? 'Tienda al Máximo' : 'Mejorar Tienda (Nivel Siguiente)'}</button>
    </div>

    <div class="item" style="border-color: var(--accent); background: #151a12; margin-bottom: 12px;">
      <b>🎒 MEJORA DE MOCHILA BASE</b><br>
      <span style="font-size:12px; color:#a8c47a;">Capacidad de mochila actual: ${P.baseMaxWeight} / 500 kg</span><br>
      <span style="font-size:11px; color:#8d9880;">${P.baseMaxWeight >= 500 ? 'MÁXIMA CAPACIDAD ALCANZADA' : '+25 kg mochila | Precio: ' + P.bagUpgradeCost + ' chapas'}</span><br>
      <button style="margin-top:6px;" ${P.baseMaxWeight >= 500 ? 'disabled' : ''} onclick="upgradeBag()">${P.baseMaxWeight >= 500 ? 'Capacidad Máxima' : 'Aumentar Capacidad'}</button>
    </div>
    
    <h3 style="color:var(--accent); margin-top:10px;">OBJETOS EN VENTA (${Math.floor(discountPct * 100)}% Descuento)</h3>
  `;

  let list = DB_ITEMS.filter(it => {
    if (!it) return false;
    if (it.factionOnly) return false;
    if (it.casinoOnly) return false;
    if (it.casino) return false;
    if (it.casinoModule) return false;
    if (it.robcoModule) return false; // solo desguace robots legendarios
    if (it.combatZone) return false; // solo Combat Zone
    if (it.shopTier === 99) return false;
    if (it.shopTier === undefined || it.shopTier === null) return false;
    if (it.shopTier > P.shopLevel) return false;
    if (sub === 'weapon') return it.type === 'weapon';
    if (sub === 'armor') return it.type === 'armor';
    if (sub === 'med') return it.type === 'med' || it.type === 'chem';
    if (sub === 'ammo') return it.type === 'ammo';
    if (sub === 'junk') return it.type === 'junk';
    if (sub === 'other') return it.type === 'other';
    return false;
  });

  if (list.length === 0) {
    html += `<p style="font-size:12px; color:#8d9880;">El comerciante no tiene artículos de esta categoría a la venta en este nivel de tienda.</p>`;
  } else {
    let totalPages = Math.max(1, Math.ceil(list.length / ITEMS_PER_PAGE));
    if (P.shopPage >= totalPages) P.shopPage = totalPages - 1;
    let start = P.shopPage * ITEMS_PER_PAGE;
    let pageItems = list.slice(start, start + ITEMS_PER_PAGE);

    html += `<p style="font-size:11px; color:#8d9880;">Mostrando ${start + 1}–${Math.min(start + ITEMS_PER_PAGE, list.length)} de ${list.length} · Pág. ${P.shopPage + 1}/${totalPages}</p>`;

    pageItems.forEach(it => {
      let basePrice = it.value * 2;
      let price = Math.max(1, Math.floor(basePrice * (1 - discountPct)));

      html += `
        <div class="item">
          <b>${it.name}</b> — <span style="color:#e05050;">${capsPriceHtml(price)}</span><br>
          <span style="font-size:11px; color:#8d9880;">
            ${it.damage ? 'Daño: ' + it.damage + ' · ' : ''}
            ${it.def ? 'Defensa: ' + it.def + ' · ' : ''}
            ${it.heal ? 'Cura: ' + it.heal + ' · ' : ''}
            ${it.radRemove ? 'Quita ' + it.radRemove + ' RAD · ' : ''}
            ${it.qty ? 'Cantidad: ' + it.qty + ' balas · ' : ''}
            ${it.type === 'junk' ? 'Componente para el Taller' : ''}
            ${it.type === 'other' ? 'Contenedor especial de botín' : ''}
            ${it.effectDesc ? it.effectDesc : ''}
          </span><br>
          <button style="margin-top:6px;" onclick="buyItem(${it.id}, ${price})">Comprar 1</button>
        </div>
      `;
    });

    if (totalPages > 1) {
      html += `<div style="display:flex; justify-content:center; gap:10px; margin-top:12px; align-items:center;">
        <button ${P.shopPage <= 0 ? 'disabled' : ''} onclick="renderShop('${sub}', ${P.shopPage - 1})">◀ Anterior</button>
        <span style="font-size:12px; color:var(--accent);">Pág. ${P.shopPage + 1} / ${totalPages}</span>
        <button ${P.shopPage >= totalPages - 1 ? 'disabled' : ''} onclick="renderShop('${sub}', ${P.shopPage + 1})">Siguiente ▶</button>
      </div>`;
    }
  }

  document.getElementById('main-view').innerHTML = html;
}

function upgradeShop() {
  if (P.shopLevel >= 10) {
    logMsg("La tienda ya ha alcanzado el nivel máximo (10).");
    return;
  }
  let cost = P.shopLevel === 1 ? 1000 : P.shopLevel === 2 ? 2000 : P.shopLevel * 2000;
  if (P.caps < cost) {
    logMsg("No tienes suficientes chapas para mejorar la tienda al siguiente nivel.");
    return;
  }

  P.caps -= cost;
  P.shopLevel++;
  logMsg("¡Tienda mejorada al Nivel " + P.shopLevel + "! Nuevos objetos y servoarmaduras disponibles.");

  renderShop(P.shopSubtab);
  updateStats();
}

function upgradeBag() {
  if (P.baseMaxWeight >= 500) {
    logMsg("Has alcanzado la capacidad máxima de mochila (500kg).");
    return;
  }
  if (P.caps < P.bagUpgradeCost) {
    logMsg("No tienes suficientes chapas para mejorar la mochila.");
    return;
  }

  P.caps -= P.bagUpgradeCost;
  P.baseMaxWeight += 25;
  logMsg("Mochila mejorada (+25kg).");
  P.bagUpgradeCost = Math.floor(P.bagUpgradeCost * 1.5);

  renderShop(P.shopSubtab);
  updateStats();
}

function buyItem(id, price) {
  if (P.caps < price) {
    logMsg("No tienes suficientes chapas.");
    return;
  }
  let base = getItemBase(id);
  let success = (base && (base.type === 'weapon' || base.type === 'armor'))
    ? addLeveledGearToInv(id)
    : addItemToInv(id, 1);
  if (success) {
    P.caps -= price;
    logMsg("Compraste 1x " + (base?.name || id) + (base && (base.type === 'weapon' || base.type === 'armor') ? (" (Nv." + (P.lvl || 1) + ")") : "") + ".");
  }
  renderShop(P.shopSubtab);
  updateStats();
}

function switchTab(type, btn) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (type === 'map') renderMap();
  if (type === 'char') renderCharacter();
  if (type === 'inv') renderInv('weapon');
  if (type === 'vault') {
    if (!isAtVault()) {
      document.getElementById('main-view').innerHTML = `<h2 style="color:#66b3ff;">⌂ REFUGIO</h2>
        <p style="font-size:13px;">Debes estar en <b style="color:#66b3ff;">El Refugio [0, 0]</b> para usar este apartado.</p>
        <p style="font-size:12px;color:#8d9880;">Usa Viaje rápido → Ubicaciones importantes → El Refugio.</p>
        <button style="width:100%;margin-top:10px;" onclick="switchTab('map', document.querySelector('.tabs button'))">Ir al mapa</button>`;
      return;
    }
    renderVault(P.vaultSubtab || 'lunchboxes');
  }
  if (type === 'quests') renderQuests();
  if (type === 'shop') {
    if (!P.commerceUnlocked) {
      document.getElementById('main-view').innerHTML = `<h2 style="color:#ffcc44;">⚖ COMERCIO</h2>
        <p style="font-size:13px;">Aún no has desbloqueado el comercio.</p>
        <p style="font-size:12px;color:#8d9880;">Ve a la <b style="color:#ffcc44;">Zona de Comercio [+3, -3]</b>, entra y pulsa Desbloquear.</p>
        <button style="width:100%;margin-top:10px;" onclick="switchTab('map', document.querySelector('.tabs button'))">Ir al mapa</button>`;
      return;
    }
    if (!isAtCommerce()) {
      document.getElementById('main-view').innerHTML = `<h2 style="color:#ffcc44;">⚖ COMERCIO</h2>
        <p style="font-size:13px;">Debes estar en la <b style="color:#ffcc44;">Zona de Comercio [+3, -3]</b> para usar este apartado.</p>
        <button style="width:100%;margin-top:10px;" onclick="switchTab('map', document.querySelector('.tabs button'))">Ir al mapa</button>`;
      return;
    }
    renderShop('weapon');
  }
}

function closeModal() { 
  document.getElementById('modal').classList.remove('show'); 
  if (combatState) combatState = null;
}

// Sonido estilo Pip-Boy (clic UI) y SFX de combate
let _pipCtx = null;
function getAudioCtx() {
  if (!_pipCtx) _pipCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_pipCtx.state === 'suspended') _pipCtx.resume();
  return _pipCtx;
}
function pipClick() {
  try {
    let ctx = getAudioCtx();
    let vol = (P.volSfx !== undefined ? P.volSfx : 0.7);
    let t = ctx.currentTime;
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(440, t + 0.04);
    gain.gain.setValueAtTime(0.08 * vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.06);
  } catch (e) {}
}

function playWeaponSound(weapon) {
  try {
    let ctx = getAudioCtx();
    let vol = (P.volSfx !== undefined ? P.volSfx : 0.7) * 0.35;
    let t = ctx.currentTime;
    let ammo = (weapon && weapon.ammoType) || 'Ninguna';
    let name = ((weapon && weapon.name) || '').toLowerCase();
    let isMelee = ammo.includes('Ninguna');
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    let type = 'square';
    let f0 = 200, f1 = 80, dur = 0.12;

    if (isMelee) {
      // Golpe cuerpo a cuerpo
      type = 'sawtooth'; f0 = 120; f1 = 40; dur = 0.1;
    } else if (ammo.includes('escopeta') || name.includes('escopeta')) {
      type = 'sawtooth'; f0 = 180; f1 = 60; dur = 0.18; vol *= 1.2;
    } else if (ammo.includes('Misil') || ammo.includes('Mini') || name.includes('lanzacohetes') || name.includes('fat man')) {
      type = 'sawtooth'; f0 = 90; f1 = 30; dur = 0.25; vol *= 1.4;
    } else if (ammo.includes('plasma') || ammo.includes('energ') || ammo.includes('fusión') || ammo.includes('microfusión') || name.includes('láser')) {
      type = 'sine'; f0 = 1200; f1 = 400; dur = 0.1;
    } else if (ammo.includes('10mm') || ammo.includes('.38') || ammo.includes('.45') || ammo.includes('pistola') || name.includes('pistola')) {
      type = 'square'; f0 = 400; f1 = 100; dur = 0.08;
    } else if (ammo.includes('5.56') || ammo.includes('7.62') || ammo.includes('.308') || name.includes('rifle') || name.includes('fusil')) {
      type = 'square'; f0 = 500; f1 = 120; dur = 0.09;
    } else {
      type = 'square'; f0 = 350; f1 = 90; dur = 0.09;
    }

    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (e) {}
}

function renameSurvivor() {
  let current = P.playerName || "Superviviente";
  let name = prompt("Nombre del superviviente:", current);
  if (name === null) return;
  name = name.trim().slice(0, 24);
  if (!name) {
    logMsg("Nombre no válido.");
    return;
  }
  P.playerName = name;
  logMsg("Ahora te llamas " + name + ".");
  updateStats();
}

function saveGame() {
  localStorage.setItem("wl_save_v16", JSON.stringify(P));
  logMsg("Partida guardada.");
}

function loadGame() {
  let raw = localStorage.getItem("wl_save_v16");
  if (!raw) {
    logMsg("No hay partida guardada.");
    return;
  }
  try {
    let parsed = JSON.parse(raw);
    // Aplicar defaults como en init
    if (!parsed.special) parsed.special = { S: 1, P: 1, E: 1, C: 1, I: 1, A: 1, L: 1 };
    if (!parsed.perks) parsed.perks = {};
    if (!parsed.playerName) parsed.playerName = "Superviviente";
    if (parsed.rads === undefined) parsed.rads = 0;
    if (!parsed.storage) parsed.storage = [];
    if (!parsed.activeEffects) parsed.activeEffects = [];
    if (parsed.storageMaxWeight === undefined) parsed.storageMaxWeight = 100;
    if (parsed.worldHours === undefined) parsed.worldHours = 9;
    if (!parsed.weather) parsed.weather = 'day';
    if (!parsed.reputation) parsed.reputation = {};
    ['bos','enclave','outcasts','settlers','railroad','rnc','strip','institute','atom','minutemen'].forEach(k => {
      if (parsed.reputation[k] === undefined) parsed.reputation[k] = 0;
    });
    if (!parsed.activeFactionQuests) parsed.activeFactionQuests = [];
    if (!parsed.factionQuestPool) parsed.factionQuestPool = {};
    if (parsed.volMusic === undefined) parsed.volMusic = 0.6;
    if (parsed.chips === undefined) parsed.chips = 0;
    if (!parsed.playerSettlement) parsed.playerSettlement = { claimed: false, name: '', level: 1, settlers: 0, farmCaps: 0, houseBuilt: false, travelBuilt: false, medicBuilt: false };
    if (parsed.volSfx === undefined) parsed.volSfx = 0.7;
    if (!parsed.fastTravelUnlocked) parsed.fastTravelUnlocked = [];
    if (!parsed.ownedHouses) parsed.ownedHouses = [];
    if (!parsed.prison) parsed.prison = [];
    if (parsed.equippedCompanionId === undefined) parsed.equippedCompanionId = null;
    if (parsed.prisonLevel === undefined) parsed.prisonLevel = 1;
    if (parsed.prisonPage === undefined) parsed.prisonPage = 0;
    if (parsed.travelPage === undefined) parsed.travelPage = 0;
    if (parsed.location === undefined) parsed.location = null;
    P = parsed;
    stopRadioMusic();
    logMsg("Partida cargada. Bienvenido, " + (P.playerName || "Superviviente") + ".");
    renderMap();
    updateStats();
  } catch (e) {
    logMsg("Error al cargar la partida.");
  }
}

function resetGame() {
  if (!confirm("¿Reiniciar partida? Se borrará el guardado actual.")) return;
  stopRadioMusic();
  localStorage.removeItem("wl_save_v16");
  location.reload();
}

// INICIALIZACIÓN

    if (parsed.alchemyLevel === undefined) parsed.alchemyLevel = 1;

    if (parsed.craftPage === undefined) parsed.craftPage = 0;
    if (parsed.storagePage === undefined) parsed.storagePage = 0;
    if (parsed.shopPage === undefined) parsed.shopPage = 0;
    if (parsed.rads === undefined) parsed.rads = 0;
    if (!parsed.playerName) parsed.playerName = "Superviviente";
    if (parsed.radioSignal === undefined) parsed.radioSignal = null;
    if (parsed.location === undefined) parsed.location = null;
    if (parsed.worldHours === undefined) parsed.worldHours = 9;
    if (!parsed.weather) parsed.weather = 'day';
    if (!parsed.reputation) parsed.reputation = {};
    ['bos','enclave','outcasts','settlers','railroad','rnc','strip','institute','atom','minutemen'].forEach(k => {
      if (parsed.reputation[k] === undefined) parsed.reputation[k] = 0;
    });
    if (!parsed.activeFactionQuests) parsed.activeFactionQuests = [];
    if (!parsed.factionQuestPool) parsed.factionQuestPool = {};
    if (parsed.volMusic === undefined) parsed.volMusic = 0.6;
    if (parsed.volSfx === undefined) parsed.volSfx = 0.7;
    if (!parsed.fastTravelUnlocked) parsed.fastTravelUnlocked = [];
    if (!parsed.ownedHouses) parsed.ownedHouses = [];
    if (!parsed.prison) parsed.prison = [];
    if (parsed.equippedCompanionId === undefined) parsed.equippedCompanionId = null;
    if (parsed.prisonLevel === undefined) parsed.prisonLevel = 1;
    if (parsed.prisonPage === undefined) parsed.prisonPage = 0;
    if (parsed.travelPage === undefined) parsed.travelPage = 0;
    if (parsed.ammoBox) {
      for (let k in P.ammoBox) {
        if (parsed.ammoBox[k] === undefined) parsed.ammoBox[k] = P.ammoBox[k];
      }
      if (parsed.ammoBox["Célula de Hipnotron"] === undefined) parsed.ammoBox["Célula de Hipnotron"] = 0;
    }
    P = parsed;
  } catch (e) {}
}

logMsg("Bienvenido al Yermo. Fabrica, modifica tus objetos y sobrevive.");
renderMap();
updateStats();

// Música ambiente offline (se pausa con la radio)
startAmbientMusic();
// Desbloquear audio tras primera interacción (políticas del navegador)
document.addEventListener('pointerdown', function ambientUnlockOnce() {
  startAmbientMusic();
  document.removeEventListener('pointerdown', ambientUnlockOnce);
}, { once: true });

// Clic Pip-Boy en todos los botones
document.addEventListener('click', function(e) {
  if (e.target && e.target.closest && e.target.closest('button')) {
    pipClick();
  }
}, true);

// PWA: registrar Service Worker (offline)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      console.log('SW registrado', reg.scope);
    }).catch(function(err) {
      console.log('SW no disponible (abre desde servidor local/HTTPS):', err.message);
    });
  });
}
